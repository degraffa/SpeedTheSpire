# --- B3.9: remaining statuses (4) + curses (11) ------------------------------
# Design §5.1: 5 statuses (Wound landed id 24) + 11 curses (10 poolable + the
# A10+ starter Ascender's Bane). Unplayable (cost -2) -> UNPLAYABLE flag; the
# passive behaviors run their `effects` program at a trigger hook (end_of_turn /
# on_draw / on_other_card_played), NOT on play (they are unplayable). color/rarity
# are documentation-only (gen.py does not read them): CURSE cards are
# CardColor.CURSE / CardRarity.CURSE, statuses COLORLESS/COMMON per the Java ctor.
#
# CORRECTION (oracle STS00048, floor 1): `trigger: end_of_turn` is not merely
# "run this program at end of turn". triggerOnEndOfTurnForPlayingCard re-queues
# the card into the cardQueue with dontTriggerOnUseCard set, so the card PLAYS
# ITSELF -- the program below is its `use()` body, and the card LEAVES THE HAND
# for the discard pile at that moment, ahead of the DiscardAtEndOfTurnAction
# sweep that files the rest of the hand. See dispatch_card_end_of_turn
# (src/engine/card_play.cpp) for the citations and for the reshuffle-order
# divergence that pinned it.

# STATUS: Burn -- end-of-turn self THORNS damage (2, upg 4).
- id: 25
  name: BURN
  game_id: "Burn"
  color: COLORLESS
  rarity: COMMON
  type: STATUS
  cost: -2
  target: NONE
  flags: []
  trigger: end_of_turn
  provenance: "Burn (Burn.java:29-33): cost -2 STATUS COLORLESS NONE; magicNumber 2 (baseMagic 2). triggerOnEndOfTurnForPlayingCard (Burn.java:53-56) sets dontTriggerOnUseCard and re-queues itself; use() with dontTriggerOnUseCard -> DamageAction(player, DamageInfo(player, magicNumber, THORNS)) (Burn.java:43-47). THORNS self-damage: reduced by block, NOT scaled by the player's own Strength/Vulnerable. upgrade() upgradeMagicNumber(2) -> 4 (Burn.java:64-71). Maps to trigger=end_of_turn + a self DAMAGE(THORNS) program (base 2 / upgraded 4)."
  effects:
    - {op: DAMAGE, target: SELF, amount: 2, damage_type: THORNS}
  upgraded:
    - {op: DAMAGE, target: SELF, amount: 4, damage_type: THORNS}

