# --- Colorless UNCOMMON cards (ids 92-111 in CardLibrary library order) -------
# CardLibrary.addColorlessCards (CardLibrary.java:799-834) adds the 35 colorless
# cards ALPHABETICALLY, and ids 92-111 map 1:1 onto the twenty UNCOMMONs in that
# order. Preserving it costs nothing now and is what lets the colorless combat
# pool be emitted in library order later, avoiding the documented interim
# deviation kIroncladAttackPool still carries (registry-id order).
#
# Ids 92-111 are COMPLETE: the two interior ids held back while the engine had no
# optional-selection machinery -- 101 Forethought and 109 Purity -- are filled in
# below, each in its library-order position. The loader enforces id UNIQUENESS,
# never contiguity, so nothing depended on the holes; they are simply gone.
#
# OPTIONAL (zero-to-N) CHOOSE_CARD steps enter the authoring vocabulary with
# those two. `optional: true` marks a hand-select screen opened with
# anyNumber && canPickZero: it selects between ZERO and `amount` cards and is
# ended by an explicit confirm rather than by reaching a count. The public
# ActionMask grows a confirm move to match (advance.hpp).
#
# Every row below carries `color: COLORLESS`, so none of them joins
# kIroncladAttackPool (which is `color == "RED"`-gated) -- its count is unchanged.

