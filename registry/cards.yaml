# --- Colorless RARE cards (B3.11, stages A and B) -----------------------------
# CardLibrary.addColorlessCards (CardLibrary.java:799-834) adds the colorless
# cards ALPHABETICALLY; ids 112-126 map 1:1 onto the fifteen RAREs in that
# order (the twenty UNCOMMONs above exhaust at 111). B3.11 is split into
# several stages, each with its own orchestrator-allocated id subset: stage A
# owns 112, 116, 120, 124; stage B owns 121, 122, 126; stage C owns 113, 115,
# 117, 118, 125 -- the generated-card family.
#
# The remaining INTERIOR GAPS (114, 119, 123) are deliberate placeholders owned
# by the LAST B3.11 stage, not errors -- the same sparse-id shape 101/109 used
# for B3.10c. The loader enforces id UNIQUENESS, never contiguity, so the holes
# cost nothing at runtime. Never renumber to close one.
#
# Every row below carries `color: COLORLESS`, so none of them joins
# kIroncladAttackPool / kIroncladSkillPool / kIroncladCombatPool (all three
# `color == "RED"`-gated); all twelve join kColorlessCombatPool (COLORLESS +
# UNCOMMON/RARE, minus HEALING -- none of these twelve is HEALING-tagged), which
# is the pool Jack of All Trades, Magnetism and Transmutation all draw from, so
# each stage-C row is also a possible OUTPUT of two of its own siblings.

