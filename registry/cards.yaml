  provenance: "Exhume (Exhume.java:19-46): cost 1, exhaust, upgradeBaseCost(0) -> 0; use (:30-32) queues ExhumeAction(upgrade = false) -- the upgrade is a COST change only, the action behaves identically in both rows. ExhumeAction.update (ExhumeAction.java:38-113): return immediately when the hand already holds 10 cards (:40-43) or the exhaust pile is empty (:45-48); with exactly one exhausted card, take it with no screen unless it is an Exhume (:49-68); otherwise lift every Exhume copy out of the pile (:74-80), give up if nothing is left (:81-86), else open a one-pick grid select (:87) and move the pick to the hand (:91-102). A moved SKILL gets setCostForTurn(-9) while the player has Corruption (:57-59 and :94-96) -- free for the turn. Encoded as the CHOOSE_CARD verb with the exhaust-pile source: eligibility drops Exhume copies and is empty while the hand is full, so all three early-outs collapse into `no eligible card -> nothing happens`, and a single eligible card auto-resolves rather than prompting (identical final state, one fewer screen)."
  effects:
    - {op: CHOOSE_CARD, target: SELF, amount: 1, choose: exhaust_to_hand}
  upgraded_cost: 0
  upgraded:
    - {op: CHOOSE_CARD, target: SELF, amount: 1, choose: exhaust_to_hand}

