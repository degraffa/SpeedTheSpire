  provenance: "Feed (Feed.java:26-59): cost 1, baseDamage 10, upgradeDamage(2) -> 12, magic 3, upgradeMagicNumber(1) -> 4, exhaust, tags.add(CardTags.HEALING); use (:40-45) is a VFXAction then FeedAction(m, damage, magic). FeedAction.update (FeedAction.java:34-47): target.damage(info) -- the ordinary pipeline -- then, if the target ended up dead (isDying || currentHealth <= 0) and is neither halfDead nor a Minion, player.increaseMaxHp(magic, false). increaseMaxHp (AbstractCreature.java:199-208) raises maxHealth by the amount and THEN heals by the same amount, which runs the onPlayerHeal relic pass (Magic Flower) -- so the gain goes through the shared heal seam, not a raw HP write. halfDead and the Minion power have no S1 Act-1 producer, so those two guards are constant-false here."
  effects:
    - {op: DAMAGE_FEED, target: CARD_TARGET, amount: 10, max_hp: 3}
  upgraded:
    - {op: DAMAGE_FEED, target: CARD_TARGET, amount: 12, max_hp: 4}

