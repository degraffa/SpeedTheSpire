# --- Red RARE (ids 76-91) -----------------------------------------------------
# Enumerated from source: the sixteen cards/red/*.java whose constructor passes
# CardRarity.RARE. Rows are in that (alphabetical file) order. Every use(),
# constructor and the action/power class each one reaches was read in full before
# encoding; the citation on each row names the lines the numbers came from.
#
# Feed and Reaper carry `healing: true` -- the CardTags.HEALING their constructors
# add (Feed.java:38, Reaper.java:37). It is not decoration: the generated
# kIroncladAttackPool (the Infernal Blade / returnTrulyRandomCardInCombat(ATTACK)
# pool) is built from color/rarity/type MINUS the healing column, so without these
# two flags the other rare attacks would land in the pool alongside two cards the
# game excludes.

