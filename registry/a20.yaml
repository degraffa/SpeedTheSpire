- id: 20
  level: 20
  scope: monster
  mechanic: "double boss on the final act"
  provenance: "ProceedButton.update (ProceedButton.java:100-104): ascensionLevel >= 20 && bossList.size() == 2 -> goToDoubleBoss(), gated on AbstractDungeon.id.equals(\"TheBeyond\"). AbstractMonster.onFinalBossVictoryLogic (AbstractMonster.java:1058-1060) reads the same pair."
  notes: "IMPLEMENTED (S2.28: finish_combat_after_action's double-boss branch, run_advance.cpp -- the gate reads `ascension >= 20 && boss_list_count - (boss_cursor + 1) == 2`, which is the Java's post-entry-pop bossList.size() == 2 spelled against a cursor that advances on room EXIT; the crossing is a full next_room_transition, so the trap-7 reseed and relic room-entry fan-outs run, no reward screen opens at either Act-3 boss, and the second kill is the run's only terminal). Ownership history: originally assigned S2.12, which landed without it; REASSIGNED to S2.28 in the Wave-3 allocation note (stage-b-tasks.md). The S1 frozen negative stands unchanged: the route is Act-3-only (the TheBeyond gate above), so A20 still adds NOTHING to an Act-1 run beyond the union of levels 1..19, and the Act-2 negative is pinned by a named test (run_advance_test.cpp BossVictory)."
