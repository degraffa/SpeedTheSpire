- id: 4
  level: 4
  scope: monster
  mechanic: "boss damage and move parameters"
  # DELIBERATE, AND NOT A DOCUMENT CONFLICT -- do not "fix" the asymmetry with
  # registry/monsters.yaml (recorded resolution, integration-11; row discharged
  # 2026-07-28). The `tackleDmg = 10` below is LITERALLY ACCURATE at the cited
  # line: the A4 branch of SlimeBoss's constructor really does assign it. But
  # `tackleDmg` feeds `damage.get(0)`, and SlimeBoss NEVER READS `damage.get(0)`
  # -- both takeTurn arms read `damage.get(1)` (SlimeBoss.java:137 and :144),
  # the slamDmg slot. So `tackleDmg` is a DEAD DamageInfo: an A4 scaling the
  # game computes and never applies.
  # This row is the A20 LEDGER, whose job is to record what the ascension branch
  # does in the Java -- so it names both assignments, the dead one included.
  # `registry/monsters.yaml` is the BEHAVIOUR table, whose job is to record what
  # the monster does -- so it omits `tackleDmg`, and is right to. The two files
  # differ because they answer different questions; that is why this is a
  # comment and not an edit on either side.
  provenance: "Per-boss constructor branches on ascensionLevel >= 4, e.g. TheGuardian.<init> (TheGuardian.java:107-109): fierceBashDamage = 36, rollDamage = 10; SlimeBoss.<init> (SlimeBoss.java:94-96): tackleDmg = 10, slamDmg = 38 -- tackleDmg is damage.get(0), which SlimeBoss never reads (both takeTurn arms use damage.get(1), :137/:144), so that half of the A4 branch is dead in the game and is deliberately absent from monsters.yaml; see the comment above."
  notes: "IMPLEMENTED (per-monster columns in registry/monsters.yaml) for the Act-1 bosses that exist."

- id: 5
  level: 5
  scope: run-setup
  mechanic: "between-act heal is 75% of MISSING HP instead of a full heal"
  provenance: "AbstractDungeon.dungeonTransitionSetup (AbstractDungeon.java:2582-2586): ascensionLevel >= 5 -> player.heal(MathUtils.round((maxHealth - currentHealth) * 0.75f), false), else player.heal(maxHealth, false)."
  notes: "IMPLEMENTED (act_transition, run_advance.cpp -- the S2.12 share; arithmetic pinned in act_transition_test.cpp: 75% of MISSING HP with MathUtils.round half-up at A5+, full heal below, and the onPlayerHeal fan-out pass around it including Mark of the Bloom's absolute suppression). THE S1 RUN-SETUP NEGATIVE STANDS UNCHANGED: the same line runs on the floor-0 entry, but the character sheet arrives at full HP (80 of 80, Ironclad.java:114), so missing HP is 0 and BOTH branches are no-ops there. Its POSITION is still load-bearing and is honoured: it runs BEFORE the A14/A6/A10 block, so it can never see the reduced max HP; pinned by the run-setup sweep. S2 note (S2.04): the SAME line (AbstractDungeon.java:2582-2586, cited above) also runs at the Act 1->2 and Act 2->3 transitions, where missing HP is typically nonzero, so the branch stops being a no-op there and the between-act heal becomes live (s2-design.md §2.5); that engine work was owned by S2.12 (act transition) and LANDED 2026-08-07 with its own tier-2 coverage. Status flipped to IMPLEMENTED 2026-08-09 by the S2-G1 gate sweep, per this row's own instruction that it not move before its owner landed."

- id: 6
  level: 6
  scope: run-setup
  mechanic: "act starts at 90% of max HP"
  provenance: "AbstractDungeon.dungeonTransitionSetup (AbstractDungeon.java:2594-2596): ascensionLevel >= 6 -> currentHealth = MathUtils.round(maxHealth * 0.9f). MathUtils.round (MathUtils.java:233-235) is (int)((double)v + 16384.5) - 16384."
  notes: "IMPLEMENTED (run_begin). ORDER IS LOAD-BEARING: this runs AFTER the A14 max-HP loss inside the same floorNum <= 1 block, so at A14+ the 90% is taken of the ALREADY-REDUCED max. Ironclad: 90% of 75 = 67.5 -> 68, not 90% of 80 = 72. S2 note (S2.04), verified run-start-only: the A6/A10/A14 modifiers all live inside the SAME `floorNum <= 1 && dungeon instanceof Exordium` guard as the run-setup block itself (AbstractDungeon.java:2590), one level above the ascensionLevel checks cited above -- so none of the three recur at the Act 1->2 or Act 2->3 transition; only the A5 heal and the fixed-list/pity resets run every act. This S1 implementation is therefore already correct as run-start-only, and the Acts 2-3 negative is pinned by the tier-2 sweep."

