# a20.yaml -- ascension modifier table (rules-as-data, design doc B §6).
#
# Entry shape (frozen, design doc B §6):
#   - id: <int>            numeric id -- append-only, NEVER renumbered
#     level: <int>         ascension level (1..20)
#     scope: run-setup | monster | economy | event
#     mechanic: "<short description>"
#     provenance: "<Class.method (File.java:line) -- read in full>"
#     notes: "<optional>"
#
# Numbers live here ONLY after the cited line has been read during that row's task
# (stage-a §11 rule). This domain generates no enum; codegen validates entries and
# reports the row count in the manifest only.
#
# ONE ROW PER ASCENSION LEVEL, and `id` == `level`. Design §6's table groups
# levels that share a mechanism family (A2/A3/A4, A7/A8/A9, A17/A18/A19); this
# file splits them so "one row per modifier" is literal and every §6 table row
# maps onto at least one row here. There will never be a level 21, so id == level
# stays append-only by construction.
#
# `notes` opens with the row's S1 STATUS, one of:
#   IMPLEMENTED (<where>)   -- live in the sim, with tier-2 tests
#   N/A-FOR-S1 (<reason>)   -- deliberately not implemented; the reason is frozen
#
# THE NEGATIVE FREEZE. Design §6's "negative results, frozen so nobody 'fixes'
# them in later reading" list is recorded here as `no-such-modifier` statements so
# that a later reader who "finds" one of these has to delete a written line rather
# than merely add code. Each carries the line that was read to establish it:
#
#   no-such-modifier: campfire heal -- RestOption.<init> (RestOption.java:25)
#     computes healAmt = (int)(maxHealth * 0.3f) with NO ascensionLevel branch
#     anywhere in the constructor; the only modifiers are the Night Terrors daily
#     mod and the endless-mode FullBelly blight.
#   no-such-modifier: potion-drop chance -- AbstractRoom.addPotionToRewards
#     (AbstractRoom.java:580-607) sets chance = 40 for elite/monster/event rooms,
#     adjusts it only by blizzardPotionMod (the +-10 ratchet at :604-606) and the
#     White Beast Statue override; no ascensionLevel appears in the method.
#   no-such-modifier: normal-combat gold -- AbstractRoom.update
#     (AbstractRoom.java:324) is treasureRng.random(10, 20), unbranched.
#   no-such-modifier: elite-combat gold -- AbstractRoom.update
#     (AbstractRoom.java:316) is treasureRng.random(25, 35), unbranched. Only the
#     BOSS payout has an ascension branch (that is row id 13).
#   no-such-modifier: card-reward RARITY -- AbstractDungeon.rollRarity
#     (AbstractDungeon.java:1597-1603) is cardRng.random(99) + cardBlizzRandomizer
#     handed to getCardRarity; getCardRarityFallback (:1606-1614) hard-codes
#     rareRate = 3 / 40. No ascensionLevel term on either path.
#
# Rows 12 and 20 are the two ascension levels that are themselves negatives in S1;
# they carry their own N/A-FOR-S1 reason below.

- id: 1
  level: 1
  scope: run-setup
  mechanic: "elite room quota x1.6 during map room-type assignment"
  provenance: "AbstractDungeon.generateRoomTypes (AbstractDungeon.java:571-573): ascensionLevel >= 1 -> eliteCount = Math.round(availableRoomCount * eliteRoomChance * 1.6f), else Math.round(availableRoomCount * eliteRoomChance). Act-1 eliteRoomChance = 0.08f (Exordium.java:99)."
  notes: "IMPLEMENTED (assign_room_types, map_rooms.hpp -- the ascension argument run_begin already passes through). Pinned by the elite-quota row test."

