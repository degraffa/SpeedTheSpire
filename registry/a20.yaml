- id: 10
  level: 10
  scope: run-setup
  mechanic: "Ascender's Bane curse added to the master deck at run start"
  provenance: "AbstractDungeon.dungeonTransitionSetup (AbstractDungeon.java:2597-2600): ascensionLevel >= 10 -> player.masterDeck.addToTop(new AscendersBane()). CardGroup.addToTop (CardGroup.java:455-457) is group.add(c) -- an ArrayList APPEND (addToBottom, :459-461, is the group.add(0, c) one). AscendersBane.<init> (AscendersBane.java:23-26): cost -2, CURSE/SPECIAL, isEthereal."
  notes: "IMPLEMENTED (run_begin). POSITION IS LOAD-BEARING: AbstractDungeon.<init> calls dungeonTransitionSetup at AbstractDungeon.java:287 and p.initializeStarterDeck only at :295-296, so the master deck is EMPTY when the curse is appended and the starting 5 Strike / 4 Defend / 1 Bash (AbstractPlayer.initializeStarterDeck, AbstractPlayer.java:386-390, also addToTop) land AFTER it. Ascender's Bane is therefore master-deck index 0."

- id: 11
  level: 11
  scope: run-setup
  mechanic: "one fewer potion slot (3 -> 2)"
  provenance: "AbstractPlayer.<init> (AbstractPlayer.java:211-213): ascensionLevel >= 11 -> --potionSlots, over the field default potionSlots = 3 (AbstractPlayer.java:144); the slot list is then built to that count (:214-217)."
  notes: "IMPLEMENTED (potion_slot_count, potions.hpp; stored into RunState by run_begin). Applied EARLIEST of all run-setup modifiers: it is in the AbstractPlayer constructor, which runs before the AbstractDungeon constructor that calls dungeonTransitionSetup."

- id: 12
  level: 12
  scope: economy
  mechanic: "card rewards can arrive pre-upgraded"
  provenance: "Exordium.initializeLevelSpecificChances (Exordium.java:107): cardUpgradedChance = 0.0f for Act 1, so the A12 branch has nothing to scale in Exordium. TheCity.initializeLevelSpecificChances (TheCity.java:84): cardUpgradedChance = ascensionLevel >= 12 ? 0.125f : 0.25f. TheBeyond.initializeLevelSpecificChances (TheBeyond.java:81): cardUpgradedChance = ascensionLevel >= 12 ? 0.25f : 0.5f."
  notes: "IMPLEMENTED (card_upgraded_chance, combat_rewards.hpp -- S2.12 keyed the chance on (act, ascension) at its use site, pinned value-by-value in act_transition_test.cpp; the Act-1 draw keeps its stream position, and S2.24 made the Act-2 card reward observable end-to-end, combat_rewards.cpp). THE S1 FROZEN NEGATIVE STANDS (design §6): A12 remains a NO-OP in Act 1 because Exordium pins the upgrade chance to 0.0f -- no-such-modifier for S1, and the Act-1 arm of card_upgraded_chance returns 0.0f at every ascension, so nothing was added to Act 1. S2 note (S2.04): Acts 2-3 do NOT pin the chance to 0 -- TheCity and TheBeyond (cited above) instead HALVE their act's base chance at A12 (0.25->0.125 in Act 2, 0.5->0.25 in Act 3), the per-act 0.125/0.25 halving of s2-design.md §2.5. Status flipped to IMPLEMENTED 2026-08-09 by the S2-G1 gate sweep: S2.12's Log deferred the flip to whichever task first made an Act-2 card reward observable end-to-end -- that was S2.24, which did not carry the one-row edit, so the gate sweep discharges it."

- id: 13
  level: 13
  scope: economy
  mechanic: "boss combat gold x0.75"
  provenance: "AbstractRoom.update battle-over block (AbstractRoom.java:291-296): tmp = 100 + miscRng.random(-5, 5); ascensionLevel >= 13 -> addGoldToRewards(MathUtils.round(tmp * 0.75f)), else addGoldToRewards(tmp). The miscRng draw happens on BOTH branches, so the stream is unaffected by the level. The branch is keyed off `this instanceof MonsterRoomBoss` (AbstractRoom.java:286), not an act check, so it fires for every MonsterRoomBoss instance including the A20 double boss's synthetic second one (goToDoubleBoss, ProceedButton.java:210-220; MonsterRoomBoss.onPlayerEntry pops bossList, MonsterRoomBoss.java:27-36). Separately, the Mind Bloom event's own boss re-fight branches the SAME threshold independently for a fixed payout with no miscRng draw: MindBloom.java:73-77, ascensionLevel >= 13 -> addGoldToRewards(25), else addGoldToRewards(50)."
  notes: "IMPLEMENTED (roll_boss_gold, combat_rewards.cpp -- one miscRng draw on both branches, x0.75 MathUtils rounding at >= 13; reward assembly consumes it for every Act-1/2 boss screen and run_advance.cpp draws-and-discards it for Act 3). This row read N-A-FOR-S1 while the run layer assembled no rewards; that prerequisite arrived with the reward-assembly work and the last open share landed with S2.24 below. NOTE the negative twin: normal and elite gold have no such branch (see the no-such-modifier block at the top of this file). S2 note (S2.04): in Acts 2-3 (incl. the double boss) each MonsterRoomBoss fight draws its OWN independent miscRng.random(-5, 5) and applies the same x0.75 rounding -- two draws, two payouts, at the double boss (cited above). Mind Bloom's fixed 25/50 payout is a separate ascensionLevel >= 13 branch with no miscRng draw at all -- that share LANDED with S2.33 (src/engine/events/beyond_events.cpp mind_bloom_choose seeds the fixed 25/50 gold row with zero stream movement, pinned by beyond_events_test.cpp MindBloom.WarSeedsFixedGoldAndOneRareRelicRewardBeforeTheFight, which asserts BOTH the 25-at-A13 value and that exactly one misc draw -- the boss shuffle's randomLong -- happened); the standard boss-gold draw for Act-2/3 fights is owned by S2.24 (City bosses) and owned by S2.28 (Beyond bosses). S2.28's share LANDED: every Act-3 MonsterRoomBoss fight -- both rooms of the A20 double boss included -- draws its own miscRng.random(-5, 5) through roll_boss_gold (run_advance.cpp), which applies this row's x0.75 rounding; the payout is then discarded exactly as the game discards it (no Act-3 reward screen ever opens to claim it), pinned differentially against an Act-2 twin in run_advance_test.cpp. The S2.24 share LANDED TOO: with the three City-boss rows registered the Act-2 boss room is a real combat, its kill assembles a reward screen through the same roll_boss_gold, and the gold item is the FIRST scaled payout the player can actually claim -- the >= 13 / < 13 boundary is pinned per-seed in combat_rewards_test.cpp (RewardGold.BossGoldQuartersExactlyAtA13NotA12) and the end-to-end Act-2 claimable band in run_advance_test.cpp (BossVictory.TheActTwoBossRoomEntersARealCombatAndPaysA13ScaledGold). With both shares landed this row is IMPLEMENTED everywhere a MonsterRoomBoss exists."

- id: 14
  level: 14
  scope: run-setup
  mechanic: "-5 max HP at run start (character-specific amount)"
  provenance: "AbstractDungeon.dungeonTransitionSetup (AbstractDungeon.java:2591-2593): ascensionLevel >= 14 -> player.decreaseMaxHealth(player.getAscensionMaxHPLoss()). Ironclad.getAscensionMaxHPLoss (Ironclad.java:168-170) returns 5. AbstractCreature.decreaseMaxHealth (AbstractCreature.java:211-223) subtracts, floors maxHealth at 1, and CLAMPS currentHealth down to the new maxHealth."
  notes: "IMPLEMENTED (run_begin). Runs FIRST of the three floorNum <= 1 modifiers, ahead of A6 -- see row 6. The clamp in decreaseMaxHealth is why HP is 75 for one statement before A6 rewrites it."

