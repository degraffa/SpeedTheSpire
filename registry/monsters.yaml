        - {op: DAMAGE, target: PLAYER, amount: {base: 6, a3: 7}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 6, a3: 7}}
    - name: SCYTHE
      move_id: 3               # Nemesis.java:58
      intent: ATTACK           # setMove(3, ATTACK, 45) (:159,179,188)
      effects:
        # SCYTHE_DMG 45 (:50), FLAT at every ascension -- no tier column.
        # ChangeStateAction, playSfx (UNSEEDED MathUtils.random(1), :196) and
