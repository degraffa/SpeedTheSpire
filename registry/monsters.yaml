very record that is not null, not this and not isDying -- it does NOT exclude escaped monsters and is NOT restricted to the gremlins[] array. die (:224-241): super.die() FIRST, then a ShoutAction pass and an EscapeAction over every non-dying record -- the post-super slot. damage()/changeState() are presentation."
