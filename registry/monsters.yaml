- id: 52
  name: EXPLODER
  game_id: "Exploder"
  provenance: "Exploder (Exploder.java, read in full, 94 lines). ID \"Exploder\" (:28). ENCOUNTER_NAME \"Ancient Shapes\" (:33) is DEAD CONTENT, as on the Repulsor. ctor (:50-62): super passes the LITERAL 30 (:51) -- no draw -- then setHp(30,35) at ascension >= 7 else setHp(30,30) (:56-60). setHp(30,30) STILL DRAWS: Random.random(int,int) is start + nextInt(end - start + 1) and ++counter is unconditional (random/Random.java:58-61), so nextInt(1) consumes a value. This is the OPPOSITE of the SphericGuardian (monsters.yaml id 30), which skips the draw because setHp is never CALLED -- the two must not be conflated, and the degenerate {30,30} column below is spelled out rather than omitted so the difference stays visible. attackDmg = ascension >= 2 ? 11 : 9 (:61), a plain ternary. usePreBattleAction (:64-67): ApplyPowerAction(this, this, new ExplosivePower(this, 3)) -- powers.yaml id 100, at the 3-arg default stack amount 3. Move ids ATTACK=1, BLOCK=2 (:44,48); EXPLODE_BASE 3 (:49) is the power's starting fuse, passed at :66. takeTurn (:69-84) opens with ++turnCount (:71); case 2 is a LITERAL EMPTY CASE (:78-80) -- the Exploder's move 2 does nothing at all, and the self-destruct is the POWER's duringTurn, not the move. Both cases reach the trailing RollMoveAction (:82). getMove (:86-92) NEVER READS num -- the aiRng draw still happens and still moves the shared stream (the Guardian / Spheric Guardian precedent)."
