      intent: ATTACK           # setMove(1, ATTACK, dmg[0].base, 2, true) (:164) --
                               # the "2, true" is the multi-hit TELEGRAPH
                               # (CHOMP_AMT, :63); the two hits are the two steps.
      effects:
        # TWO SEPARATE DamageActions on damage.get(0) (:106-107). chompDmg 8, or 9
        # from A2 (:83,86). ChangeState + Wait (:104-105) are presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 8, a2: 9}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 8, a2: 9}}
    - name: HARDEN
      move_id: 2               # Darkling.java:65
      intent: DEFEND_BUFF      # THE INTENT IS ASCENSION-SWITCHED: DEFEND_BUFF at
                               # A17+ (:152,171), plain DEFEND below (:154,173).
                               # This column carries the value at the engine's
                               # kMonsterAscension 20; monster_darkling.cpp spells
                               # the branch out, so the module stays exact if a
                               # real ascension is ever threaded through.
      effects:
        # STEP 2 IS A17-ONLY AND THE SCHEMA CANNOT SAY SO. GainBlockAction(this,
        # this, 12) is unconditional (:111), but the StrengthPower(this, 2) at
        # :112-113 sits behind "if (ascensionLevel < 17) break;". An effect list
        # expresses per-tier AMOUNTS and not per-tier PRESENCE -- the Snecko TAIL
        # precedent (S2.22) -- so both steps are authored with their exact amounts
        # and monster_darkling.cpp queues them one at a time through
        # queue_monster_move_effect, skipping step 1 below A17.
        - {op: BLOCK, target: SELF, amount: 12}
        - {op: APPLY_POWER, target: SELF, amount: 2, power: STRENGTH}
    - name: NIP
      move_id: 3               # Darkling.java:66
      intent: ATTACK
      effects:
        # nipDmg is a PER-INSTANCE monsterHpRng roll in the ctor (A2 ? random(9,13)
        # : random(7,11), Darkling.java:84,87), NOT a static column -- the native
        # module substitutes the rolled value (stored in MonsterState.pad0) for
        # this placeholder amount, exactly as the Louse BITE row does.
        # AnimateFastAttack (:117) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: 0}
    - name: COUNT
      move_id: 4               # Darkling.java:67
      intent: UNKNOWN          # setMove(4, UNKNOWN) from the half-death telegraph
                               # (:221) and from the queued SetMoveAction (:223)
      effects:
        # A LITERAL COMBAT NO-OP: case 4 is one TextAboveCreatureAction (:122) and
        # nothing else. The turn still reaches the trailing RollMoveAction, which
        # is how a half-dead Darkling gets from COUNT to REINCARNATE. NOP placeholder.
        - {op: NOP, target: SELF, amount: 0}
    - name: REINCARNATE
      move_id: 5               # Darkling.java:68
      intent: BUFF             # setMove(5, BUFF) (:146)
      effects:
        # HealAction(this, this, this.maxHealth / 2) (:131) -- INTEGER division, and
        # NOT a roll: there is no HP re-roll on revival. maxHealth is per-instance,
        # so the amount is a placeholder the module computes, the NIP precedent.
        # Then ChangeStateAction(REVIVE) (:132), whose whole content is
        # halfDead = false (:193-196) and which is therefore not an effect step --
        # see monster_darkling.cpp for where the clear lands. Then ApplyPowerAction(
        # this, this, new RegrowPower(this), 1) (:133). The relic onSpawnMonster
        # fan-out at :134-136 is SYNCHRONOUS inside takeTurn, so it is not a queued
        # step either.
        - {op: HEAL, target: SELF, amount: 0}
        - {op: APPLY_POWER, target: SELF, amount: 1, power: REGROW}
  ai: native   # getMove (Darkling.java:143-183) needs native code for FOUR
               # reasons, any one of which would be enough. (1) It RECURSES on a
               # fresh aiRng draw, and the two recursion sites use DIFFERENT
               # bounds -- random(40,99) at :166, random(0,99) at :181 -- so the
               # draw COUNT is input-dependent. (2) It reads the monster's own
               # SLOT PARITY, monsters.lastIndexOf(this) % 2 == 0 (:163): slots
               # 0 and 2 can CHOMP and slot 1 structurally never can, so the
               # middle Darkling of a group of three is a different monster from
               # its siblings. (3) The halfDead arm (:145-148) short-circuits to
               # REINCARNATE. (4) firstMove (:69,149-161) is consumed on the init
               # rollMove -- the Snecko / Chosen / Red-Slaver precedent -- and is
               # NOT reset by revival. See monster_darkling.cpp.

- id: 50
  name: ORB_WALKER
  game_id: "Orb Walker"
  provenance: "OrbWalker (OrbWalker.java, read in full, 135 lines). ID \"Orb Walker\" (:32) -- WITH A SPACE, and textually identical to the encounters.yaml weak-pool key at id 45; the two domains do not clash and encounters.yaml records that at its own row. DOUBLE_ENCOUNTER \"Double Orb Walker\" (:33) is DEAD CONTENT: grep finds no MonsterHelper case and no encounter key for it, so it is deliberately unregistered -- the event group is \"2 Orb Walkers\" (MysteriousSphere.java:39,87), encounters.yaml id 61. ctor (:52-70): the super ARGUMENT is AbstractDungeon.monsterHpRng.random(90, 96) (:53), evaluated BEFORE the ctor body, then setHp(92,102) at ascension >= 7 else (90,96) (:54-58) -- TWO draws, the first thrown away by the second; see the rolls block. clawDmg 15 / laserDmg 10, or 16 / 11 from A2 (:59-65); damage = [laserDmg, clawDmg] (:66-67), so LASER is index 0 and CLAW index 1. Move ids LASER=1, CLAW=2 (:48-49). usePreBattleAction (:73-80): ApplyPowerAction(this, this, new GenericStrengthUpPower(this, MOVES[0], ascension >= 17 ? 5 : 3)) -- powers.yaml id 101, at the 3-arg default stack amount, i.e. the same number. takeTurn (:82-97): case 1 has NO break (:95), which is BEHAVIOURALLY INERT because it is the last case and the fall-through reaches only the trailing RollMoveAction (:97) that case 2 reaches too. getMove (:100-113) has no ascension branch and draws nothing extra. damage() (:115-122) and changeState (:124-131) are presentation only."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    base: {min: 90, max: 96}    # OrbWalker.java:57 (ascension < 7)
    a7:   {min: 92, max: 102}   # OrbWalker.java:55 (ascension >= 7)
  rolls:
    - name: SUPER_ARG_HP
      stream: MONSTER_HP
      timing: CONSTRUCTOR_BEFORE_HP
      range:
        # ONE COLUMN ONLY, AND THAT IS THE POINT: the super-argument draw is
        # TIER-INDEPENDENT (OrbWalker.java:53 is a bare random(90, 96) with no
        # ascension branch anywhere near it), while the setHp draw that
        # IMMEDIATELY OVERWRITES its value is tiered. So an A20 Orb Walker still
        # draws 90..96 first and 92..102 second. The first value is discarded --
        # but it MOVED THE STREAM, so "Orb Walker" costs TWO monster_hp_rng draws
        # and the event group "2 Orb Walkers" costs FOUR, and every later roll on
        # that floor is offset accordingly.
        base: {min: 90, max: 96}  # OrbWalker.java:53 (the super(...) argument)
  moves:
    - name: LASER
      move_id: 1               # OrbWalker.java:48
      intent: ATTACK_DEBUFF    # setMove(1, ATTACK_DEBUFF, dmg[0].base) (:106,109)
      effects:
        # damage.get(0) == laserDmg: 10, or 11 from A2 (:59-65). Then ONE
        # MakeTempCardInDiscardAndDeckAction(new Burn()) (:94), which is TWO
        # INDEPENDENT COPIES and not one card in two places
        # (MakeTempCardInDiscardAndDeckAction.java:30-36, read in full): a
        # ShowCardAndAddToDrawPileEffect with randomSpot = true (so
        # CardGroup.addToRandomSpot -> ONE card_random_rng draw, or zero on an
        # empty draw pile) and THEN a ShowCardAndAddToDiscardEffect (no draw), in
        # that order. Two steps, because DRAW_RANDOM and DISCARD are two piles.
        # ChangeState + Wait (:92-93) are presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
        - {op: MAKE_CARD, target: PLAYER, amount: 1, card: BURN, pile: DRAW_RANDOM}
        - {op: MAKE_CARD, target: PLAYER, amount: 1, card: BURN, pile: DISCARD}
    - name: CLAW
      move_id: 2               # OrbWalker.java:49
      intent: ATTACK           # setMove(2, ATTACK, dmg[1].base) (:104,112)
      effects:
        # damage.get(1) == clawDmg: 15, or 16 from A2 (:59-65). AnimateSlowAttack
        # (:85) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 15, a2: 16}}
  ai: native   # getMove (OrbWalker.java:100-113) is a pure move-history tree --
               # num < 40 ? (!lastTwoMoves(CLAW) ? CLAW : LASER)
               #          : (!lastTwoMoves(LASER) ? LASER : CLAW) --
               # and lastTwoMoves is not an ai-table shape. No ascension branch,
               # no extra draws. See monster_orb_walker.cpp.

- id: 51
  name: REPULSOR
  game_id: "Repulsor"
  provenance: "Repulsor (Repulsor.java, read in full, 84 lines). ID \"Repulsor\" (:28). ENCOUNTER_NAME_W \"Ancient Shapes Weak\" and ENCOUNTER_NAME \"Ancient Shapes\" (:33-34) are DEAD CONTENT -- MonsterHelper's keys are \"3 Shapes\" / \"4 Shapes\" / \"Sphere and 2 Shapes\" and grep finds no case for either string, so neither is registered. ctor (:44-57): super passes the LITERAL 35 (:45) -- no draw -- dazeAmt = 2 flat (:49), then setHp(31,38) at ascension >= 7 else (29,35) (:50-54), then attackDmg = ascension >= 2 ? 13 : 11 (:55) as a plain ternary with no draw. ONE monster_hp_rng draw total. NO usePreBattleAction -- the class does not declare one, so AbstractMonster's empty body stands (AbstractMonster.java:953-954). Move ids DAZE=1, ATTACK=2 (:39-40). takeTurn (:59-73): both cases reach the trailing RollMoveAction (:72). getMove (:75-82): if (num < 20 && !lastMove(ATTACK)) ATTACK; else DAZE -- no ascension branch and no extra draw, and note that DAZE is the DEFAULT arm, so a Repulsor dazes on roughly four turns in five."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    base: {min: 29, max: 35}    # Repulsor.java:53 (ascension < 7)
    a7:   {min: 31, max: 38}    # Repulsor.java:51 (ascension >= 7)
  rolls: []
  moves:
    - name: DAZE
      move_id: 1               # Repulsor.java:39
      intent: DEBUFF           # setMove((byte)1, Intent.DEBUFF) (:81)
      effects:
        # MakeTempCardInDrawPileAction(new Dazed(), dazeAmt = 2, randomSpot = true,
        # autoPosition = true) (:67). ONE step of amount 2, not two of amount 1:
        # op_make_card's DRAW_RANDOM branch loops per COPY and draws one
        # card_random_rng value each time (interp/interp_cards.cpp), which is
        # exactly MakeTempCardInDrawPileAction's own per-copy
        # ShowCardAndAddToDrawPileEffect -> CardGroup.addToRandomSpot. So DAZE
        # costs TWO sequential card_random_rng draws, and ZERO on an empty draw
