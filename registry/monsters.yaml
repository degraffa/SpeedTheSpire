      move_id: 1               # Exploder.java:44
      intent: ATTACK           # setMove(1, ATTACK, dmg[0].base) (:88)
      effects:
        # damage.get(0) == attackDmg: 9, or 11 from A2 (:61). AnimateSlowAttack
        # (:73) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 9, a2: 11}}
    - name: BLOCK
      move_id: 2               # Exploder.java:48 -- the Java constant is named
                               # BLOCK and the move GAINS NO BLOCK. The name is
                               # transcribed, not corrected.
      intent: UNKNOWN          # setMove((byte)2, Intent.UNKNOWN) (:90)
      effects:
        # A LITERAL EMPTY CASE (Exploder.java:78-80): case 2 is a bare break. The
