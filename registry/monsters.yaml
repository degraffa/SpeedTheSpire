- id: 30
  name: SPHERIC_GUARDIAN
  game_id: "SphericGuardian"
  provenance: "SphericGuardian (SphericGuardian.java, read in full). ID \"SphericGuardian\" (:36) -- NO space, and DISTINCT from the encounter keys \"Spheric Guardian\" / \"Sphere and 2 Shapes\", which do have one. ctor (:66-75) passes maxHealth 20 straight to super and NEVER calls setHp -- see the hp block below. `dmg` is a FIELD INITIALIZER, `ascensionLevel >= 2 ? 11 : 10` (:48), which Java runs after super() and before the ctor body, so damage.get(0) at :68 already has the branched value. Fixed constants: SLAM_AMT 2 (:49), HARDEN_BLOCK 15 (:50), FRAIL_AMT 5 (:51), ACTIVATE_BLOCK 25 (:52), ARTIFACT_AMT 3 (:53), STARTING_BLOCK_AMT 40 (:54). Move ids BIG_ATTACK=1, INITIAL_BLOCK_GAIN=2, BLOCK_ATTACK=3, FRAIL_ATTACK=4 (:55-58). usePreBattleAction (:77-82) in order: Barricade, Artifact(3), GainBlock(40). takeTurn (:84-121): all four cases reach the trailing RollMoveAction (:120). getMove (:145-162). die() (:164-172) picks a sound with UNSEEDED MathUtils and models nothing."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    # FIXED 20 AT EVERY ASCENSION, AND THIS MONSTER DRAWS ZERO monster_hp_rng.
    # setHp is NEVER called: the ctor hands maxHealth 20 to super
    # (SphericGuardian.java:67) and AbstractMonster's ctor (AbstractMonster.java:
    # 135-155) assigns `currentHealth = maxHealth` with no RNG anywhere in it.
    # It is the FIRST registry monster with no HP draw, so encounter-level draw
    # accounting differs from every other group: "Spheric Guardian" solo costs 0
    # monster_hp_rng draws, and "Sentry and Sphere" costs 1 (the Sentry's), not 2.
    # A single {min: 20, max: 20} column is the honest spelling -- there is no tier
    # branch to record -- and the native module SKIPS the draw entirely rather than
    # calling random() with a degenerate range, which WOULD move the stream.
    base: {min: 20, max: 20}   # SphericGuardian.java:67 -- ctor arg, no setHp
  rolls: []
  moves:
    - name: BIG_ATTACK
      move_id: 1               # SphericGuardian.java:55
      intent: ATTACK
      effects:
        # TWO SEPARATE DamageActions on damage.get(0) (:90-91) -- SLAM_AMT 2 (:49)
        # is the telegraphed multiplier, and setMove passes `2, true` (:160). dmg
        # is 10, or 11 from A2 (:48). ChangeState("ATTACK") + Wait (:88-89) are
        # presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
    - name: INITIAL_BLOCK_GAIN
      move_id: 2               # SphericGuardian.java:56
      intent: DEFEND
      effects:
        # THE ONLY IN-takeTurn ASCENSION BRANCH IN THIS WHOLE BATCH (:95-99): 35
        # at A17+, else 25. It has NO named constant for the A17 value --
        # ACTIVATE_BLOCK (:52) is only the 25 -- so the 35 is a literal in the
        # branch and is transcribed as one. Every other ascension branch across
        # these four monsters lives in a ctor. The WaitAction and the
        # MathUtils-coin-flipped SFX after it (:100-106) are presentation on an
        # UNSEEDED generator.
        - {op: BLOCK, target: SELF, amount: {base: 25, a17: 35}}
    - name: BLOCK_ATTACK
      move_id: 3               # SphericGuardian.java:57
      intent: ATTACK_DEFEND
      effects:
        # ORDER IS LOAD-BEARING (:109-111): the block lands FIRST, then the
        # attack. HARDEN_BLOCK 15 (:50), flat.
        - {op: BLOCK, target: SELF, amount: 15}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
    - name: FRAIL_ATTACK
      move_id: 4               # SphericGuardian.java:58
      intent: ATTACK_DEBUFF
      effects:
        # Damage then Frail 5 (FRAIL_AMT at :51), :115-117.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
        - {op: APPLY_POWER, target: PLAYER, amount: 5, power: FRAIL}
  ai: native   # getMove (:145-162) NEVER READS num: firstMove -> 2, secondMove ->
               # 4, then strict alternation on lastMove(1) between 3 and 1. The
               # rolls still happen and still move the ai_rng stream (the Guardian
               # / Red Slaver / Looter discarded-draw precedent), which is the
               # whole reason this is native rather than an empty table.
               # `secondMove` is kMonsterFlagSphericSecondMove.
               # See monster_spheric_guardian.cpp.

# --- S2.22 (Act-2 city normals II): Mugger, Snake Plant, Snecko, Centurion, ---
# --- Healer. MonsterId 32-36 are this task's grant (stage-b-tasks.md "S2 ---
# --- Wave-2 allocations"); all five are spent, so the block leaves no gap. ---
# --- 31 stays the PERMANENT GAP S2.21 released; it is never backfilled. ---
#
# All five are NORMAL (none assigns this.type, so AbstractMonster.java:99's field
# initializer stands) and all five are `ai: native` -- each reads move history, a
# per-instance latch, the live-monster count, or a group-wide HP sum, and no ai
# table expresses any of those.

- id: 32
  name: MUGGER
  game_id: "Mugger"
  provenance: "Mugger (Mugger.java, read in full, PLUS the recovered anonymous inner classes Mugger$1 and Mugger$2 -- see RECOVERED-INNER-CLASSES.md at the decompile root). ID \"Mugger\" (:34). ctor (:57-79): goldAmt = 20 at ascension >= 17 else 15 (:61); setHp(50,54) at >= 7 else (48,52) (:62-66); the >= 2 branch (:67-73) gives swipeDmg 11 / bigSwipeDmg 18 (10 / 16 below), added to damage in that order (:74-75). escapeDef 11 (:47), +6 at A17 (:119-123). Move ids MUG=1, SMOKE_BOMB=2, ESCAPE=3, BIGSWIPE=4 (:48-51). usePreBattleAction (:81-84): ApplyPowerAction(this, this, ThieveryPower(this, goldAmt)) -- powers.yaml id 75, the same marker the Looter applies. takeTurn (:86-136) has NO trailing RollMoveAction: every case decides the next move itself. playSfx (:138-145) and playDeathSfx (:147-154) each draw ONE aiRng.random(2) -- SEEDED, and that is the Mugger's sharpest divergence from the Looter, whose sound rolls are unseeded MathUtils. die (:156-165): playDeathSfx FIRST, then addStolenGoldToRewards when stolenGold > 0, then super.die(). getMove (:167-170) ignores num and forces MUG. The stolen-gold accrual is the recovered Mugger.1 (site :95, case MUG) and Mugger.2 (site :113, case BIGSWIPE), both `stolenGold += Math.min(goldAmt, player.gold)`, QUEUED one slot ahead of the 3-arg DamageAction whose stealGold (DamageAction.java:98-114) deducts the same clamped amount."
  enemy_type: NORMAL   # AbstractMonster.java:99 -- no this.type assignment
  hp:
    base: {min: 48, max: 52}    # Mugger.java:65 (ascension < 7)
    a7:   {min: 50, max: 54}    # Mugger.java:63 (ascension >= 7)
  rolls: []
  moves:
    - name: MUG
      move_id: 1               # Mugger.java:48
      intent: ATTACK
      effects:
        # damage.get(0) == swipeDmg: 10, or 11 from A2 (Mugger.java:67-73). The
        # 3-arg DamageAction (:96) also steals goldAmt; the steal ACCOUNTING is
        # native (monster_mugger.cpp -- pad0 is the steal count, exactly the
        # Looter's shape), the damage is this program. AnimateSlowAttackAction
        # (:94) and the gated TalkAction (:92) are presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
    - name: SMOKE_BOMB
      move_id: 2               # Mugger.java:49
      intent: DEFEND           # setMove((byte)2, Intent.DEFEND) (:100,115)
      effects:
        # GainBlockAction(this, this, escapeDef [+ 6 at A17]) -- escapeDef is a
        # FIELD initializer, 11 (:47), and the A17 arm adds a literal 6 at :120,
        # which is why this column reads 17 rather than a named constant. NOTE
        # the Looter's sibling move gains 6 flat; these two thieves do NOT share
        # a block number. Unlike the Looter's, this case has NO TalkAction and
        # draws nothing at all.
        - {op: BLOCK, target: SELF, amount: {base: 11, a17: 17}}
    - name: ESCAPE
      move_id: 3               # Mugger.java:50
      intent: ESCAPE           # SetMoveAction(this, 3, Intent.ESCAPE) (:124,132)
      effects:
        # The whole body is native (monster_mugger.cpp): room.mugged is set
        # SYNCHRONOUSLY (:129, kCombatFlagMugged), then the queued EscapeAction
        # (:131) and the re-telegraphing SetMoveAction (:132). The Talk (:128)
        # and the smoke-bomb VFX (:130) are presentation and roll nothing.
        # NOP placeholder (the Looter precedent).
        - {op: NOP, target: SELF, amount: 0}
    - name: BIGSWIPE
      move_id: 4               # Mugger.java:51
      intent: ATTACK           # SetMoveAction(..., 4, Intent.ATTACK, dmg[1]) (:103)
      effects:
        # damage.get(1) == bigSwipeDmg: 16, or 18 from A2 (:67-73). The 3-arg
        # DamageAction (:114) steals like Mug's does.
        - {op: DAMAGE, target: PLAYER, amount: {base: 16, a2: 18}}
  ai: native   # getMove (:167-170) IGNORES its rolled num (the init draw still
               # happens and is discarded -- the Looter/Guardian precedent) and
               # every later move is decided inside takeTurn by slashCount plus
               # aiRng draws: a per-attack playSfx random(2) (:139 -- SEEDED,
               # unlike the Looter's), the SECOND-Mug 0.6 talk gate (:91), and
               # the 0.5 Smoke-Bomb-or-BigSwipe coin at slashCount == 2 (:99).
               # slashCount lives in MonsterState.pad0 and doubles as the steal
               # count. See monster_mugger.cpp.

