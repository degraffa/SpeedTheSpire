# --- Act-1 elites: Gremlin Nob + Sentry ---------------------------------------
# Both classes read in full. Each constructor consumes exactly one monsterHpRng
# draw (setHp(min,max)) and AbstractMonster.init consumes one aiRng random(99).
# ASCENSION THRESHOLDS -- the A_2_* static field NAMES in both files are
# misleading; the live branches are what these columns key on:
#   GremlinNob.java:67 setHp  -> ascension >= 8   (A_2_HP_MIN/MAX are the A8 pair)
#   GremlinNob.java:72 damage -> ascension >= 3   (A_2_BASH_DMG/A_2_RUSH_DMG)
#   GremlinNob.java:92 Anger  -> ascension >= 18
#   Sentry.java:62    setHp   -> ascension >= 8
#   Sentry.java:67    beamDmg -> ascension >= 3
#   Sentry.java:68    dazedAmt-> ascension >= 18
# Selection is native for both (monster_gremlin_nob.*, monster_sentry.*): the Nob's
# A18 getMove is a lastMove/lastMoveBefore/lastTwoMoves history tree and the
# Sentry's opening move keys on its POSITION in the monster group, neither of
# which is an ai_table shape. Move *effects* are the data below.

- id: 12
  name: GREMLIN_NOB
  game_id: "GremlinNob"
  provenance: "GremlinNob ctor setHp/damage branches (GremlinNob.java:60-84), takeTurn (:86-113), getMove (:126-170), move ids BULL_RUSH=1/SKULL_BASH=2/BELLOW=3 (:49-51), DEBUFF_AMT 2 (:46,103), ANGRY_LEVEL 2 / A18 3 (:52,92-96); canVuln is the 2-arg ctor's `true` (:56-58), the ctor MonsterHelper's \"Gremlin Nob\" group uses (MonsterHelper.java:436-438); ID (:33)"
  enemy_type: ELITE   # GremlinNob.java:63
  hp:
    base: {min: 82, max: 86}   # GremlinNob.java:70 (ascension < 8)
    a8:   {min: 85, max: 90}   # GremlinNob.java:68 (ascension >= 8)
  moves:
    - name: BULL_RUSH
      move_id: 1               # GremlinNob.java:49
      intent: ATTACK
      effects:
        # damage.get(0) == rushDmg: 14, 16 from A3 (GremlinNob.java:43,45,73-77,79).
        - {op: DAMAGE, target: PLAYER, amount: {base: 14, a3: 16}}
    - name: SKULL_BASH
      move_id: 2               # GremlinNob.java:50
      intent: ATTACK_DEBUFF    # canVuln branch (GremlinNob.java:136,144,154,162)
      effects:
        # damage.get(1) == bashDmg: 6, 8 from A3 (GremlinNob.java:42,44,73-77,80).
        - {op: DAMAGE, target: PLAYER, amount: {base: 6, a3: 8}}
        # VulnerablePower(player, DEBUFF_AMT=2, true) -- only when canVuln, which
        # every reachable encounter sets (GremlinNob.java:102-103).
        - {op: APPLY_POWER, target: PLAYER, amount: 2, power: VULNERABLE}
    - name: BELLOW
      move_id: 3               # GremlinNob.java:51
      intent: BUFF
      effects:
        # AngerPower(this, 2), or 3 at A18 (GremlinNob.java:92-96). Applied to
        # SELF: each SKILL the player plays gives the Nob that much Strength.
        - {op: APPLY_POWER, target: SELF, amount: {base: 2, a18: 3}, power: ANGER}
  ai: native   # getMove (GremlinNob.java:126-170): usedBellow forces BELLOW once,
               # then the A18 branch is a pure history tree (num drawn but unused)
               # and the sub-A18 branch is a d33 on the drawn num.

- id: 13
  name: SENTRY
  game_id: "Sentry"
  provenance: "Sentry ctor setHp/beamDmg/dazedAmt branches (Sentry.java:59-77), usePreBattleAction ArtifactPower(this,1) (:79-82), takeTurn (:84-113), getMove position-keyed first move + alternation (:134-150), move ids BOLT=3/BEAM=4 (:51-52), DAZED_AMT 2 / A_18_DAZED_AMT 3 (:55-56); ID (:41)"
  enemy_type: ELITE   # Sentry.java:61
  hp:
    base: {min: 38, max: 42}   # Sentry.java:65 (ascension < 8)
    a8:   {min: 39, max: 45}   # Sentry.java:63 (ascension >= 8)
  moves:
    - name: BOLT
      move_id: 3               # Sentry.java:51
      intent: DEBUFF           # Sentry.java:138
      effects:
        # MakeTempCardInDiscardAction(new Dazed(), dazedAmt) -- fresh Dazed copies
        # straight into the DISCARD pile, 2 below A18 and 3 at A18+ (Sentry.java:96).
        - {op: MAKE_CARD, target: PLAYER, amount: {base: 2, a18: 3}, card: DAZED, pile: DISCARD}
    - name: BEAM
      move_id: 4               # Sentry.java:52
      intent: ATTACK           # Sentry.java:140,148
      effects:
        # damage.get(0) == beamDmg: 9, 10 from A3 (Sentry.java:67,69,108).
        - {op: DAMAGE, target: PLAYER, amount: {base: 9, a3: 10}}
  ai: native   # getMove (Sentry.java:134-150): the FIRST move is decided by the
               # monster's index in the group (even -> Bolt, odd -> Beam), then it
               # strictly alternates on lastMove. num drawn each roll, never used.
               # usePreBattleAction's Artifact 1 is queued by the native module.
# --- Elite: Lagavulin --------------------------------------------------------
# Lagavulin.java read in full. The whole class is one sleep/wake state machine
# whose transitions are direct setMove / SetMoveAction calls, so selection is
# native (monster_lagavulin.*) and only the two acting moves carry data effects.
#
# Move ids are the class's own bytes (Lagavulin.java:54-58): DEBUFF=1,
# STRONG_ATK=3, OPEN=4, IDLE=5, OPEN_NATURAL=6.
#
# OPEN_NATURAL (6) IS DELIBERATELY ABSENT from the table below. takeTurn has a
# `case 6:` (:165-172), but nothing in the 11-30-2020 build ever sets move 6 --
# there is no setMove(6, ...) or SetMoveAction(..., 6, ...) in Lagavulin.java or
# anywhere else, so no telegraphed intent for it exists to record. Giving it a
# row would mean inventing an Intent the game never displays. Whoever finds a
# reachable path to it adds the row then.
#
# OPEN (4) and IDLE (5) act but queue no state-changing effects of their own:
# move 4 is a TextAboveCreatureAction(STUNNED) (:161) and move 5's body is
# TalkActions plus the native counter/telegraph logic (:136-158). Both take the
# NOP placeholder the large-slime SPLIT move established.

- id: 15
  name: LAGAVULIN
  game_id: "Lagavulin"
  provenance: "Lagavulin ctor setHp A8 / attackDmg A3 / debuff A18 branches (Lagavulin.java:73-100), usePreBattleAction asleep block+Metallicize vs awake DEBUFF telegraph (:102-114), takeTurn DEBUFF/STRONG_ATK/IDLE/OPEN cases (:116-174), changeState OPEN (:176-195), damage() wake interrupt (:197-210), getMove (:212-227), move ids (:54-58), ARMOR_AMT 8 (:66), STRONG_ATK_DMG 18 / A_2_STRONG_ATK_DMG 20 (:60,63), DEBUFF_AMT -1 / A_18_DEBUFF_AMT -2 (:61-62); ID (:45); MonsterHelper.getEncounter \"Lagavulin\" -> new Lagavulin(true) (MonsterHelper.java:439-441), \"Lagavulin Event\" -> new Lagavulin(false) (:445-447)"
  enemy_type: ELITE   # Lagavulin.java:75
  hp:
    base: {min: 109, max: 111}  # Lagavulin.java:80 (ascension < 8)
    a8:   {min: 112, max: 115}  # Lagavulin.java:78 (ascension >= 8)
  moves:
    - name: DEBUFF
      move_id: 1               # Lagavulin.java:54
      intent: STRONG_DEBUFF    # setMove(DEBUFF_NAME, 1, Intent.STRONG_DEBUFF) (:112,217,222)
      effects:
        # DEXTERITY FIRST, then STRENGTH -- takeTurn's addToBottom order
        # (Lagavulin.java:123-124). debuff = -1, or -2 from A18 (:83); the field
        # names A_18_DEBUFF_AMT/DEBUFF_AMT (:61-62) match the branch for once.
        # Negative Strength/Dexterity flip the applied instance to DEBUFF
        # (StrengthPower/DexterityPower updateDescription), so Artifact nullifies
        # them -- handled at the APPLY_POWER site, not here.
        - {op: APPLY_POWER, target: PLAYER, amount: {base: -1, a18: -2}, power: DEXTERITY}
        - {op: APPLY_POWER, target: PLAYER, amount: {base: -1, a18: -2}, power: STRENGTH}
    - name: STRONG_ATK
      move_id: 3               # Lagavulin.java:55
      intent: ATTACK
      effects:
        # damage.get(0) == attackDmg: 18, or 20 from A3 (Lagavulin.java:82,84).
        - {op: DAMAGE, target: PLAYER, amount: {base: 18, a3: 20}}
    - name: OPEN
      move_id: 4               # Lagavulin.java:56
      intent: STUN             # damage() telegraphs setMove(4, Intent.STUN) (:202)
      effects:
        # TextAboveCreatureAction(STUNNED) then RollMoveAction (:160-163):
        # presentation plus a native roll. NOP placeholder.
        - {op: NOP, target: SELF, amount: 0}
    - name: IDLE
      move_id: 5               # Lagavulin.java:57
      intent: SLEEP            # setMove(5, Intent.SLEEP) (:144,225)
      effects:
        # idleCount bookkeeping, TalkActions, and the third-idle OPEN/SetMove
        # sequence are all native (:136-158). NOP placeholder.
        - {op: NOP, target: SELF, amount: 0}
  ai: native   # getMove (Lagavulin.java:212-227) ignores `num` entirely: asleep ->
               # IDLE forever; awake -> STRONG_ATK until debuffTurnCount reaches 2,
               # then DEBUFF. rollMove still draws one aiRng.random(99) every time
               # (AbstractMonster.java:712-714), which the native module reproduces.
