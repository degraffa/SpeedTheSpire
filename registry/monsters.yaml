  enemy_type: NORMAL   # AbstractMonster.java:99 -- no this.type assignment
  hp:
    base: {min: 95, max: 99}    # Chosen.java:83 (ascension < 7)
    a7:   {min: 98, max: 103}   # Chosen.java:81 (ascension >= 7) -- >= 7, not >= 2
  rolls: []
  moves:
    - name: ZAP
      move_id: 1               # Chosen.java:63
      intent: ATTACK
