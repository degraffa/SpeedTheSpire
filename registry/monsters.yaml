# --- Act-1 elites: Gremlin Nob + Sentry ---------------------------------------
# Both classes read in full. Each constructor consumes exactly one monsterHpRng
# draw (setHp(min,max)) and AbstractMonster.init consumes one aiRng random(99).
# ASCENSION THRESHOLDS -- the A_2_* static field NAMES in both files are
# misleading; the live branches are what these columns key on:
#   GremlinNob.java:67 setHp  -> ascension >= 8   (A_2_HP_MIN/MAX are the A8 pair)
#   GremlinNob.java:72 damage -> ascension >= 3   (A_2_BASH_DMG/A_2_RUSH_DMG)
#   GremlinNob.java:92 Anger  -> ascension >= 18
#   Sentry.java:62    setHp   -> ascension >= 8
#   Sentry.java:67    beamDmg -> ascension >= 3
#   Sentry.java:68    dazedAmt-> ascension >= 18
# Selection is native for both (monster_gremlin_nob.*, monster_sentry.*): the Nob's
# A18 getMove is a lastMove/lastMoveBefore/lastTwoMoves history tree and the
