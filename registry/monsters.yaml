        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 12}}
        - {op: APPLY_POWER, target: PLAYER, amount: 2, power: VULNERABLE}
    - name: HEX
      move_id: 4               # Chosen.java:66
      intent: STRONG_DEBUFF
      effects:
        # TalkAction / ChangeStateAction("ATTACK") / WaitAction (:131-133) are all
        # presentation -- changeState's ATTACK branch (:141-149) is two spine
        # animation calls and nothing else. HexPower(player, 1) is the whole move
        # (:134; HEX_AMT at :68). powers.yaml id 93.
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: HEX}
    - name: POKE
      move_id: 5               # Chosen.java:67
      intent: ATTACK
      effects:
        # TWO SEPARATE DamageActions on damage.get(2) (:110-111), not one doubled
