    - name: ATTACK
      move_id: 2               # Repulsor.java:40
      intent: ATTACK           # setMove(2, ATTACK, dmg[0].base) (:77)
      effects:
        # damage.get(0) == attackDmg: 11, or 13 from A2 (:55). AnimateSlowAttack
        # (:62) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 11, a2: 13}}
  ai: native   # getMove (Repulsor.java:75-82) reads lastMove, which is not an
               # ai-table shape, and its num gate is a plain < 20. See
               # monster_repulsor.cpp.

- id: 52
  name: EXPLODER
  game_id: "Exploder"
  provenance: "Exploder (Exploder.java, read in full, 94 lines). ID \"Exploder\" (:28). ENCOUNTER_NAME \"Ancient Shapes\" (:33) is DEAD CONTENT, as on the Repulsor. ctor (:50-62): super passes the LITERAL 30 (:51) -- no draw -- then setHp(30,35) at ascension >= 7 else setHp(30,30) (:56-60). setHp(30,30) STILL DRAWS: Random.random(int,int) is start + nextInt(end - start + 1) and ++counter is unconditional (random/Random.java:58-61), so nextInt(1) consumes a value. This is the OPPOSITE of the SphericGuardian (monsters.yaml id 30), which skips the draw because setHp is never CALLED -- the two must not be conflated, and the degenerate {30,30} column below is spelled out rather than omitted so the difference stays visible. attackDmg = ascension >= 2 ? 11 : 9 (:61), a plain ternary. usePreBattleAction (:64-67): ApplyPowerAction(this, this, new ExplosivePower(this, 3)) -- powers.yaml id 100, at the 3-arg default stack amount 3. Move ids ATTACK=1, BLOCK=2 (:44,48); EXPLODE_BASE 3 (:49) is the power's starting fuse, passed at :66. takeTurn (:69-84) opens with ++turnCount (:71); case 2 is a LITERAL EMPTY CASE (:78-80) -- the Exploder's move 2 does nothing at all, and the self-destruct is the POWER's duringTurn, not the move. Both cases reach the trailing RollMoveAction (:82). getMove (:86-92) NEVER READS num -- the aiRng draw still happens and still moves the shared stream (the Guardian / Spheric Guardian precedent)."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    # {30,30} IS A REAL COLUMN AND IT DRAWS -- see the provenance. At the engine's
    # kMonsterAscension 20 the live column is the a7 one, so this only bites the
    # tier-2 column table and any sub-A7 fixture; it is authored exactly because
    # getting it wrong would be invisible until one existed.
    base: {min: 30, max: 30}    # Exploder.java:59 (ascension < 7) -- setHp(30, 30)
    a7:   {min: 30, max: 35}    # Exploder.java:57 (ascension >= 7)
  rolls: []
  moves:
    - name: ATTACK
      move_id: 1               # Exploder.java:44
      intent: ATTACK           # setMove(1, ATTACK, dmg[0].base) (:88)
      effects:
        # damage.get(0) == attackDmg: 9, or 11 from A2 (:61). AnimateSlowAttack
        # (:73) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 9, a2: 11}}
    - name: BLOCK
      move_id: 2               # Exploder.java:48 -- the Java constant is named
                               # BLOCK and the move GAINS NO BLOCK. The name is
                               # transcribed, not corrected.
      intent: UNKNOWN          # setMove((byte)2, Intent.UNKNOWN) (:90)
      effects:
        # A LITERAL EMPTY CASE (Exploder.java:78-80): case 2 is a bare break. The
        # turn still reaches the trailing RollMoveAction, and the 30-damage
        # self-destruct belongs to ExplosivePower.duringTurn (powers.yaml id 100),
        # which fires AFTER takeTurn from applyTurnPowers. NOP placeholder.
        - {op: NOP, target: SELF, amount: 0}
