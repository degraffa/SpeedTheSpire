# 37 "Book of Stabbing", plus the EVENT-pool 42 "Colosseum Nobs") were landed by
# S2.01 and are UNCHANGED here: encounter EMIT targets resolve as game-id strings
# against this file at spawn time, so registering these three rows is what
# un-parks all four groups, with no encounters.yaml and no run_advance.cpp edit
# (the B3.16 precedent).

