- id: 61
  name: SNAKE_DAGGER
  game_id: "Dagger"
  provenance: "SnakeDagger (SnakeDagger.java, 115 lines, read in full). ID IS \"Dagger\" (:32), NOT \"SnakeDagger\" -- that is the string encounters.yaml id 57 already emits twice, and it is the oracle join key. The class assigns NO type, so it keeps AbstractMonster.java:99's NORMAL default even inside an elite fight. THE CTOR HAS EXACTLY ONE monster_hp_rng DRAW AND IT IS THE SUPER ARGUMENT: `super(NAME, ID, AbstractDungeon.monsterHpRng.random(20, 25), ...)` (:46) with NO setHp anywhere in the class -- so unlike the Taskmaster and the Reptomancer, whose super-argument draws are OVERWRITTEN by a setHp and therefore need a `rolls` entry, this one IS the HP and the ordinary `hp` column below expresses it exactly. FLAT at every ascension: the class has no ascension branch of any kind. The ctor takes (x, y) and passes them as offsetX/offsetY, which is how the same type sits at four different positions -- the Reptomancer's POSX/POSY tables -- and is why draw_x is written by the SPAWNER (monster_dispatch.hpp \"WHO SETS draw_x\"). damage (:48-50) is three DamageInfos: get(0) STAB_DMG 9, get(1) SACRIFICE_DMG 25, and get(2) a 25 of type HP_LOSS that is DEAD -- takeTurn's EXPLODE uses get(1) for the DamageAction and a LoseHPAction built from currentHealth for the self-kill, so nothing ever reads get(2) and no move row carries it. takeTurn (:59-77): case WOUND(1) is ChangeState + Wait + DamageAction(damage.get(0)) + MakeTempCardInDiscardAction(new Wound(), 1); case EXPLODE(2) is ChangeState + Wait + DamageAction(damage.get(1)) + LoseHPAction(this, this, this.currentHealth). RollMoveAction (:76) sits OUTSIDE the switch, so a dagger that just exploded still rolls. `firstMove` is a PUBLIC field initializer true (:43) and getMove (:90-98) is the whole ai: the first decision is WOUND and every later one is EXPLODE, unconditionally, with `num` ignored -- but the rollMove that produced `num` still drew aiRng.random(99) and still moved the shared stream. damage(DamageInfo) (:79-88) is animation only. NO die() override, NO usePreBattleAction: the MinionPower a dagger carries is applied by the Reptomancer's pre-battle walk (encounter daggers) or by the spawn path's kSpawnApplyMinion bit (summoned ones)."
  enemy_type: NORMAL   # SnakeDagger assigns no type (AbstractMonster.java:99)
  hp:
    # THE SUPER-ARGUMENT DRAW ITSELF (SnakeDagger.java:46), not a setHp -- see the
    # provenance. One monster_hp_rng draw over 20..25, flat at every ascension.
    base: {min: 20, max: 25}
  rolls: []
  moves:
    - name: WOUND
      move_id: 1               # SnakeDagger.java:41
      intent: ATTACK_DEBUFF    # setMove((byte)1, Intent.ATTACK_DEBUFF, 9) (:94)
      effects:
        # STAB_DMG 9 (:39), flat. ChangeState + Wait (:63-64) are presentation.
        - {op: DAMAGE, target: PLAYER, amount: 9}
        # MakeTempCardInDiscardAction(new Wound(), 1) (:66) -- ONE Wound, DISCARD.
        - {op: MAKE_CARD, target: PLAYER, amount: 1, card: WOUND, pile: DISCARD}
    - name: EXPLODE
      move_id: 2               # SnakeDagger.java:42
      intent: ATTACK           # setMove((byte)2, Intent.ATTACK, 25) (:97)
      effects:
        # SACRIFICE_DMG 25 (:40), flat -- damage.get(1) (:72).
        - {op: DAMAGE, target: PLAYER, amount: 25}
        # LoseHPAction(this, this, this.currentHealth) (:73). A PER-INSTANCE amount
        # read at QUEUE time, so this is the `amount: 0` placeholder the Darkling's
        # NIP row uses: monster_reptomancer.cpp substitutes the dagger's live HP.
        # The self-kill is an HP_LOSS through the damage path, NOT a SuicideAction,
        # so it goes through op_lose_hp and pays the ordinary death edge.
        - {op: LOSE_HP, target: SELF, amount: 0}
  ai: native   # getMove (:90-98) is a `firstMove` one-shot and then a constant, and
               # it ignores `num` entirely -- but the rollMove that produced `num`
               # still spends aiRng.random(99) every turn (the Taskmaster / Looter /
               # Guardian precedent, which is why those rows are native too). The
               # EXPLODE amount is also per-instance. See monster_reptomancer.cpp.

# --- S2.28 (Act-3 Beyond bosses) ---------------------------------------------
# MonsterId 62-65 is this task's whole grant (stage-b-tasks.md "S2 Wave-3
# allocations"); all four are spent, so the block leaves no gap. 37-61 belong to
# the sibling wave-3 batches and are NOT touched here. The three ENCOUNTER rows
# (encounters.yaml 58 AWAKENED_ONE_ENC, 59 TIME_EATER_ENC, 60 DONU_AND_DECA)
# landed with S2.01 and are unchanged -- this batch only supplies the monsters
# their `emit` game_ids name.
#
# EVERY ONE OF THE FOUR DRAWS EXACTLY ONE monster_hp_rng ROLL, and that is worth
# stating because the S2.28 scout dossier says the opposite ("no boss in this
# task draws monsterHpRng -- all four use the single-arg setHp"). The single-arg
# overload is literally `setHp(hp, hp)` (AbstractMonster.java:777-779), and the
# two-arg body draws `monsterHpRng.random(min, max)` UNCONDITIONALLY (:765-767);
# Random.random(int,int) increments the counter and calls nextInt(end-start+1)
# even for a degenerate range (Random.java:58-61). So the HP is fixed and the
# DRAW still happens -- exactly the reading the Hexaghost row (id 22) already
# carries and the dossier cited while drawing the wrong conclusion from it. The
# rows below spell the degenerate range as {min: N, max: N} for the same reason
# the Hexaghost's does: the observable is the STREAM, not the number.

- id: 62
  name: AWAKENED_ONE
  game_id: "AwakenedOne"
  provenance: "AwakenedOne (AwakenedOne.java, 377 lines, read in full). ID (:70); type = BOSS (:128); ctor setHp branch (:110-114); five DamageInfos in order (:131-135) 20/6/40/18/10 with NO ascension branch on any of them; usePreBattleAction (:139-156); takeTurn (:159-208); changeState \"REBIRTH\" (:213-227); getMove (:243-278); the damage() phase transition (:281-320); die() (:356-375). Move ids SLASH=1, SOUL_STRIKE=2, REBIRTH=3, DARK_ECHO=5, SLUDGE=6, TACKLE=8 (:83-94) -- 4 and 7 are UNUSED byte values, spelled out here so a reader does not go looking for the rows."
  enemy_type: BOSS     # AwakenedOne.java:128
  hp:
    # setHp(320) at A9+, else setHp(300) (:110-114). Degenerate ranges: the
    # value is fixed, the monster_hp_rng draw still happens (see the block
    # comment above). STAGE_1_HP == STAGE_2_HP == 300 and A_9_STAGE_1_HP ==
    # A_9_STAGE_2_HP == 320 (:78-81), which is why the Rebirth heal below reuses
    # these same two numbers: changeState re-asserts maxHealth (:214) to the
    # value it already had, so the "phase 2 sheet" is not a second stat line.
    base: {min: 300, max: 300}   # AwakenedOne.java:113
    a9:   {min: 320, max: 320}   # AwakenedOne.java:111
  moves:
    - name: SLASH
      move_id: 1               # AwakenedOne.java:83
      intent: ATTACK           # setMove((byte)1, Intent.ATTACK, 20) (:246,254,257)
      effects:
        # damage.get(0) == 20, flat at every ascension (:131). The SFXAction /
        # ChangeStateAction / WaitAction around it (:162-164) are presentation on
        # unseeded clocks.
        - {op: DAMAGE, target: PLAYER, amount: 20}
    - name: SOUL_STRIKE
      move_id: 2               # AwakenedOne.java:84
      intent: ATTACK           # setMove(SS_NAME, (byte)2, Intent.ATTACK, 6, 4, true)
      effects:
        # FOUR SEPARATE DamageActions of damage.get(1) == 6 (:169-171), not one
        # of 24: each is its own hit, so block, Thorns and the multi-hit
        # cancellation on the attacker's death all apply per hit.
        - {op: DAMAGE, target: PLAYER, amount: 6}
        - {op: DAMAGE, target: PLAYER, amount: 6}
        - {op: DAMAGE, target: PLAYER, amount: 6}
        - {op: DAMAGE, target: PLAYER, amount: 6}
    - name: REBIRTH
      move_id: 3               # AwakenedOne.java:85
      intent: UNKNOWN          # setMove((byte)3, Intent.UNKNOWN) (:309, :312)
      effects:
        # takeTurn case 3 (:174-178) queues only a ChangeStateAction("REBIRTH");
        # the two program steps below are what changeState (:213-227) itself
        # addToBottom's when that action RESOLVES, which is why they land AFTER
        # the trailing RollMoveAction (:207) rather than before it. The module
        # queues them in exactly that order -- see monster_awakened_one.cpp,
        # which also carries the one deviation (WHEN the halfDead flag clears).
        #
        # HealAction(this, this, this.maxHealth) (:225) -- a FULL heal from 0,
        # through AbstractMonster.heal, i.e. op_heal's monster branch. The amount
        # is maxHealth, which is the same two numbers as the hp column above.
        - {op: HEAL, target: SELF, amount: {base: 300, a9: 320}}
        # CanLoseAction (:226) -- re-arms the loss condition usePreBattleAction
        # disarmed. It is LAST on purpose: between the phase-1 death and this
        # step the boss sits at 0 HP with the room's cannotLose latch the only
        # thing holding the combat open.
        - {op: CAN_LOSE, target: SELF, amount: 0}   # no operands: the op clears a COMBAT flag
    - name: DARK_ECHO
      move_id: 5               # AwakenedOne.java:92 (4 is an unused byte)
      intent: ATTACK           # setMove(DARK_ECHO_NAME, (byte)5, Intent.ATTACK, 40)
      effects:
        # damage.get(2) == 40, flat (:133). takeTurn case 5 ALSO clears the
        # `firstTurn` latch at :183 -- state, not an effect, so it is native.
        - {op: DAMAGE, target: PLAYER, amount: 40}
    - name: SLUDGE
      move_id: 6               # AwakenedOne.java:93
      intent: ATTACK_DEBUFF    # setMove(SLUDGE_NAME, (byte)6, Intent.ATTACK_DEBUFF, 18)
      effects:
        # damage.get(3) == 18, flat (:134), THEN the card (:194).
        - {op: DAMAGE, target: PLAYER, amount: 18}
        # MakeTempCardInDrawPileAction(new VoidCard(), 1, true, true) (:194):
        # randomSpot = true, toBottom = false -> ShowCardAndAddToDrawPileEffect ->
        # drawPile.addToRandomSpot, i.e. CardGroup.java:463-469's
        # `group.add(cardRandomRng.random(size - 1), c)`. That is exactly
        # CardPile::DRAW_RANDOM, whose op_make_card branch already spends ONE
