# monsters.yaml -- monster registry (rules-as-data, design doc B §4.2, §5.2).
#
# Entry shape (frozen):
#   - id: <int>            numeric enum value -- append-only, NEVER renumbered
#     name: <SYMBOL>       generated enum symbol (MonsterId::<SYMBOL>)
#     game_id: "<string>"  the game's monster ID string -- translator/oracle join key
#     provenance: "<Class.method (File.java:line) -- read in full>"
#     enemy_type: <SYMBOL> AbstractMonster.type -- NORMAL | ELITE | BOSS.
#                          OPTIONAL, defaulting to NORMAL because that is the
#                          Java's own field initializer (`public EnemyType type =
#                          EnemyType.NORMAL;`, AbstractMonster.java:99); a monster
#                          class is non-NORMAL only if it assigns this.type
#                          (SlimeBoss.java:86 / TheGuardian.java:94 /
#                          Hexaghost.java:98 set BOSS; GremlinNob.java:63 /
#                          Lagavulin.java:75 / Sentry.java:61 set ELITE). Every
#                          row states it explicitly anyway, and a table test pins
#                          the whole column plus the row count, so a new row
#                          cannot land unclassified. This is what lets a relic ask
#                          "is this a boss fight?" from data: Pantograph
#                          (Pantograph.java:32-40) scans the MONSTER group for a
#                          BOSS-typed member -- it keys on monster type, not on
#                          the room being MonsterRoomBoss.
#     hp:                  per-ascension-tier HP range columns (design doc B §4.2/§6):
#       base: {min: , max: }     ascension 0+ column (mandatory)
#       a<N>: {min: , max: }     ascension >= N column(s), ascending
#     rolls: []            optional native per-instance RNG rolls; each carries
#                          name, stream, lifecycle timing, and tiered inclusive
#                          range columns. The native module consumes the data.
#       - name: <SYMBOL>
#         stream: MONSTER_HP
#         timing: CONSTRUCTOR_BEFORE_HP | CONSTRUCTOR_AFTER_HP | PRE_BATTLE
#                          BEFORE == a draw in the `super(...)` argument list,
#                          which Java evaluates before the ctor body, so it
#                          precedes the setHp draw (OrbWalker.java:53-58)
#         range: {base: {min: , max: }, a<N>: {min: , max: }}
#     moves:               move list; each move an intent + effect program in
#                          takeTurn addToBottom order (effects as data, §4.2)
#       - name: <SYMBOL>
#         move_id: <int>         the game's byte move id -- unique per monster, 0..255.
#                                0 IS PERMITTED, and 0 is ALSO the move_history
#                                empty-slot sentinel (monster_dispatch.hpp:29-33),
#                                so a monster that HAS a move 0 must never read its
#                                own move history -- the ring cannot tell "decided
#                                move 0" from "nothing decided yet". THREE rows in
#                                the game carry one: WrithingMass.BIG_HIT (57, S2.26;
#                                its lastMove(0) read sits behind a firstMove branch
#                                that returns unconditionally, so the collision is
#                                unreachable), and Donu (64) / Deca (65) (S2.28),
#                                whose getMoves key purely off `isAttacking` and
#                                never read the ring at all.
#                                (The loader bound was `>= 1` until S2.26; see
#                                tools/registry_gen/stsgen/emit/monsters.py.)
#         intent: <SYMBOL>       telegraphed intent (generated MonsterIntent)
#         effects:
#           - {op: <OPCODE>, target: SELF|PLAYER, amount: <tier columns>[, power: <SYMBOL>]}
#                                target SELF = the monster itself; PLAYER = the player.
#                                amount is either a flat int (all ascensions) or
#                                per-tier columns {base: , a<N>: , ...} like hp.
#     ai: native | {table: ...}  move-selection rule; `native` keeps selection in
#                          engine code (design doc B §4.2's honest budget: move
#                          *effects* as data, *selection* native where the table
#                          shape doesn't fit). ai tables are a later task.
#
# The generated monster_table.hpp resolves a tier column set at a concrete
# ascension via last-matching-threshold lookup (base <= a2 <= a7 <= a17 ...),
# mirroring the Java's descending if/else-if ascension branches exactly.
#
# Skeleton content (stage-a design §9). Id pinned JAW_WORM=1 and re-asserted in the
# generated header (design doc B §4.4). Stat columns from JawWorm.java's ascension
# branches (all three read in full); move effects from JawWorm.takeTurn's
# addToBottom order.

- id: 1
  name: JAW_WORM
  game_id: "JawWorm"
  provenance: "JawWorm ctor setHp/stat branches (JawWorm.java:79-104), takeTurn (JawWorm.java:120-146), getMove (JawWorm.java:148-184); ID (JawWorm.java:38). THE hardMode CONSTRUCTOR VARIANT, DISCHARGED BY S2.26 (the docs/s2-tasks.md deferred row): the 3-arg ctor JawWorm(x, y, boolean hard) (:75-108) is used ONLY by the Act-3 \"Jaw Worm Horde\" group, which builds three of them with hard = true (MonsterHelper.java:549-550); the 2-arg ctor delegates with false (:71-73). THE BOOLEAN CHANGES EXACTLY TWO THINGS AND NEITHER IS A STAT: (a) `firstMove = false` (:77-79), which suppresses the forced opening CHOMP so the OPENING decision runs the full getMove num-tree against an EMPTY move history -- and because every arm's history predicate is false on an empty history, that opening still costs exactly ONE aiRng.random(99) and no tiebreak, so the group's init draw count is unchanged (25% Chomp / 30% Thrash / 45% Bellow instead of 100% Chomp); (b) usePreBattleAction (:110-118) becomes non-empty -- ApplyPowerAction(this, this, StrengthPower(this, bellowStr), bellowStr) THEN GainBlockAction(this, this, bellowBlock), in that addToBottom order, so +5 Strength and 9 block per worm at A20. EVERY setHp RANGE AND EVERY TIER COLUMN BELOW SITS OUTSIDE THE hardMode GUARD (:81-104) and is therefore TRUSTED UNCHANGED for both variants -- which is precisely what the deferred row asked. The variant is modelled with no new MonsterId and no schema change (the Lagavulin awake-init precedent): monster_jaw_worm.cpp exports jaw_worm_init_hard alongside jaw_worm_init, run_advance's combat-start path branches on the encounter key, and the registered pre-battle fn is a no-op unless the hard-mode pad0 latch is set, so the ordinary Exordium worm and its Stage-A fixtures stay byte-identical."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    base: {min: 40, max: 44}   # JawWorm.java:83-84 (ascension < 7)
    a7:   {min: 42, max: 46}   # JawWorm.java:81-82 (ascension >= 7)
  moves:
    - name: CHOMP
      move_id: 1               # JawWorm.java:65
      intent: ATTACK
      effects:
        # chompDmg: base 11 (JawWorm.java:101), 12 from A2 (:95) and A17 (:89).
        - {op: DAMAGE, target: PLAYER, amount: {base: 11, a2: 12}}
    - name: BELLOW
      move_id: 2               # JawWorm.java:66
      intent: DEFEND_BUFF
      effects:
        # bellowStr: base 3 (JawWorm.java:99), 4 from A2 (:93), 5 from A17 (:87).
        - {op: APPLY_POWER, target: SELF, amount: {base: 3, a2: 4, a17: 5}, power: STRENGTH}
        # bellowBlock: base 6 (JawWorm.java:100 and :94), 9 from A17 (:88).
        - {op: BLOCK, target: SELF, amount: {base: 6, a17: 9}}
    - name: THRASH
      move_id: 3               # JawWorm.java:67
      intent: ATTACK_DEFEND
      effects:
        # thrashDmg 7 / thrashBlock 5 in all three branches (JawWorm.java:90-91,
        # :96-97, :102-103).
        - {op: DAMAGE, target: PLAYER, amount: 7}
        - {op: BLOCK, target: SELF, amount: 5}
  ai: native   # getMove decision tree (JawWorm.java:148-184): first move forced
               # Chomp, then d100 on aiRng with lastMove/lastTwoMoves history and
               # randomBoolean tiebreaks. Selection stays native (AbstractMonster
               # move history); move *effects* above are data.

