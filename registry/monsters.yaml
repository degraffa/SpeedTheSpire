        # empty (the empty-group branch appends without drawing).
        - {op: MAKE_CARD, target: PLAYER, amount: 1, card: VOID, pile: DRAW_RANDOM}
    - name: TACKLE
      move_id: 8               # AwakenedOne.java:94 (7 is an unused byte)
      intent: ATTACK           # setMove((byte)8, Intent.ATTACK, 10, 3, true)
      effects:
        # THREE separate DamageActions of damage.get(4) == 10 (:199-203), flat.
        - {op: DAMAGE, target: PLAYER, amount: 10}
        - {op: DAMAGE, target: PLAYER, amount: 10}
        - {op: DAMAGE, target: PLAYER, amount: 10}
  ai: native   # getMove (:243-278) is TWO DISJOINT TREES on `form1`, and neither
               # is expressible as a table: the phase-1 tree is gated on a
               # `firstTurn` latch it CLEARS, the phase-2 tree is gated on the
               # SAME latch and does NOT clear it (takeTurn case 5 does, :183),
