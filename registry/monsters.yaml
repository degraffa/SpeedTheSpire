    # kMonsterAscension 20 the live column is the a7 one, so this only bites the
    # tier-2 column table and any sub-A7 fixture; it is authored exactly because
    # getting it wrong would be invisible until one existed.
    base: {min: 30, max: 30}    # Exploder.java:59 (ascension < 7) -- setHp(30, 30)
    a7:   {min: 30, max: 35}    # Exploder.java:57 (ascension >= 7)
