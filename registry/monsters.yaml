  hp:
    base: {min: 140, max: 148}  # GremlinLeader.java:76 (ascension < 8)
    a8:   {min: 145, max: 155}  # GremlinLeader.java:74 (ascension >= 8)
  rolls: []
  moves:
    - name: RALLY
      move_id: 2               # GremlinLeader.java:51
