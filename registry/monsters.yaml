    # FIXED 20 AT EVERY ASCENSION, AND THIS MONSTER DRAWS ZERO monster_hp_rng.
    # setHp is NEVER called: the ctor hands maxHealth 20 to super
    # (SphericGuardian.java:67) and AbstractMonster's ctor (AbstractMonster.java:
    # 135-155) assigns `currentHealth = maxHealth` with no RNG anywhere in it.
