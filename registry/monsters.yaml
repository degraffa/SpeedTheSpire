- id: 60
  name: REPTOMANCER
  game_id: "Reptomancer"
  provenance: "Reptomancer (Reptomancer.java, 212 lines, read in full). ID \"Reptomancer\" (:41) -- the oracle join key and the string encounters.yaml id 57 already emits. type = ELITE (:65). The encounter is Dagger / Reptomancer / Dagger in THAT list order (MonsterHelper.java:536-539), the daggers built at Reptomancer.POSX[1] = -220 and POSX[0] = 210 respectively. ctor (:63-87) DRAWS monster_hp_rng TWICE: the super(...) argument is `AbstractDungeon.monsterHpRng.random(180, 190)` (:64), which Java evaluates before the constructor body, and setHp(190,200) at ascension >= 8 else setHp(180,190) (:68-72) draws again. The first value is overwritten and invisible; its POSITION in the stream is the observable, which is what the `rolls` entry below with timing CONSTRUCTOR_BEFORE_HP encodes (the Taskmaster, id 38, is the only other double-drawer). NOTE the super argument's range is the LITERAL (180, 190) at EVERY ascension -- only the setHp under it is branched. `daggersPerSpawn` is 2 at ascension >= 18 else 1 (:67). damage is added A3-branched IN ONE BLOCK (:73-79): at >= 3 it is [16, 34], below it [13, 30] -- get(0) is SNAKE_STRIKE_DMG, get(1) is BITE_DMG. POSX = {210, -220, 180, -250} and POSY = {75, 115, 345, 335} (:57-58) are the FOUR dagger slots; the Reptomancer's own offsetX is -20 (:64). usePreBattleAction (:89-102) walks the group ONCE and does two things per member: `if (!m.id.equals(this.id)) ApplyPowerAction(m, m, new MinionPower(this))` -- so every non-Reptomancer record in the group, dagger or not, becomes a MINION -- and, for each SnakeDagger, `daggers[0] = m` when its list index is GREATER than the Reptomancer's and `daggers[1] = m` otherwise. Note the id COMPARISON is by string, so a second Reptomancer would not minionize the first; the roster has no such group. takeTurn (:104-137): case SNAKE_STRIKE(1) is ChangeState + Wait + (VFX, DamageAction(damage.get(0))) TWICE + ApplyPowerAction(player, this, WeakPower(player, 1, true), 1); case SPAWN_DAGGER(2) is ChangeState + Wait + the spawn loop; case BIG_BITE(3) is AnimateFastAttack + VFX + one DamageAction(damage.get(1)). RollMoveAction (:136) sits OUTSIDE the switch. The BiteEffect VFX arguments call MathUtils.random(-50f, 50f), UNSEEDED, twice per bite. THE SPAWN LOOP (:120-127) scans `daggers[0..3]` in INDEX ORDER, skips a slot whose occupant is non-null and NOT isDeadOrEscaped, and for each of the first `daggersPerSpawn` free slots constructs `new SnakeDagger(POSX[i], POSY[i])` -- a monster_hp_rng draw AT QUEUE TIME, because Java constructs the argument before `new SpawnMonsterAction(...)` -- assigns daggers[i] and queues SpawnMonsterAction(dagger, true). canSpawn (:139-146) counts every record that is neither `this` nor isDying and returns aliveCount <= 3; it is consulted by getMove, NOT by takeTurn, so a SPAWN_DAGGER already telegraphed still fires even if the group filled up in between. die (:157-165) is super.die() FIRST and then, for every record that is neither isDead nor isDying, addToTop(HideHealthBarAction) + addToTop(SuicideAction) -- the post-super ordering is what makes the sweep skip the Reptomancer itself, and the 1-arg SuicideAction defaults triggerRelics to TRUE. getMove (:167-195) RECURSES on two arms with fresh seeded draws."
  enemy_type: ELITE    # Reptomancer.java:65
  hp:
    base: {min: 180, max: 190}  # Reptomancer.java:71 (ascension < 8)
    a8:   {min: 190, max: 200}  # Reptomancer.java:69 (ascension >= 8)
  rolls:
    # The super(...) ARGUMENT draw (Reptomancer.java:64), the Taskmaster's shape
    # exactly. Its VALUE is thrown away by the setHp below it; its POSITION in the
    # monster_hp_rng sequence is the whole point, which is what timing
    # CONSTRUCTOR_BEFORE_HP encodes (burn_unspawned_ctor_rolls' two-pass walk,
    # monster_dispatch.cpp). NO tier columns: the argument is the flat literal
    # random(180, 190) at every ascension -- only the setHp under it moves.
    - name: SUPER_ARG_HP
      stream: MONSTER_HP
      timing: CONSTRUCTOR_BEFORE_HP
      range:
        base: {min: 180, max: 190}  # Reptomancer.java:64 -- literal, unbranched
  moves:
    - name: SNAKE_STRIKE
      move_id: 1               # Reptomancer.java:54
      intent: ATTACK_DEBUFF    # setMove(1, ATTACK_DEBUFF, dmg[0].base, 2, true)
      effects:
        # TWO SEPARATE DamageActions on damage.get(0) (:111,113) and THEN the Weak
        # (:114) -- the order is the queue order and it is load-bearing. dmg[0] is
        # 13, 16 from A3 (:74,77).
        - {op: DAMAGE, target: PLAYER, amount: {base: 13, a3: 16}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 13, a3: 16}}
        # WeakPower(player, 1, true) -- amount 1, flat at every ascension (:114).
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: WEAK}
    - name: SPAWN_DAGGER
      move_id: 2               # Reptomancer.java:55
      intent: UNKNOWN          # setMove((byte)2, Intent.UNKNOWN) (:171,183)
      effects:
        # A NOP PLACEHOLDER, the Darkling COUNT precedent. Everything this move
        # does is the native spawn loop (:120-127): the free-slot scan over
        # daggers[0..3], the QUEUE-TIME SnakeDagger construction (a monster_hp_rng
        # draw each) and one SPAWN_MONSTER item per dagger carrying that dagger's
        # POSX as draw_x. None of it is expressible as an effect step, and the
        # count is `daggersPerSpawn` (1, or 2 from A18). See monster_reptomancer.cpp.
        - {op: NOP, target: SELF, amount: 0}
    - name: BIG_BITE
      move_id: 3               # Reptomancer.java:56
      intent: ATTACK           # setMove(3, ATTACK, dmg[1].base) (:191)
      effects:
        # ONE DamageAction on damage.get(1) (:133). BITE_DMG 30, 34 from A3 (:75,78).
        - {op: DAMAGE, target: PLAYER, amount: {base: 30, a3: 34}}
  ai: native   # getMove (:167-195) RECURSES on two arms with FRESH SEEDED DRAWS --
               # `this.getMove(AbstractDungeon.aiRng.random(33, 99))` (:178) and
               # `this.getMove(AbstractDungeon.aiRng.random(65))` (:193) -- so
               # termination is probabilistic, not bounded, exactly as the Gremlin
               # Leader's is; a transcription that reuses `num` diverges on the
