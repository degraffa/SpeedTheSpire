  moves:
    - name: MUG
      move_id: 1               # Mugger.java:48
      intent: ATTACK
      effects:
        # damage.get(0) == swipeDmg: 10, or 11 from A2 (Mugger.java:67-73). The
        # 3-arg DamageAction (:96) also steals goldAmt; the steal ACCOUNTING is
        # native (monster_mugger.cpp -- pad0 is the steal count, exactly the
