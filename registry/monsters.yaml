      effects:
        # ORDER IS LOAD-BEARING (:119-123): Weak on the PLAYER first, THEN
        # Strength on the Chosen itself. Both flat, no ascension branch
        # (DRAIN_WEAK 3 at :62, DRAIN_STR 3 at :61).
