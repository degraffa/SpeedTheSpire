NOSTIC -- it caps THORNS and HP_LOSS too. The rest of the override is animation. die (:213-217) is playDeathSfx and THEN super.die(), and playDeathSfx (:204-211) rolls UNSEEDED MathUtils -- so NO MonsterDieFn entry (explicit nullptr, monster_dispatch.cpp). update() (:219-231) is fire particles. getMove (:145-193) is ai: native for two independent reasons -- it decrements `scytheCooldown` on EVERY call before branching, and three of its arms spend an EXTRA aiRng.randomBoolean() draw."
  enemy_type: ELITE    # Nemesis.java:69
  hp:
