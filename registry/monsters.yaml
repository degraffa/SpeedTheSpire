               # turnCount < 2 ? ATTACK : move 2 -- but rollMove still draws one
               # aiRng.random(99) every time (AbstractMonster.java:712-714), and
               # that draw moves the stream its groupmates share. That is the whole
               # reason this is native and not an empty table. turnCount needs NO
               # STORAGE: see monster_exploder.hpp for the exact move-history
               # predicate it is derived from.

- id: 53
  name: SPIKER
  game_id: "Spiker"
  provenance: "Spiker (Spiker.java, read in full, 111 lines). ID \"Spiker\" (:28). ENCOUNTER_NAME \"Ancient Shapes\" (:33) is DEAD CONTENT, as on the Repulsor and the Exploder. ctor (:52-70): super passes the LITERAL 56 (:53) -- no draw -- then setHp(44,60) at ascension >= 7 else (42,56) (:57-61), then the >= 2 branch (:62-68) gives startingThorns 4 / attackDmg 9 (3 / 7 below). ONE monster_hp_rng draw. usePreBattleAction (:72-79): ApplyPowerAction(this, this, new ThornsPower(this, ascension >= 17 ? startingThorns + 3 : startingThorns)). THE A17 ARM STACKS ON TOP OF THE A2 ARM -- it is startingThorns + 3, reading the already-tiered field, not a restated literal -- so at the engine's kMonsterAscension 20 the opening Thorns is 4 + 3 = 7, not 6 and not 4. The ApplyPowerAction is 3-arg, so the stack amount is powerToApply.amount, the same number. ThornsPower is ALREADY REGISTERED (powers.yaml id 16, native, on_attacked) and needs no new row; this is simply its first MONSTER owner, reflecting into the player. Move ids ATTACK=1, BUFF_THORNS=2 (:45,49); BUFF_AMT 2 (:50). takeTurn (:81-95): case 2 does ++thornsCount and then ApplyPowerAction(this, this, new ThornsPower(this, 2), 2) (:87-89); it has no break (:89) but is the last case, so the fall-through is inert. Both cases reach the trailing RollMoveAction (:93). getMove (:97-110): thornsCount > 5 is a PERMANENT latch into ATTACK -- from the SEVENTH decision after six BUFF turns, the Spiker never buffs again and its Thorns sits at 7 + 12 = 19 at A20."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    base: {min: 42, max: 56}    # Spiker.java:60 (ascension < 7)
    a7:   {min: 44, max: 60}    # Spiker.java:58 (ascension >= 7)
  rolls: []
  moves:
    - name: ATTACK
      move_id: 1               # Spiker.java:45
      intent: ATTACK           # setMove(1, ATTACK, dmg[0].base) (:100,105)
      effects:
        # damage.get(0) == attackDmg: 7, or 9 from A2 (:62-68). AnimateSlowAttack
        # (:84) is presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 7, a2: 9}}
    - name: BUFF_THORNS
      move_id: 2               # Spiker.java:49
      intent: BUFF             # setMove((byte)2, Intent.BUFF) (:109)
      effects:
        # ApplyPowerAction(this, this, new ThornsPower(this, 2), 2) (:88) --
        # BUFF_AMT 2 (:50), flat at every ascension. The ++thornsCount at :87 is
        # the module's own bookkeeping and is not an effect step.
        - {op: APPLY_POWER, target: SELF, amount: 2, power: THORNS}
  ai: native   # getMove (Spiker.java:97-110) reads a PER-INSTANCE COUNTER that no
               # move-history ring can carry: BUFF turns are not contiguous, so
               # thornsCount > 5 cannot be recovered from the 3-slot history. The
               # rest is num < 50 && !lastMove(ATTACK). See monster_spiker.cpp for
