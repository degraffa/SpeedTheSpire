277); the forge arm's roll bound is num <= 30 at ascension >= 19 else num <= 15, gated on !lastMove(2) && forgeTimes < forgeThreshold(2), ++forgeTimes at DECISION time (:278-288); !lastMove(5) && !lastMove(2) && num <= 30 -> GLOAT/BUFF (:289-292); !lastMove(4) && num <= 55 -> FACE_SLAP (:293-296); !lastMove(1) -> HEAVY_SLASH else FACE_SLAP (:297-301). numTurns and forgeTimes pack into MonsterState.pad0 nibbles; thresholdReached is a monster flag bit. die (:305-318): super.die() first, then an UNSEEDED MathUtils sound coin and onBossVictoryLogic -- NO sim-visible content on either side of super.die(), so explicit nullptr in BOTH die slots."
