    - name: RIPPLE
      move_id: 3               # TimeEater.java:59
      intent: DEFEND_DEBUFF    # setMove((byte)3, Intent.DEFEND_DEBUFF) (:200,204)
                               # -- MonsterIntent 15, this batch's whole grant.
      effects:
        # In addToBottom order (:129-133). RIPPLE_BLOCK 20 is flat.
        - {op: BLOCK, target: SELF, amount: 20}
        # Vulnerable/Weak(player, 1, true) -- the isJustApplied MONSTER-SOURCE
        # form the duration-debuff model already carries.
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: VULNERABLE}
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: WEAK}
        # A19 ONLY (:132-133). PRESENCE, not an amount, so the effect list cannot
        # express the gate: the step is authored here and monster_time_eater.cpp
        # queues steps 0..2 always and step 3 only at A19, through the per-step
        # queue_monster_move_effect the Snecko's identical A17 arm introduced.
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: FRAIL}
    - name: HEAD_SLAM
      move_id: 4               # TimeEater.java:60
      intent: ATTACK_DEBUFF    # setMove((byte)4, Intent.ATTACK_DEBUFF, damage[1].base)
      effects:
        # damage.get(1) == headSlamDmg: 26 base, 32 from A4 (:90-96).
        - {op: DAMAGE, target: PLAYER, amount: {base: 26, a4: 32}}
        # DrawReductionPower(player, 1) -- HEAD_SLAM_STICKY 1 (:70), flat.
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: DRAW_REDUCTION}
        # A19 ONLY (:141-142): MakeTempCardInDiscardAction(new Slimed(), 2).
        # PRESENCE again -- same native per-step gate as RIPPLE's Frail.
        - {op: MAKE_CARD, target: PLAYER, amount: 2, card: SLIMED, pile: DISCARD}
    - name: HASTE
      move_id: 5               # TimeEater.java:61
      intent: BUFF             # setMove((byte)5, Intent.BUFF) (:180)
      effects:
        # RemoveDebuffsAction(this) (:147) -- enumerates the boss's DEBUFFs at
        # RESOLVE time and removes each.
        - {op: REMOVE_DEBUFFS, target: SELF, amount: 0}   # no operand; the op enumerates at resolve
        # RemoveSpecificPowerAction(this, this, "Shackled") (:148). REDUNDANT:
        # Shackled is a DEBUFF and the action above already removed it, so this
        # is a no-op at every reachable state. Authored anyway, because the pair
        # is what the Java queues and a free no-op is cheaper than a comment
        # claiming a step does not exist.
        - {op: REMOVE_POWER, target: SELF, amount: 0, power: SHACKLED}
        # THE HEAL IS NOT HERE, and its absence is deliberate. HealAction(this,
        # this, this.maxHealth / 2 - this.currentHealth) (:149) is a RUNTIME
        # amount -- INTEGER division of the live max HP, minus the live current
        # HP -- which no tier column can express, so monster_time_eater.cpp
        # queues it between this step and the next (the Louse's rolled bite
        # damage precedent: per-instance amounts are not in the table). It can be
        # NEGATIVE if the boss is at or above half when Haste resolves, which
        # op_heal's `amount <= 0` guard drops; getMove's gate makes that
        # unreachable, and the module says so.
        # A19 ONLY (:150-151): GainBlockAction(this, headSlamDmg) -- the SAME
        # field the HEAD_SLAM damage reads, so the tier columns must match it.
        - {op: BLOCK, target: SELF, amount: {base: 26, a4: 32}}
  ai: native   # getMove (:177-206) is the one tree in this batch that spends
               # EXTRA aiRng draws: two of its arms RE-ENTER getMove with a fresh
               # random(50, 99) / random(74) and the third spends a
               # randomBoolean(0.66f), each inside its own history guard, so the
               # number of draws a turn costs depends on the move history. It is
               # also gated by a one-shot `usedHaste` latch on a STRICT
               # `currentHealth < maxHealth / 2` integer-division threshold. See
               # monster_time_eater.cpp.

- id: 64
  name: DONU
  game_id: "Donu"
  provenance: "Donu (Donu.java, 146 lines, read in full). ID (:35); type = BOSS (:60); ctor setHp branch (:63-67) and beamDmg (:68); usePreBattleAction (:93-99); takeTurn (:102-122); getMove (:125-131); die() (:134-144). Move ids BEAM=0 and CIRCLE_OF_PROTECTION=2 (:42-43) -- 1 is unused. Group order is Deca (slot 0) then Donu (slot 1), MonsterHelper.java:591-593, which encounters.yaml row 60 already has."
  enemy_type: BOSS     # Donu.java:61
  hp:
    base: {min: 250, max: 250}   # Donu.java:66
    a9:   {min: 265, max: 265}   # Donu.java:64
  moves:
    - name: BEAM
      move_id: 0               # Donu.java:42 -- A REAL MOVE ID 0, and the FIRST
                               # in the roster. 0 is also the move_history
                               # empty-slot sentinel, so Donu must never read its
                               # own history; its getMove (:125-131) reads only
                               # `isAttacking` and does not. See the move_id note
                               # in this file's header and monster_donu_deca.cpp.
      intent: ATTACK           # setMove((byte)0, Intent.ATTACK, damage[0].base, 2, true)
      effects:
        # TWO separate DamageActions of damage.get(0) == beamDmg (:106-110):
        # 10 base, 12 from A4 (:68).
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a4: 12}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a4: 12}}
    - name: CIRCLE_OF_PROTECTION
      move_id: 2               # Donu.java:43
      intent: BUFF             # setMove(CIRCLE_NAME, (byte)2, Intent.BUFF) (:129).
                               # BUFF, not DEFEND_DEBUFF: the dispatching brief
                               # said otherwise and the tree was re-read before
                               # MonsterIntent 15 was spent (see vocab.py).
      effects:
        # ONE AUTHORED STEP, FANNED OUT NATIVELY. The Java queues one
        # ApplyPowerAction(m, this, StrengthPower(m, 3), 3) per member of
        # getMonsters().monsters (:114-117) -- INCLUDING ITSELF and with NO
        # liveness filter at all, unlike every S2.22 walk. A per-combat action
        # COUNT is not expressible in an effect list, so this is the template and
        # monster_donu_deca.cpp repeats it per record. CIRCLE_STR_AMT 3 is flat (:50).
        - {op: APPLY_POWER, target: SELF, amount: 3, power: STRENGTH}
  ai: native   # getMove (:125-131) IGNORES `num` entirely and switches on the
               # `isAttacking` latch takeTurn flips at QUEUE time -- but the
               # RollMoveAction still runs, so the aiRng.random(99) draw is spent
               # every turn and changes nothing. Modelling the draw is the point.

- id: 65
  name: DECA
  game_id: "Deca"
  provenance: "Deca (Deca.java, 158 lines, read in full). ID (:38); ENC_NAME \"Donu and Deca\" (:43); type = BOSS (:64); ctor setHp branch (:67-71) and beamDmg (:72); usePreBattleAction (:97-108); takeTurn (:110-132); getMove (:135-143); die() (:146-156). Move ids BEAM=0 and SQUARE_OF_PROTECTION=2 (:46-47) -- 1 is unused. Deca is spawned FIRST (slot 0) despite the encounter key naming Donu first (MonsterHelper.java:591-593)."
  enemy_type: BOSS     # Deca.java:61
  hp:
    base: {min: 250, max: 250}   # Deca.java:70
    a9:   {min: 265, max: 265}   # Deca.java:68
  moves:
    - name: BEAM
      move_id: 0               # Deca.java:46 -- the same real move id 0 as Donu's;
                               # Deca's getMove reads no history either.
      intent: ATTACK_DEBUFF    # setMove((byte)0, Intent.ATTACK_DEBUFF, ...) (:137)
      effects:
        # TWO DamageActions of damage.get(0) == beamDmg (:115-117), then the
        # cards (:118). BEAM_DAZE_AMT 2 is flat (:53).
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a4: 12}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a4: 12}}
        - {op: MAKE_CARD, target: PLAYER, amount: 2, card: DAZED, pile: DISCARD}
    - name: SQUARE_OF_PROTECTION
      move_id: 2               # Deca.java:47
      intent: DEFEND_BUFF      # ASCENSION-SWITCHED, and this column carries only
                               # the LIVE one. getMove telegraphs Intent.DEFEND_BUFF
                               # at A19+ and Intent.DEFEND below (:139-141) -- the
                               # first per-tier INTENT in the roster, which the row
                               # schema (one intent per move) cannot express. The
                               # engine runs at kMonsterAscension == 20, so
                               # DEFEND_BUFF is the live value; monster_donu_deca.cpp
                               # owns BOTH arms and its decide function takes the
                               # ascension so the tier-2 tests can drive the other.
      effects:
        # TWO AUTHORED TEMPLATE STEPS, FANNED OUT NATIVELY over the WHOLE group
        # -- again with NO liveness filter (:122-128) -- and the second is A19-ONLY
        # PRESENCE. The Java's loop body is
        #     GainBlockAction(m, this, 16);
        #     if (ascensionLevel >= 19) ApplyPowerAction(m, this, PlatedArmor(m,3), 3);
        # i.e. the two steps INTERLEAVE PER MEMBER (block, armor, block, armor...),
        # not block-for-all then armor-for-all. monster_donu_deca.cpp reproduces that
        # interleaving; it is observable the moment anything reads the queue.
        - {op: BLOCK, target: SELF, amount: 16}
        # PLATED_ARMOR is already registered (id 17) with an on_power_removed
        # binding from S2.21. Deca is the FIRST producer in the game that puts it
        # on ANOTHER MONSTER -- it can plate Donu -- which makes Plated Armor's
        # run-out path reachable on a boss.
        - {op: APPLY_POWER, target: SELF, amount: 3, power: PLATED_ARMOR}
  ai: native   # getMove (:135-143) ignores `num` exactly as Donu's does and keys
               # off the same queue-time `isAttacking` flip -- but Deca's field is
               # initialised TRUE (:74) where Donu's is FALSE (:70), which is what
               # puts the pair permanently OUT OF PHASE: Deca opens on BEAM, Donu
               # opens on CIRCLE, and they swap every turn thereafter. The per-turn
               # aiRng.random(99) is still spent by both.
