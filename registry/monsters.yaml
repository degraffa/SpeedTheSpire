  enemy_type: NORMAL   # AbstractMonster.java:99 -- no this.type assignment
  hp:
    base: {min: 95, max: 99}    # Chosen.java:83 (ascension < 7)
    a7:   {min: 98, max: 103}   # Chosen.java:81 (ascension >= 7) -- >= 7, not >= 2
  rolls: []
  moves:
    - name: ZAP
      move_id: 1               # Chosen.java:63
      intent: ATTACK
      effects:
        # FastShakeAction (:115) is presentation. damage.get(0) == zapDmg: 18, or
        # 21 from A2 (:85-93). AttackEffect.FIRE is presentation too.
        - {op: DAMAGE, target: PLAYER, amount: {base: 18, a2: 21}}
    - name: DRAIN
      move_id: 2               # Chosen.java:64
      intent: DEBUFF
      effects:
        # ORDER IS LOAD-BEARING (:119-123): Weak on the PLAYER first, THEN
        # Strength on the Chosen itself. Both flat, no ascension branch
        # (DRAIN_WEAK 3 at :62, DRAIN_STR 3 at :61).
        - {op: APPLY_POWER, target: PLAYER, amount: 3, power: WEAK}
        - {op: APPLY_POWER, target: SELF, amount: 3, power: STRENGTH}
    - name: DEBILITATE
      move_id: 3               # Chosen.java:65
      intent: ATTACK_DEBUFF
      effects:
        # damage.get(1) == debilitateDmg: 10, or 12 from A2; then Vulnerable 2
        # (DEBILITATE_VULN, :60). Damage first (:124-129).
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 12}}
        - {op: APPLY_POWER, target: PLAYER, amount: 2, power: VULNERABLE}
    - name: HEX
      move_id: 4               # Chosen.java:66
      intent: STRONG_DEBUFF
      effects:
        # TalkAction / ChangeStateAction("ATTACK") / WaitAction (:131-133) are all
        # presentation -- changeState's ATTACK branch (:141-149) is two spine
        # animation calls and nothing else. HexPower(player, 1) is the whole move
        # (:134; HEX_AMT at :68). powers.yaml id 93.
        - {op: APPLY_POWER, target: PLAYER, amount: 1, power: HEX}
    - name: POKE
      move_id: 5               # Chosen.java:67
      intent: ATTACK
      effects:
        # TWO SEPARATE DamageActions on damage.get(2) (:110-111), not one doubled
        # hit -- so block, a Flight-style halving and a lethal clamp all apply per
        # hit. pokeDmg 5, or 6 from A2. setMove telegraphs it as `2, true`
        # (multi-hit) at :171/:176/:196.
        - {op: DAMAGE, target: PLAYER, amount: {base: 5, a2: 6}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 5, a2: 6}}
  ai: native   # getMove (:151-197) reads a HEX latch and TWO history predicates
               # (!lastMove(3) && !lastMove(2)) before it reads its rolled num, and
               # the whole tree is arm-switched on ascension. At A20 the A17+ arm
               # is live: HEX is the forced opener, then num<50 Debilitate else
               # Drain while neither of those was last, else num<40 Zap else Poke.
               # `usedHex` needs no state bit at A20 -- it is true on every call
               # after init's (see combat_state.hpp). See monster_chosen.cpp.

