- id: 30
  name: SPHERIC_GUARDIAN
  game_id: "SphericGuardian"
  provenance: "SphericGuardian (SphericGuardian.java, read in full). ID \"SphericGuardian\" (:36) -- NO space, and DISTINCT from the encounter keys \"Spheric Guardian\" / \"Sphere and 2 Shapes\", which do have one. ctor (:66-75) passes maxHealth 20 straight to super and NEVER calls setHp -- see the hp block below. `dmg` is a FIELD INITIALIZER, `ascensionLevel >= 2 ? 11 : 10` (:48), which Java runs after super() and before the ctor body, so damage.get(0) at :68 already has the branched value. Fixed constants: SLAM_AMT 2 (:49), HARDEN_BLOCK 15 (:50), FRAIL_AMT 5 (:51), ACTIVATE_BLOCK 25 (:52), ARTIFACT_AMT 3 (:53), STARTING_BLOCK_AMT 40 (:54). Move ids BIG_ATTACK=1, INITIAL_BLOCK_GAIN=2, BLOCK_ATTACK=3, FRAIL_ATTACK=4 (:55-58). usePreBattleAction (:77-82) in order: Barricade, Artifact(3), GainBlock(40). takeTurn (:84-121): all four cases reach the trailing RollMoveAction (:120). getMove (:145-162). die() (:164-172) picks a sound with UNSEEDED MathUtils and models nothing."
  enemy_type: NORMAL   # AbstractMonster.java:99
  hp:
    # FIXED 20 AT EVERY ASCENSION, AND THIS MONSTER DRAWS ZERO monster_hp_rng.
    # setHp is NEVER called: the ctor hands maxHealth 20 to super
    # (SphericGuardian.java:67) and AbstractMonster's ctor (AbstractMonster.java:
    # 135-155) assigns `currentHealth = maxHealth` with no RNG anywhere in it.
    # It is the FIRST registry monster with no HP draw, so encounter-level draw
    # accounting differs from every other group: "Spheric Guardian" solo costs 0
    # monster_hp_rng draws, and "Sentry and Sphere" costs 1 (the Sentry's), not 2.
    # A single {min: 20, max: 20} column is the honest spelling -- there is no tier
    # branch to record -- and the native module SKIPS the draw entirely rather than
    # calling random() with a degenerate range, which WOULD move the stream.
    base: {min: 20, max: 20}   # SphericGuardian.java:67 -- ctor arg, no setHp
  rolls: []
  moves:
    - name: BIG_ATTACK
      move_id: 1               # SphericGuardian.java:55
      intent: ATTACK
      effects:
        # TWO SEPARATE DamageActions on damage.get(0) (:90-91) -- SLAM_AMT 2 (:49)
        # is the telegraphed multiplier, and setMove passes `2, true` (:160). dmg
        # is 10, or 11 from A2 (:48). ChangeState("ATTACK") + Wait (:88-89) are
        # presentation.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
    - name: INITIAL_BLOCK_GAIN
      move_id: 2               # SphericGuardian.java:56
      intent: DEFEND
      effects:
        # THE ONLY IN-takeTurn ASCENSION BRANCH IN THIS WHOLE BATCH (:95-99): 35
        # at A17+, else 25. It has NO named constant for the A17 value --
        # ACTIVATE_BLOCK (:52) is only the 25 -- so the 35 is a literal in the
        # branch and is transcribed as one. Every other ascension branch across
        # these four monsters lives in a ctor. The WaitAction and the
        # MathUtils-coin-flipped SFX after it (:100-106) are presentation on an
        # UNSEEDED generator.
        - {op: BLOCK, target: SELF, amount: {base: 25, a17: 35}}
    - name: BLOCK_ATTACK
      move_id: 3               # SphericGuardian.java:57
      intent: ATTACK_DEFEND
      effects:
        # ORDER IS LOAD-BEARING (:109-111): the block lands FIRST, then the
        # attack. HARDEN_BLOCK 15 (:50), flat.
        - {op: BLOCK, target: SELF, amount: 15}
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
    - name: FRAIL_ATTACK
      move_id: 4               # SphericGuardian.java:58
      intent: ATTACK_DEBUFF
      effects:
        # Damage then Frail 5 (FRAIL_AMT at :51), :115-117.
        - {op: DAMAGE, target: PLAYER, amount: {base: 10, a2: 11}}
        - {op: APPLY_POWER, target: PLAYER, amount: 5, power: FRAIL}
  ai: native   # getMove (:145-162) NEVER READS num: firstMove -> 2, secondMove ->
               # 4, then strict alternation on lastMove(1) between 3 and 1. The
               # rolls still happen and still move the ai_rng stream (the Guardian
               # / Red Slaver / Looter discarded-draw precedent), which is the
               # whole reason this is native rather than an empty table.
               # `secondMove` is kMonsterFlagSphericSecondMove.
               # See monster_spheric_guardian.cpp.

