# `ascensionLevel >= 8` while naming the constants `A_2_HP_*`. EVERY "A_2_" NAME
# IN THIS BATCH LIES: the Gremlin Leader's strAmt/blockAmt chain is named
# `A_2_STR_AMT` on a `>= 3` branch, and the Taskmaster's `A_2_WOUNDS` likewise.
# The columns below follow the BRANCH, not the constant name -- the Chosen
# precedent (S2.21) -- which is why `a3` and `a8` appear here for the first time.
# Both parse with no schema change: the generator's tier key is the free regex
# `^(base|a[1-9][0-9]?)$` (stsgen/vocab.py TIER_RE).
