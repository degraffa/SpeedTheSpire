- id: 41
  name: BRONZE_ORB
  game_id: "BronzeOrb"
  provenance: "BronzeOrb (BronzeOrb.java, 103 lines, read in full). ID (:31); assigns NO type -> NORMAL (AbstractMonster.java:99). ctor (:47-56): the super(...) HP argument is monsterHpRng.random(52, 58) (:48) -- a REAL draw whose value is thrown away by the setHp under it -- then setHp(54, 60) at ascension >= 9 else setHp(52, 58) (:49-53): TWO monster_hp_rng draws per orb, the first flat at every ascension (row SUPER_ARG_HP, timing CONSTRUCTOR_BEFORE_HP, the Taskmaster/Orb Walker shape). `count` (:54) feeds only the update() bobbing animation -- presentation, no storage. damage list [8] (:55). Move ids BEAM=1, SUPPORT_BEAM=2, STASIS=3 (:41-43). takeTurn (:59-77): case 1 one DamageAction(damage.get(0)) (:65); case 2 GainBlockAction(getMonsters().getMonster(\"BronzeAutomaton\"), this, 12) (:69) -- the recipient is THE BOSS found by id over the whole group, dead records included (MonsterGroup.java:108-115), so the step is authored SELF and retargeted natively; case 3 ApplyStasisAction(this) (:73) -- opcode APPLY_STASIS, see vocab.py 71. RollMoveAction (:76) sits outside the switch. getMove (:86-101): !usedStasis && num >= 25 -> STASIS and usedStasis = true AT DECISION TIME (:87-91) -- a once-per-combat latch read by every later roll (monster flag bit, kMonsterFlagBronzeOrbUsedStasis); num >= 70 && !lastTwoMoves(2) -> SUPPORT_BEAM (:92-95); !lastTwoMoves(1) -> BEAM (:96-99); else SUPPORT_BEAM (:100). Spawned ONLY by the Automaton's SPAWN_ORBS (isMinion=true -> the Minion power addToTop at spawn resolve, SpawnMonsterAction.java:67-69); appears in no encounter. No usePreBattleAction, no die() override."
  hp:
    base: {min: 52, max: 58}    # BronzeOrb.java:52 (ascension < 9)
    a9:   {min: 54, max: 60}    # BronzeOrb.java:50 (ascension >= 9)
  rolls:
    # The super(...) ARGUMENT draw (BronzeOrb.java:48). Its VALUE is thrown
    # away by the setHp below it; its POSITION in the monster_hp_rng sequence
    # is the point (timing CONSTRUCTOR_BEFORE_HP, S2.2F). NO tier columns: the
    # argument is the flat literal random(52, 58) at every ascension -- only
    # the setHp under it moves.
    - name: SUPER_ARG_HP
      stream: MONSTER_HP
      timing: CONSTRUCTOR_BEFORE_HP
      range:
        base: {min: 52, max: 58}  # BronzeOrb.java:48 -- literal, unbranched
  moves:
    - name: BEAM
      move_id: 1               # BronzeOrb.java:41
      intent: ATTACK           # setMove(1, ATTACK, 8) (:97)
      effects:
        # damage.get(0) == BEAM_DMG 8 (:39,:55), flat at every ascension.
        - {op: DAMAGE, target: PLAYER, amount: 8}
    - name: SUPPORT_BEAM
      move_id: 2               # BronzeOrb.java:42
      intent: DEFEND           # setMove(2, Intent.DEFEND) (:93,:100)
      effects:
        # ONE AUTHORED TEMPLATE STEP, RETARGETED NATIVELY at the BOSS: the
        # GainBlockAction's recipient is getMonster("BronzeAutomaton") -- the
        # first record with that id, LIVENESS UNTESTED (MonsterGroup.java:
        # 108-115) -- and a monster move step can only spell SELF or PLAYER,
        # so the module (monster_bronze_orb.cpp) retargets this step at the
        # boss's slot (the Healer fan-out precedent, narrowed to one
        # recipient). BLOCK_AMT 12 (:40,:69), flat. A dead boss cannot be the
        # recipient in practice -- its die() sweep suicides every orb -- and
        # op_block's isDying recipient read (S2.28) covers the gap anyway.
        - {op: BLOCK, target: SELF, amount: 12}
    - name: STASIS
      move_id: 3               # BronzeOrb.java:43
      intent: STRONG_DEBUFF    # setMove(3, Intent.STRONG_DEBUFF) (:88)
      effects:
        # ApplyStasisAction(this) (:73) -- the whole theft is opcode 71
        # APPLY_STASIS (vocab.py): pile choice, rarity cascade, pick, the move
        # into limbo and the addToTop'd Stasis apply are ALL execute-time
        # facts. `src` (the acting orb, the future power owner) is the only
        # operand and the queue helper stamps it.
        - {op: APPLY_STASIS, target: SELF, amount: 0}
  ai: native   # getMove (:86-101) reads and WRITES the once-per-combat
               # usedStasis latch at decision time and reads lastTwoMoves on
