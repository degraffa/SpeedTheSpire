# --- The Looter (landed with the escape predicate; see the block comment
# above the slavers for why it did not land with them) -------------------------
# Looter.java read in full (:33-193). Draw accounting at A20:
#   * ctor setHp(46, 50) -- one monster_hp_rng draw (AbstractMonster.java:765-775).
#   * init() rollMove -- one ai_rng.random(99) draw, which getMove (:177-179)
#     then IGNORES: the opener is unconditionally Mug. No takeTurn body queues a
#     RollMoveAction, so this is the ONLY rollMove draw of the whole combat --
#     every later transition is a setMove / queued SetMoveAction inside takeTurn
#     (the Guardian precedent, not the slaver one).
#   * takeTurn's OWN ai_rng draws, both randomBoolean (nextFloat) draws:
#       - the FIRST Mug only: `slashCount == 0 && aiRng.randomBoolean(0.6f)`
#         (:92) gates a TalkAction -- presentation, but the DRAW moves the
#         stream, and Java's && short-circuit means later Mugs draw NOTHING.
#       - the SECOND attack (slashCount reaches 2, :100-107): one
#         aiRng.randomBoolean(0.5f) -- true means Smoke Bomb next, false means
#         Lunge next. The Lunge turn itself rolls nothing (:111-118).
#   * playSfx / playDeathSfx roll MathUtils.random -- the libgdx global
#     generator, NOT a seeded stream (unlike the Act-2 Mugger, which rolls
#     aiRng for the same sound, Mugger.java:139,149).
# The gold steal: usePreBattleAction applies ThieveryPower(this, goldAmt) (:85;
# powers.yaml id 75), goldAmt = 15 / A17 20 (:63). Each Mug/Lunge queues an
# anonymous accrual action (stolenGold += min(goldAmt, player.gold); the
# synthetic accessors :181-192 are its residue -- CONFIRMED 2026-07-28, no
# longer inferred from the accessors: Looter$1 (:97) and Looter$2 (:115) were
# recovered from the shipped desktop-1.0.jar and both read exactly
# `stolenGold += Math.min(goldAmt, AbstractDungeon.player.gold); isDone = true`,
# queued AHEAD of the DamageAction as stated below. Mugger$1/$2 (Mugger.java:95,
# :113) are byte-for-byte the same shape. See RECOVERED-INNER-CLASSES.md at the
