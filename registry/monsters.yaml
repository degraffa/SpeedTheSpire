  name: TASKMASTER
  game_id: "SlaverBoss"
  provenance: "Taskmaster (Taskmaster.java, 110 lines, read in full). ID is \"SlaverBoss\" (:33), NOT \"Taskmaster\" -- that is the string encounters.yaml id 36 (Slavers) and id 42 (Colosseum Nobs) already emit, and it is the oracle join key. type = ELITE (:51), including inside the Colosseum group. THE CTOR DRAWS monster_hp_rng TWICE and no other landed monster does: the super(...) argument list literally contains AbstractDungeon.monsterHpRng.random(54, 60) (:50), which Java evaluates BEFORE the constructor body, and then setHp(57,64) at ascension >= 8 else setHp(54,60) (:52-56) draws again (AbstractMonster.java:765-775). The first value is discarded by the second, but it MOVED THE STREAM -- and the Taskmaster sits at group index 1 of Slavers, so the Red Slaver's HP roll shifts. That is the rolls: entry below, with timing CONSTRUCTOR_BEFORE_HP. NOTE its range is the LITERAL (54,60) at EVERY ascension: the super-argument is not branched, only the setHp below it is. woundCount = 3 at >= 18, 2 at >= 3, else 1 (:57) -- the constant for the middle arm is named A_2_WOUNDS and the branch is >= 3. damage.get(0) = 4 (WHIP) is DEAD: getMove (:81-84) sets move 2 unconditionally and takeTurn has no other case, so the 4 is never queued and no move row carries it. damage.get(1) = 7 is SCOURING_WHIP. takeTurn case 2 (:66-79): playSfx -- MathUtils.random(1), UNSEEDED (:87) -- then AnimateSlowAttackAction, DamageAction(damage.get(1)), MakeTempCardInDiscardAction(new Wound(), woundCount), and ONLY at ascension >= 18 an ApplyPowerAction(this, this, StrengthPower(this, 1), 1) (:73-74). RollMoveAction (:78) sits outside the switch. getMove ignores num but the rollMove aiRng.random(99) still happens and is discarded (the Looter/Guardian/Chosen precedent). die (:104-108) is super.die() then playDeathSfx, whose MathUtils.random(1) (:96) is UNSEEDED -- so NO MonsterDieFn entry (explicit nullptr, monster_dispatch.cpp). No usePreBattleAction and no starting power."
  enemy_type: ELITE    # Taskmaster.java:51
  hp:
    base: {min: 54, max: 60}    # Taskmaster.java:55 (ascension < 8)
    a8:   {min: 57, max: 64}    # Taskmaster.java:53 (ascension >= 8)
  rolls:
    # The super(...) ARGUMENT draw (Taskmaster.java:50). Its VALUE is thrown
    # away by the setHp below it; its POSITION in the monster_hp_rng sequence is
    # the whole point, which is what timing CONSTRUCTOR_BEFORE_HP encodes
    # (burn_unspawned_ctor_rolls' two-pass walk, monster_dispatch.cpp). NO tier
    # columns: the argument is the flat literal random(54, 60) at every
    # ascension -- only the setHp under it moves.
    - name: SUPER_ARG_HP
      stream: MONSTER_HP
      timing: CONSTRUCTOR_BEFORE_HP
      range:
        base: {min: 54, max: 60}  # Taskmaster.java:50 -- literal, unbranched
  moves:
    - name: SCOURING_WHIP
      move_id: 2               # Taskmaster.java:47
      intent: ATTACK_DEBUFF    # setMove((byte)2, Intent.ATTACK_DEBUFF, 7) (:83)
      effects:
        # ORDER IS LOAD-BEARING (:71-74): damage, THEN the Wounds, THEN -- at
        # A18 only -- the self Strength. damage.get(1) == SCOURING_WHIP_DMG 7,
        # flat at every ascension (:59), so no tier column.
        - {op: DAMAGE, target: PLAYER, amount: 7}
        # MakeTempCardInDiscardAction(new Wound(), woundCount) -- ONE action with
        # a COUNT, so one MAKE_CARD step whose amount is the count (:72).
        # woundCount 1, 2 from A3, 3 from A18 (:57).
        - {op: MAKE_CARD, target: PLAYER, amount: {base: 1, a3: 2, a18: 3}, card: WOUND, pile: DISCARD}
        # THE A18 STRENGTH IS NOT A STEP. `if (ascensionLevel < 18) break;`
        # (:73) makes it an ascension PRESENCE branch, and an effect list
        # expresses per-tier AMOUNTS but not per-tier PRESENCE -- the Snecko TAIL
        # limitation (id 34), handled the same way: recorded, not worked around.
        # monster_taskmaster.cpp queues the ApplyPowerAction(self, Strength, 1)
        # natively after this program, spelling both sides of the branch (the
        # GremlinFat/Frail precedent). At the engine's fixed A20 it is always
        # present.
  ai: native   # getMove (:81-84) ignores `num` entirely and forces move 2 --
               # but the rollMove that produced `num` still drew aiRng.random(99)
               # and still moved the shared stream, and takeTurn's trailing
               # RollMoveAction (:78) means that draw recurs EVERY turn. A `fixed`
               # ai row would have to carry both the forced move and the discarded
               # per-turn draw; native is how the Looter, the Guardian and the
               # Chosen already say that. The A18 Strength presence branch above
               # is the second reason. See monster_taskmaster.cpp.

- id: 39
  name: BOOK_OF_STABBING
  game_id: "BookOfStabbing"
  provenance: "BookOfStabbing (BookOfStabbing.java, 158 lines, read in full). ID \"BookOfStabbing\" (:33); type = ELITE (:59). Solo encounter (MonsterHelper.java:504-506). ctor (:52-76): the super(...) HP argument is a LITERAL 164 -- no draw -- then setHp(168,172) at ascension >= 8 else setHp(160,164) (:62-66), ONE monster_hp_rng draw. stabDmg/bigStabDmg 7/24 at >= 3 else 6/21 (:67-73), added to damage in that order (:74-75). Move ids STAB=1, BIG_STAB=2 (:48-49). stabCount is a FIELD INITIALIZER 1 (:50) and is UNBOUNDED -- it lives in MonsterState.pad0 (the Wizard-charge / Louse-bite precedent) and saturates rather than wraps. usePreBattleAction (:78-81): ApplyPowerAction(this, this, new PainfulStabsPower(this)) -- SELF-applied; PainfulStabsPower assigns amount = -1 explicitly (PainfulStabsPower.java:29). takeTurn (:83-103): case STAB loops for (i < stabCount) queuing an SFXAction (whose MathUtils.random(0,3) is UNSEEDED) and a DamageAction(damage.get(0)) EACH (:89-92) -- THE LOOP COUNT IS READ AT takeTurn TIME, i.e. the value getMove already committed to the telegraph, so it is per-move state and not recomputed; case BIG_STAB is one DamageAction(damage.get(1)) (:98). RollMoveAction (:102) sits outside the switch. getMove (:129-150) MUTATES stabCount on three of its four paths, and at ascension >= 18 on ALL FOUR -- including the init rollMove, so the first STAB is already 2 hits. changeState/damage() are presentation. die (:152-156) is super.die() then an UNSEEDED CardCrawlGame.sound.play -- so NO MonsterDieFn entry (explicit nullptr, monster_dispatch.cpp)."
  enemy_type: ELITE    # BookOfStabbing.java:59
  hp:
    base: {min: 160, max: 164}  # BookOfStabbing.java:65 (ascension < 8)
    a8:   {min: 168, max: 172}  # BookOfStabbing.java:63 (ascension >= 8)
  rolls: []
  moves:
    - name: STAB
      move_id: 1               # BookOfStabbing.java:48
      intent: ATTACK           # setMove(1, ATTACK, dmg[0].base, stabCount, true)
      effects:
        # ONE AUTHORED TEMPLATE STEP, REPEATED stabCount TIMES NATIVELY. The
        # count is per-instance combat state (pad0), grows without bound and is
        # read at takeTurn time (:89) -- none of which an effect list can carry,
        # so this is the Healer's one-template/native-fan-out shape with a
        # counter instead of a group walk. Each repetition is a SEPARATE
        # DamageAction (:91), so block and per-hit powers apply per stab.
        # stabDmg 6, 7 from A3 (:67-73).
        - {op: DAMAGE, target: PLAYER, amount: {base: 6, a3: 7}}
    - name: BIG_STAB
      move_id: 2               # BookOfStabbing.java:49
      intent: ATTACK           # setMove(2, ATTACK, dmg[1].base) (:136,142)
      effects:
        # damage.get(1) == bigStabDmg: 21, 24 from A3 (:67-73). ONE hit.
        - {op: DAMAGE, target: PLAYER, amount: {base: 21, a3: 24}}
  ai: native   # getMove (:129-150) is the ONLY getMove in the roster that
               # MUTATES per-instance state as a side effect of deciding: three
               # of its four paths ++stabCount, and at ascension >= 18 the
               # fourth does too, so at the engine's fixed A20 EVERY decision --
               # including the init rollMove -- grows the next STAB by one hit.
               # No ai table has a write side. See monster_book_of_stabbing.cpp.

# --- S2.24 (Act-2 City BOSSES): Bronze Automaton (+ Bronze Orb), The Champ, ---
# --- The Collector (+ Torch Head). MonsterId 40-44 are this task's grant ------
# --- (stage-b-tasks.md "S2 Wave-3 allocations"); all five are spent, so the ---
# --- block leaves no gap. 45-48 stay UNISSUED, not this batch's to backfill. --
#
# The three bosses are enemy_type: BOSS (each ctor assigns this.type =
# EnemyType.BOSS -- BronzeAutomaton.java:75, Champ.java:96, TheCollector.java:88)
# and that column is LIVE data, not documentation: Pantograph's atBattleStart
# heal keys on `m.type == EnemyType.BOSS` over the GROUP (Pantograph.java:32-40,
# relic_native_pantograph), and MonsterDef::is_boss() is its registry read. The
# two minions assign no type and stay NORMAL (AbstractMonster.java:99's field
# initializer) -- a Bronze Orb in the group must NOT satisfy Pantograph, the
# boss record does.
#
# The three boss encounters ("Automaton" 38, "Collector" 39, "Champ" 40,
# TheCity.initializeBoss, TheCity.java:168-170) were all landed by S2.01 and are
# unchanged here: each is a single EMIT that resolves its game-id at spawn time,
# so registering the init fns un-parks all three (the S2.23 precedent). The two
# minions appear in NO encounter at all -- they are mid-combat spawns only
# (SpawnMonsterAction(m, true), BronzeAutomaton.java:116,122 /
# TheCollector.java:130,168), which is why both carry MonsterSpawnAtHpFn
# entries and their ctor draws burn at the SPAWNER'S queue time.

