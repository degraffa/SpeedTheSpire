.pad0. die (:177-190): presentation, super.die(), onBossVictoryLogic (not sim-visible), then the addToTop suicide sweep over every !isDead && !isDying record (:182-187) -- STRICTLY POST-super, so it registers in monster_die_after_fn (the Reptomancer shape); each SuicideAction(m) is the 1-arg ctor, relicTrigger TRUE, so a swept Bronze Orb's Stasis onDeath DOES fire and the stolen card comes back."
