        - {op: DAMAGE, target: PLAYER, amount: 1}
        - {op: DAMAGE, target: PLAYER, amount: 1}
        - {op: DAMAGE, target: PLAYER, amount: 1}
        - {op: DAMAGE, target: PLAYER, amount: 1}
        - {op: DAMAGE, target: PLAYER, amount: 1}
    - name: GO_AIRBORNE
