atch_at_end_of_round's monster pass). atEndOfRound (:53-60) is the exact PLAYER-owner mirror (`if (!isPlayer) return; amount = basePower;`); no S1/S2 effect grants Malleable to the player, so that arm is DEAD but bound and documented rather than silently dropped -- the conventions §8 'comment asserting X does not exist' rule cuts the other way here, since the arm is real Java and costs one branch. Checked against both count-guarded switch families: MalleablePower overrides NO atDamageGive/atDamageReceive/atDamageFinalReceive and NO modifyBlock/modifyBlockLast, so all four interp guards take only the count move and no case is added anywhere. Applied by TWO monsters, both 1-arg and so both amount 3: the Snake Plant's usePreBattleAction (SnakePlant.java:70-73) and -- from S2.26 -- the Writhing Mass's (WrithingMass.java:80-83), which applies Reactive FIRST and Malleable SECOND. The body needed ZERO change for the second granter; only this sentence did (conventions section 8: amend the stale claim in place). Note the second-granter caveat above is now half-live -- a Writhing Mass still receives exactly one Malleable, so the stacking branch stays unreachable."

