tion retry (PlayTopCardAction.java:38-43, one shuffle_rng draw), the both-piles-empty no-op (:34-37), limbo + NewQueueCardAction with the free autoplay energy snapshot (:44-58), the dequeue-time canUse revalidation, and the no-trigger UseCardAction filing an unplayable card takes. Applied by the Mayhem card with amount 1 (Mayhem.java:27,32)."

