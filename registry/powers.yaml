  provenance: "ReactivePower (ReactivePower.java, read in full). POWER_ID \"Compulsive\" (:19) -- the class name is ReactivePower but the ID literal, and therefore the oracle join key, is \"Compulsive\". The ctor (:24-31) assigns no type (AbstractPower default BUFF, :67), no amount, and PRIORITY 50 (:30) -- which must be in the priority column for the Flight reason: op_apply_power's sort_powers_like_the_game uses it, and slot order is the atDamage* walk order. stackPower is not overridden. onAttacked (:39-45) is its ONLY combat override: `if (info.owner != null && info.type != HP_LOSS && info.type != THORNS && damageAmount > 0 && damageAmount < this.owner.currentHealth) { flash(); addToBot(new RollMoveAction((AbstractMonster) this.owner)); } return damageAmount;`. THIS IS MALLEABLE'S GUARD SET VERBATIM with a RollMoveAction where the GainBlockAction was: the same non-null owner test (ctx.source_null), the same excluded types (already the dispatch_on_attacked gate), the same `damageAmount > 0` post-block test, and the same STRICT `<` health test -- so an exactly-lethal or overkill hit re-rolls NOTHING. The health read is PRE-HIT, which is where AbstractCreature.damage puts it too. NO NEW OPCODE: Opcode::ROLL_MOVE (8) exists and roll_monster_move dispatches through monster_roll_move_fn, so the whole framework cost is that the Writhing Mass registers a MonsterRollMoveFn. addToBOT, so the re-roll resolves after the rest of the player's card -- which means a THREE-HIT attack re-rolls the move THREE times, each an independent getMove with its own recursion, and that is the sharpest ai_rng consumer in Acts 1-3. Because the re-roll is a full rollMove with firstMove already spent, it can select MEGA_DEBUFF -- so a Writhing Mass can be made to grant its Parasite DURING THE PLAYER'S TURN, which is a directed test. NATIVE for Malleable's reasons: the guard set is a condition no data program expresses. Applied only by the Writhing Mass's usePreBattleAction (WrithingMass.java:80-83), 1-arg, and applied BEFORE Malleable there -- the order the hook fan-outs walk."
