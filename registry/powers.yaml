  provenance: "PanachePower (PanachePower.java:21-68), read in full. POWER_ID \"Panache\" (:23); the ctor (:30-38) sets NO type, so it is the AbstractPower default BUFF (AbstractPower.java:67). TWO NUMBERS that move independently, which is why this row is the first consumer of PowerSlot.counter: `amount` is HARD-CODED to CARD_AMT == 5 by the ctor (:27,34) regardless of the value the card passes, and `damage` (:28) is the ctor argument. stackPower (:46-50) is `this.damage += stackAmount` and DOES NOT TOUCH amount -- so a second Panache adds its 10 to a shared 20-damage payload behind ONE countdown whose partial progress SURVIVES the re-application (the opposite of the AbstractPower additive default). Slot mapping: amount = the 5..1 countdown (the oracle-visible number), counter = the accumulated damage. onUseCard (:52-61): `--this.amount; if (this.amount == 0) { flash(); this.amount = 5; addToBot(new DamageAllEnemiesAction(player, DamageInfo.createDamageMatrix(this.damage, true), DamageType.THORNS, SLASH_DIAGONAL)); }` -- isPureDamage TRUE builds the matrix without applyPowers (DamageInfo.java:126-136) and the THORNS type independently skips every NORMAL-only power hook, so Strength on the player and Vulnerable/Weak on the target leave the number alone (block still absorbs). atStartOfTurn (:63-67) is a FLAT `this.amount = 5`, so a turn boundary discards partial progress; the damage is untouched. NATIVE because none of the three -- a decrement-and-test countdown, a reset-and-fire branch, and damage sourced from the slot's SECOND number rather than its stack amount -- is expressible as a static step program. The ON_USE_CARD binding is the UseCardAction fan-out (UseCardAction.java:41-64), which is what makes the counting exact: the ctor runs for every successful play INCLUDING a Mayhem/Havoc autoplay, and NOT for the dontTriggerOnUseCard filing a FAILED autoplay takes (GameActionManager.java:285-301) -- resolve_card_play queues that filing without dispatching the fan-out. A Panache being played does not count itself: its own ApplyPowerAction is still queued when the fan-out for that play runs (AbstractPlayer.useCard:1369-1370). Applied by the Panache card with magicNumber 10, or 14 upgraded (Panache.java:27,32,39)."

- id: 84
  name: THE_BOMB
  game_id: "TheBomb"
  type: BUFF
  native: true
  instanced: true
  hooks:
    at_end_of_turn: []       # native: monsters-in-fight gate, then an instance-targeted ReducePowerAction and, at fuse 1, the detonation
  provenance: "TheBombPower (TheBombPower.java:20-54), read in full. POWER_ID is NOT a constant: the ctor builds `POWER_ID + bombIdOffset` and increments that static offset (:22,27,31-32), so AbstractCreature.getPower NEVER finds an existing bomb and ApplyPowerAction adds a brand-new AbstractPower on every play -- two bombs are two independent fuses, never a stack of 2. That is what `instanced: true` encodes (op_apply_power APPENDS instead of merging); the game_id above is the PREFIX, since the oracle reports the per-instance \"TheBomb0\", \"TheBomb1\", ... (the translator's join normalizes that suffix). The ctor (:29-38) sets no type -> the AbstractPower default BUFF (AbstractPower.java:67); `amount` = the ctor's `turns` (3, TheBomb.java:32) and the private `damage` = the ctor's third argument (40, or 50 upgraded -- TheBomb.java:27,44). Slot mapping: amount = the fuse in turns (the oracle-visible number), counter = the damage. atEndOfTurn(isPlayer) (:40-48): `if (!AbstractDungeon.getMonsters().areMonstersBasicallyDead()) { addToBot(new ReducePowerAction(this.owner, this.owner, this, 1)); if (this.amount == 1) addToBot(new DamageAllEnemiesAction(null, DamageInfo.createDamageMatrix(this.damage, true), DamageType.THORNS, FIRE)); }`. THREE things that pins. (1) The areMonstersBasicallyDead gate (MonsterGroup.java:90-95 -- every monster dying or escaped) is checked ONCE and covers BOTH queued actions, so with nobody left in the fight the fuse is FROZEN, not merely silent. (2) The explosion test reads `amount` AT HOOK TIME, before its own queued reduce resolves, so a bomb standing at 1 queues [reduce, damage] and the reduce -- 1 from 1 -- drives ReducePowerAction's else branch into RemoveSpecificPowerAction on THAT EXACT INSTANCE (ReducePowerAction.java:28-33,45-51): the bomb is gone in the same end-of-turn it detonates. Counting from the play turn that is 3 -> 2, 2 -> 1, then the hook sees 1: the end of the THIRD turn. (3) The player sweep it fires from is applyEndOfTurnTriggers, at the TOP of endTurn and BEFORE the hand discard (AbstractCreature.java:547-553 via AbstractRoom.java:393-396) -- where the engine's AT_END_OF_TURN dispatch already sits. The instance-exact reduce is why interp.hpp gained a REDUCE_POWER/REMOVE_POWER instance key: a slot INDEX cannot be the handle, because an earlier bomb's removal compacts the list before a later queued item resolves. isPureDamage TRUE (DamageInfo.java:126-136) plus the THORNS type means neither Strength nor Vulnerable/Weak moves the 40/50. Applied only by The Bomb card, stack amount 3 at both levels (TheBomb.java:32)."

