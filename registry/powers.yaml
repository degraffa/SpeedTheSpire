- id: 16
  name: THORNS
  game_id: "Thorns"
  type: BUFF
  native: true
  hooks:
    on_attacked: []             # native: reflect `amount` THORNS damage to the attacker
  provenance: "ThornsPower.onAttacked (ThornsPower.java:45-52) -- if info.type != THORNS && != HP_LOSS && info.owner != null && info.owner != owner: addToTop DamageAction(info.owner, DamageInfo(owner, amount, THORNS)); returns damageAmount unchanged. Fires in AbstractPlayer.damage (:1425-1426) AFTER decrementBlock and REGARDLESS of whether the attack was blocked (no damageAmount>0 gate). Native body queues a THORNS-typed DAMAGE (add_to_top) to ctx.source (the attacker); THORNS type (interp.hpp) skips the NORMAL-only power modifiers so a Vulnerable attacker does NOT amplify it (VulnerablePower.atDamageReceive NORMAL-only, :66-72). POWER_ID \"Thorns\" (:22), default type BUFF (AbstractPower.java:67)."

- id: 17
  name: PLATED_ARMOR
  game_id: "Plated Armor"
  type: BUFF
  native: true
  hooks:
    at_end_of_turn_pre_card: [] # native: gain `amount` block (GainBlockAction, direct -- no Dexterity)
    was_hp_lost: []             # native: addToBot ReducePowerAction(1) on a real attack (not THORNS/HP_LOSS/self)
    on_power_removed: []        # native: onRemove -> a MONSTER owner's ARMOR_BREAK (the Shelled Parasite's stun)
  provenance: "PlatedArmorPower (PlatedArmorPower.java, 74 lines, read in full). POWER_ID \"Plated Armor\" (:20) -- WITH the space. atEndOfTurnPreEndTurnCards (:70-73) -- GainBlockAction(owner, amount) at the §5.4 pre-card phase (the same slot as Metallicize); a DIRECT GainBlockAction, so the block takes no Dexterity (kBlockNoPowers). wasHPLost (:54-59) -- `if (info.owner != null && info.owner != owner && type != HP_LOSS && type != THORNS && damageAmount > 0) addToBot(new ReducePowerAction(owner, owner, POWER_ID, 1))`. THE REDUCTION IS QUEUED, and the native body queues a REDUCE_POWER item accordingly: it used to decrement the slot and zero power_id IN PLACE, which was wrong in timing and, worse, never reached the removal choke point (remove_slot_at, interp/interp_powers.cpp), so the onRemove below could not fire at all. onRemove (:65-70) -- `if (!this.owner.isPlayer) addToBot(new ChangeStateAction((AbstractMonster)owner, \"ARMOR_BREAK\"))`: reached through Hook::ON_POWER_REMOVED, gated on a NON-PLAYER owner (a player whose Thread-and-Needle armour runs out sees nothing). Its one consumer is ShelledParasite.changeState(\"ARMOR_BREAK\") (ShelledParasite.java:151-159), whose combat content is setMove(STUNNED, Intent.STUN) + createIntent -- the hop animations and waits around it are presentation. The Java sends the action to any non-player owner and relies on the monster's own changeState ignoring an unknown key, which the native body reproduces by testing the owner's monster id. stackPower (:36-44) is the additive default plus a 999 clamp that no reachable application approaches."

