# powers.yaml -- power registry (rules-as-data, design doc B §4.2).
#
# Entry shape (frozen):
#   - id: <int>            numeric enum value -- append-only, NEVER renumbered
#     name: <SYMBOL>       generated enum symbol (PowerId::<SYMBOL>)
#     game_id: "<string>"  the game's POWER_ID string -- translator/oracle join key
#     type: BUFF|DEBUFF    AbstractPower.PowerType (Artifact/Sadistic debuff-gating,
#                          the APPLY_POWER interception, read this field)
#     stack: intensity|none  how a re-applied power combines (default: intensity ==
#                          additive amount stacking, AbstractPower.stackPower's
#                          this.amount += stackAmount; `none` == non-stacking marker
#                          for a later bespoke consumer). Optional (default intensity).
#     native: true         (optional) the power's hook BODIES are hand-written C++
#                          rather than a data-bound effect program -- for the
#                          irreducibly bespoke powers (guards, counters,
#                          interception, redirects). This flag is not prose: the
#                          dispatch table is GENERATED from this file. Each
#                          `native: true` row emits one X(<NAME>, power_native_
#                          <name>) entry of the STS_REGISTRY_NATIVE_POWERS X-macro
#                          in the generated power_table.hpp
#                          (tools/registry_gen/stsgen/emit/powers.py,
#                          native_dispatch_macro). power_hooks.cpp expands that one
#                          list TWICE -- once for the extern declarations, once for
#                          the PowerId -> handler switch behind
#                          dispatch_native_hook -- so the table is a projection of
#                          the registry, never a hand-maintained switch, and a new
#                          power batch does not edit power_hooks.cpp at all.
#                          Handler names follow the frozen convention: the row name
#                          lowercased, e.g. COMBUST -> power_native_combust.
#                          LINK ERROR, NEVER A SILENT NO-OP: the handler is odr-used
#                          at the expansion site, so a row marked native whose body
#                          nobody wrote is an UNDEFINED REFERENCE at link time (the
#                          old hand-written switch answered `default: return nullptr`
#                          and quietly did nothing -- that failure mode is gone).
#                          The declarations use the shared handler signature, so a
#                          body whose signature drifts also fails to link.
#                          DELIBERATE-NO-OP CONVENTION: a power registered native on
#                          purpose with NO behaviour must define an EXPLICIT EMPTY
#                          handler in its batch translation unit
#                          (src/engine/powers/powers_b3_*.cpp), carrying the reason
#                          and the Java citation in the comment above it. That empty
#                          definition IS the record of the decision -- see
#                          power_native_artifact (powers_b3_2.cpp), whose whole
#                          effect lives at the APPLY_POWER site instead.
#     hooks:               (optional) hook -> effect program bindings (B3.2). Each
#                          key is a Hook name (power_hooks.hpp); the value is a list
#                          of {op, target, amount[, power]} steps queued (addToBot)
#                          in list order when the hook fires. `target: SELF` means
#                          the power's OWNER; ALL_ENEMY/RANDOM_ENEMY fan out over the
#                          owner's enemies at execute time (interp.hpp). AMOUNT
#                          CONVENTION: `amount: 0` (or omitted) means "use the
#                          power's current stack amount" (PowerSlot.amount -- the
#                          usual stack-scaled effect: block N, draw N, damage N);
#                          a NON-zero amount is a literal (e.g. Combust's fixed
#                          1-HP loss). A `native:`
#                          power still LISTS the hooks it responds to here, each
#                          with an EMPTY program, so the framework knows which hooks
#                          to route to the generated native dispatch. The generator
#                          enforces both directions and fails loud: a hook with
#                          steps AND `native: true` is an error, and a hook with an
#                          empty program on a row that is NOT native is an error.
#     provenance: "<Class.method (File.java:line) -- read in full>"
#
# The framework (B3.2) dispatches these hooks through the pump in the frozen
# stage-a §5.2/§5.3/§5.4/§5.5 order (power_hooks.cpp). The three skeleton powers
# (Strength/Vulnerable/Weak) carry NO hook bindings: their behaviour is the DAMAGE-
# pipeline atDamageGive/atDamageReceive hooks, which stay native in interp.cpp
# (the damage pipeline is not routed through this data table -- it is float-exact
# and hot, stage-a §5.5). This domain also generates the PowerId enum + game_id
# table (unchanged).
#
# Ids pinned STRENGTH=1..WEAK=3 (skeleton, stage-a §9); the B3.2 framework powers
# are appended from 4 (append-only, design doc B §4.4) -- the hook plumbing the
# ~30 card-applied powers (scoping report §4) attach to. Each carries the (hook,
# program) or native binding the five §5.3-5.5 stress cases exercise; the cards
# that CREATE these powers, and the remaining powers, land with their batches
# (B3.3+).

