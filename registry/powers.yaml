  hooks:
    at_end_of_turn: []      # native: heal `amount` -- monster owner, never decrements
  provenance: "RegenerateMonsterPower (RegenerateMonsterPower.java, 44 lines, read in full). POWER_ID \"Regenerate\" (:17) -- DISTINCT from the player's REGEN power (id 18 above), whose POWER_ID is \"Regeneration\" (RegenPower.java:17); two different Java classes, two different oracle join keys, despite the near-identical English name. The ctor (:22-30) takes (owner, regenAmt), sets type = BUFF (:29) and overrides neither priority (AbstractPower default 5, AbstractPower.java:66) nor stackPower (additive default) -- hence no `stack:` or `priority:` column. atEndOfTurn(isPlayer) (:37-43): `this.flash(); if (!(this.owner.halfDead || this.owner.isDying || this.owner.isDead)) this.addToBot(new HealAction(this.owner, this.owner, this.amount));` -- three liveness flags read off the owner, which is always a monster (nothing in the decompiled tree ever constructs this power on a player). `halfDead` has no S1 producer (no monster body sets it on this tree); `isDying`/`isDead` are exactly monster_dead_or_escaped's domain, and the AT_END_OF_TURN dispatch walk (power_hooks.cpp) already skips a dead-or-escaped monster before dispatching ANY of its powers' hooks -- that walk IS the isDying/isDead guard, so the native body re-tests neither. NATIVE because a data program's `{op: HEAL}` no-ops for a monster target by design (op_heal, interp_damage.cpp) -- this power is the one hook-level exception to that no-op, resolved through a direct write rather than the HEAL opcode, exactly as the player's REGEN (id 18) already does. Body is power_regen.cpp's clamp-to-max direct write (RegenAction.java:34-39: heal only if currentHealth>0, clamp to maxHealth) MINUS its player-only decrement tail -- RegenAction.java:40-47's `if (this.target.isPlayer) { --p.amount; ... }` decrement is isPlayer-gated, and that gate is the WHOLE distinction between the two powers: this power's own action is a bare HealAction (HealAction.java, no decrement anywhere in its update()), not a RegenAction, so it never decays on its own; only the monster's own removal (death) ever ends it. DOCUMENTED DEVIATION: the Java addToBot's one HealAction per member, which resolves from the action queue AFTER the AT_END_OF_TURN walk has visited every monster; the native body instead writes each monster's heal synchronously, in-walk. Equivalent unless some other queued S1 effect would need to interleave between one monster's heal and the next's, which nothing in S1 does. Applied only by MonsterRoomElite's emerald-elite entry roll, arm 3: `new RegenerateMonsterPower(m, 1 + AbstractDungeon.actNum * 2)` to every group member (MonsterRoomElite.java:60-64) -- amount 3 at Act 1."

