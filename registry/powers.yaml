servable (the owner is mid-death and the slot goes with it), and the engine queues it anyway rather than returning behind an unreachability claim. NATIVE because the two arms are a CONDITION on the slot's own amount, which a data hook program cannot express (the Rage / Hex precedent). Applied only by the Transient's usePreBattleAction (Transient.java:63-71, the two ctor calls at :66 and :68), amount 5, or 6 at A17."

