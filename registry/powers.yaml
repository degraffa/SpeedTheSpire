  provenance: "ShiftingPower (ShiftingPower.java, 48 lines, read in full). POWER_ID \"Shifting\" (:17) -- the oracle join key. The ctor (:22-29) takes only the owner: NO amount is ever assigned, so the slot carries AbstractPower's field-initializer -1 (AbstractPower.java:65) exactly as Confusion's does, and no type (default BUFF, :67) and no priority (default 5, :66). `isPostActionPower = true` (:27) is an AbstractPower UPDATE-ORDER field with no combat semantics in this engine -- recorded here rather than silently dropped. onAttacked (:32-41) is its ONLY combat override and it is NOT a damage-reduction power: `if (damageAmount > 0) { addToTop(ApplyPowerAction(owner, owner, StrengthPower(owner, -damageAmount), -damageAmount)); if (!owner.hasPower(\"Artifact\")) addToTop(ApplyPowerAction(owner, owner, GainStrengthPower(owner, damageAmount), damageAmount)); flash(); } return damageAmount;` -- the return is UNMODIFIED, so no atDamage* pass and no case in any of the count-guarded switches in interp_damage.cpp / interp_block.cpp. FOUR THINGS. (1) BOTH applications are addToTOP and the -Strength is pushed FIRST, so the EXECUTED order is Shackled (id 78, GainStrengthPower) and THEN the -Strength: within a multi-hit attack the whole swing lands between hits. (2) `damageAmount > 0` only -- a fully-blocked hit does nothing. (3) The Artifact guard is bound even though a Transient never gets Artifact in Acts 1-3 (the Malleable dead-arm precedent). (4) THE GUARD SET IS THE INTERESTING PART: unlike Malleable, Angry, Flight, Thorns and Reactive, this body has NO `info.owner != null` test and NO damage-type test at all, and the Java's onAttacked walk is unconditional over every DamageType (AbstractMonster.java:665-667). So THORNS and HP_LOSS DO trigger Shifting in the game -- a Flame Barrier or Thorns reflect onto a Transient really does swing its Strength -- while dispatch_on_attacked fires only for NORMAL, src != tgt damage. That gate was correct for every previous binder (each has its own explicit type guard) and is WRONG for this one, so the engine adds a second, narrow walk -- dispatch_on_attacked_type_tolerant (power_hooks.hpp) -- fired from the non-NORMAL and self-source damage paths and restricted to the powers that declare no type guard, which today is exactly this one. The divergence and its fix are pinned by named tests. Applied only by the Transient's usePreBattleAction (Transient.java:70), 1-arg."

