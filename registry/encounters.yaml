# =============================================================================
# ACT 3 -- TheBeyond (S2.01, ids 44-61).
#
# Provenance base (read in full): TheBeyond.generateMonsters/generateWeak-
# Enemies/generateStrongEnemies/generateElites/generateExclusions/initializeBoss
# (TheBeyond.java:84-176); MonsterHelper.getEncounter (MonsterHelper.java:
# 532-594) and the helpers spawnShapes (664-692) / getAncientShape (636-646).
#
# TRAP (s2-design section 5 item 8): "3 Darklings" is in BOTH pools -- two rows,
# one game_id (ids 44 weak / 53 strong). encounter_by_game_id returns the FIRST
# match (id order), and both rows carry the identical composition program, so
# key -> composition lookup stays unambiguous; only pool membership differs, and
# the per-act pool tables carry that. Its weak-row exclusion names its own key.
#
# Monster refs are AbstractMonster.ID strings: three differ from the class name
# -- SpireGrowth.ID == "Serpent", SnakeDagger.ID == "Dagger", OrbWalker.ID ==
# "Orb Walker" (which is also an encounter key; different domains, no clash).
# =============================================================================

# --- WEAK pool -- generateWeakEnemies (TheBeyond.java:91-99), all weight 2.0 --
- id: 44
  name: THREE_DARKLINGS_WEAK
  game_id: "3 Darklings"
  act: 3
  pool: WEAK
  weight: 2.0
  # Self-exclusion that really bites: the same key is in the strong pool (id 53)
  # (TheBeyond.java:131-134).
  excludes: ["3 Darklings"]
  program:
    - {emit: "Darkling"}
    - {emit: "Darkling"}
    - {emit: "Darkling"}
  provenance: "TheBeyond.generateWeakEnemies (TheBeyond.java:94), generateExclusions \"3 Darklings\" (TheBeyond.java:131-134); MonsterHelper.getEncounter \"3 Darklings\" (MonsterHelper.java:543-545)"

- id: 45
  name: ORB_WALKER_ENC
  game_id: "Orb Walker"
  act: 3
  pool: WEAK
  weight: 2.0
  # INERT self-exclusion: generateExclusions adds "Orb Walker", which is not a
  # strong-pool key, so the first-strong rejection loop can never match it
  # (TheBeyond.java:135-138). Modeled verbatim rather than dropped -- dropping it
  # would silently hide a future upstream change.
  excludes: ["Orb Walker"]
  program:
    - {emit: "Orb Walker"}
  provenance: "TheBeyond.generateWeakEnemies (TheBeyond.java:95), generateExclusions \"Orb Walker\" (TheBeyond.java:135-138); MonsterHelper.getEncounter \"Orb Walker\" (MonsterHelper.java:555-557); OrbWalker.ID == \"Orb Walker\" (OrbWalker.java)"

