# Exordium.initializeShrineList (Exordium.java:238-246).
#
# ALL THREE ACTS ADD THE SAME SIX KEYS, so every row here is acts [1, 2, 3].
# What is per act is the REBUILD, not the membership: a shrine drawn in Act 1 is
# removed from that act's shrineList (:1938) and comes back when the next act's
# initializeShrineList runs.
#
# S2.02 TRAP -- THE THREE LISTS ARE NOT IN THE SAME ORDER. Read in full:
#   Exordium.java:238-246   Match and Keep!, Golden Shrine, Transmorgrifier,
#                           Purifier, Upgrade Shrine, Wheel of Change
#   TheCity.java:211-217    Match and Keep!, Wheel of Change, Golden Shrine,
#   TheBeyond.java:199-205  Transmorgrifier, Purifier, Upgrade Shrine
# City and Beyond are identical to each other and BOTH move Wheel of Change from
# position 5 to position 1, shifting Golden Shrine/Transmorgrifier/Purifier/
# Upgrade Shrine down by one. Order is load-bearing twice over: getShrine seeds
# `tmp.addAll(shrineList)` in list order (:1884) and then indexes it with
# `rng.random(tmp.size() - 1)` (:1937), so the SAME draw lands on a DIFFERENT
# shrine in Act 2 than in Act 1; and RunState's shrine membership bitset maps
# bit i to position i of the act's list (event_framework.hpp:198-199), a
# mapping that is currently Exordium's and is NOT valid for Acts 2-3.
#
# The registry `id` order below is Exordium's and stays Exordium's -- ids are
# append-only identity and must never be renumbered to chase a runtime order.
# The per-act positions are recorded per row and pinned, both orders spelled
# out, in tests/act_event_lists_test.cpp. Re-deriving the Act-2/3 bit<->position
# mapping is S2.13's; this file's job is to make sure it cannot be assumed.
#
# Every shrine is drawn UNCONDITIONALLY: getShrine seeds its filtered list with
# `tmp.addAll(shrineList)` (AbstractDungeon.java:1884) and only the
# specialOneTimeEventList block below it carries per-key gates. So each row's
# `draw` is ALWAYS and the only conditionality is the per-option greying-out
# each body applies.
