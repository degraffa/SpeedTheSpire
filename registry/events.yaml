# TheCity.initializeEventList (TheCity.java:185-198) -- the Act-2 eventList,
# 13 keys, in add() order. S2.02 landed these as IDENTITY + draw-gate metadata
# only; the per-act list rebuild that makes them drawable is S2.13's. S2.31
# then landed the EIGHT non-combat bodies (Addict, Back to Basics, Beggar,
# Cursed Tome, Drug Dealer, Forgotten Altar, Ghosts, Nest) with their audited
# `options`/`a15` blocks; Colosseum, Masked Bandits, The Library, The
# Mausoleum and Vampires remain identity-only and are S2.32's.
#
# THE ACT-2 LIST SHARES NO KEY WITH ACT 1 OR ACT 3 -- every row here is
# acts: [2]. getEvent's per-key switch (AbstractDungeon.java:1950-1979) gates
# only three of the twenty new keys; the other seventeen fall through to the
# unconditional `tmp.add(e)` at :1981 and are ALWAYS.
#
# Payout manifests are deliberately NOT encoded here. They belong to the body
# tasks, which read each option tree and its A15 branch in full (the B4.11-B4.13
# pattern); what this file records is the per-row payout CITATION, so the body
# task starts from a named line range rather than a search.
- id: 32
  name: ADDICT
  game_id: "Addict"
  provenance: "TheCity.initializeEventList (TheCity.java:185-198) position 0; Addict.ID (events/city/Addict.java:19) is \"Addict\"; no getEvent gate (AbstractDungeon.java:1944-1990 read in full); payouts Addict.java:40-62 (85g for a returnRandomRelicTier relic, or steal -> relic + Shame). Body Addict.java:27-78 read in full (S2.31): the ctor's TWO setDialogOption calls for option 0 differ only in TEXT -- both pass `isDisabled = gold < 85` (:30, :32) -- so there is one option that is greyed out under 85 gold, not two options. Option 0 rolls the relic FIRST and calls loseGold(85) SECOND (:46-49)."
  native: true
  implemented: true
  conditions: {pool: EVENT, acts: [2], draw: ALWAYS}
  options:
    - [BUY_SCREENLESS_RELIC_FOR_85_GOLD, STEAL_RELIC_AND_GAIN_SHAME, LEAVE]
    - [PROCEED]
  a15: {changes: []}
