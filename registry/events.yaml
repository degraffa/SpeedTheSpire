# events.yaml -- event registry (rules-as-data, design doc B §4.2).
#
# Entry shape (frozen):
#   - id: <int>            numeric enum value -- append-only, NEVER renumbered
#     name: <SYMBOL>       generated enum symbol (EventId::<SYMBOL>)
#     game_id: "<string>"  the game's event id string -- translator/oracle join key
#     provenance: "<Class.method (File.java:line) -- read in full>"
#     native: <bool>       OPTIONAL; event logic is native code with registry
#                          metadata (design doc B §4.1: dialog trees are irreducibly
#                          bespoke). Default true in practice for events.
#     implemented: <bool>  OPTIONAL; true only once the native body is linked.
#                          Such rows must also carry audited `options` and
#                          `a15` metadata. The generated native dispatch macro
#                          makes a missing body a link error.
#     conditions:          MANDATORY on every row (S2.02):
#       pool: EVENT|SHRINE|SPECIAL   which canonical draw list holds the key
#       acts: [<int>, ...]           the acts the row can be DRAWN in, ascending
#       draw: <string>               the rest of the gate; ALWAYS when the act
#                                    test is the whole gate
#
# Event ids are ordered by the canonical dungeon lists. The ids are identity
# only: B4.10 owns Act-1 list membership and selection; B4.11-B4.13 own the
# Act-1 native bodies; S2.13 owns the per-act list rebuild and S2.31-S2.33 the
# Act-2/3 bodies. Keeping every block in Java insertion order makes the
# generated enum and translator join auditable against the pool bit positions.
#
# WHAT `acts` MEANS PER POOL (S2.02; the generator pins the vocabulary, and
# emits it as EventDef.act_mask -- tools/registry_gen/stsgen/emit/events.py):
#   * EVENT   -- each act builds its OWN eventList (Exordium.java:223-236,
#                TheCity.java:185-198, TheBeyond.java:179-186), so `acts` is
#                literal list membership. No key appears in two acts' lists.
#   * SHRINE  -- each act adds the SAME six keys (Exordium.java:238-246,
#                TheCity.java:211-217, TheBeyond.java:199-205), so every shrine
#                row is [1, 2, 3]. The rebuild is per act; the membership is not.
#   * SPECIAL -- specialOneTimeEventList is built ONCE, in Exordium, and carried
#                by reference across acts (CardCrawlGame.java:1102-1119; only
#                call site Exordium.java:54). Membership is act-INDEPENDENT, so
#                `acts` records the ACT HALF of the row's getShrine gate
#                (AbstractDungeon.java:1886-1936) -- and a row drawn in Act 1 is
#                gone from the list for Acts 2-3, which is exactly why the act
#                gate and the membership have to be recorded separately.
# `draw` is the residual, non-act gate, in prose: it is provenance for the
# engine consumer, never parsed. Every gate string below was read off
# AbstractDungeon.getShrine (:1882-1942) / getEvent (:1944-1990) in full.

