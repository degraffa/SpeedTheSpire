# TheCity.initializeEventList (TheCity.java:185-198) -- the Act-2 eventList,
# 13 keys, in add() order. S2.02 lands these as IDENTITY + draw-gate metadata
# only: no `implemented`, no `options`/`a15`. The bodies are S2.31 (the eight
# non-combat rows) and S2.32 (the rest); the per-act list rebuild that makes
# them drawable is S2.13's.
#
# THE ACT-2 LIST SHARES NO KEY WITH ACT 1 OR ACT 3 -- every row here is
# acts: [2]. getEvent's per-key switch (AbstractDungeon.java:1950-1979) gates
# only three of the twenty new keys; the other seventeen fall through to the
# unconditional `tmp.add(e)` at :1981 and are ALWAYS.
#
# Payout manifests are deliberately NOT encoded here. They belong to the body
# tasks, which read each option tree and its A15 branch in full (the B4.11-B4.13
# pattern); what this file records is the per-row payout CITATION, so the body
# task starts from a named line range rather than a search.
