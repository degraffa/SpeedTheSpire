# events.yaml -- event registry (rules-as-data, design doc B §4.2).
#
# Entry shape (frozen):
#   - id: <int>            numeric enum value -- append-only, NEVER renumbered
#     name: <SYMBOL>       generated enum symbol (EventId::<SYMBOL>)
#     game_id: "<string>"  the game's event id string -- translator/oracle join key
#     provenance: "<Class.method (File.java:line) -- read in full>"
#     native: <bool>       OPTIONAL; event logic is native code with registry
#                          metadata (design doc B §4.1: dialog trees are irreducibly
#                          bespoke). Default true in practice for events.
#     implemented: <bool>  OPTIONAL; true only once the native body is linked.
#                          Such rows must also carry audited `conditions`,
#                          `options`, and `a15` metadata. The generated native
#                          dispatch macro makes a missing body a link error.
#
# Event ids are ordered by the three canonical dungeon lists. The ids are
# identity only: B4.10 owns list membership and selection; B4.11-B4.13 own the
# native bodies. Keeping all three blocks in Java insertion order makes the
# generated enum and translator join auditable against the pool bit positions.

