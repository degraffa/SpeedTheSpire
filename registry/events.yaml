# AbstractDungeon.initializeSpecialOneTimeEventList
# (AbstractDungeon.java:1340-1358).
#
# The `position N` annotations in this block are the indices of the
# NFY-PRESENT configuration (list length 14). isNoteForYourselfAvailable
# (:1360-1378) guards the `specialOneTimeEventList.add("NoteForYourself")`
# call ITSELF (:1351-1353) -- there is NO placeholder slot. When it returns
# false the list is length 13 and every entry after it shifts down by one, so
# SecretPortal sits at runtime index 9, not 10. The registry `id` is identity
# only and never moves; only the runtime index does.
#
# Class files live under com/megacrit/cardcrawl/events/. This block is NOT
# uniformly `shrines/`: KnowingSkull and TheJoust are `city/` and SecretPortal
# is `beyond/` (EventHelper.java:18 imports it from there). Those three rows
# carry a package-qualified path; the remaining eleven are `shrines/`.
#
# B4.13 ACT-1 REACHABILITY. getShrine's per-key switch (AbstractDungeon.java:
# 1886-1936) decides which of these ever enters an Exordium draw list. Eight
# reach Act 1 and are implemented (ids 18, 19, 22, 23, 25, 27, 30, 31); six
# cannot and stay unimplemented, each with its gate:
#   20 Designer      TheCity/TheBeyond AND gold >= 75      (:1894-1898)
#   21 Duplicator    TheCity/TheBeyond                     (:1899-1903)
#   24 Knowing Skull TheCity AND currentHealth > 12        (:1909-1913)
#   26 N'loth        TheCity AND relics.size() >= 2        (:1914-1918)
#   28 SecretPortal  playtime >= 800s AND TheBeyond        (:1929-1933)
#   29 The Joust     TheCity AND gold >= 50                (:1919-1923)
# Note that the two act gates the B4.13 brief listed as candidates are wrong in
# both directions: Duplicator is act-2/3 only, N'loth is act-2 only (its
# `!id.equals("TheCity") && !id.equals("TheCity")` is a decompiler duplication
# of one test, not a two-act disjunction), while FaceTrader -- which the brief
# did not name -- IS Act-1 reachable because its gate is TheCity **or**
# Exordium (:1904-1908).
#
# S2.02 SPLITS THAT GATE IN TWO. Each row's `conditions.acts` now holds the ACT
# half, read off the same switch, and `conditions.draw` the residual state test:
#   acts [1, 2, 3]  18 Accursed Blacksmith, 19 Bonfire Elementals,
#                   23 Fountain of Cleansing, 25 Lab, 27 NoteForYourself,
#                   30 WeMeetAgain, 31 The Woman in Blue -- no id.equals test
#   acts [1, 2]     22 FaceTrader                       (:1904-1908)
#   acts [2]        24 Knowing Skull, 26 N'loth, 29 The Joust
#   acts [2, 3]     20 Designer, 21 Duplicator
#   acts [3]        28 SecretPortal
# The six previously-bare rows gain conditions here for the first time; that is
# metadata only -- `implemented` stays false and the bodies remain S2.32/S2.33's
# (SecretPortal is pinned unreachable by s2-design §5 trap 5, and its `acts: [3]`
# is the ACT half of the gate, not a claim that it fires).
#
# LIST MEMBERSHIP IS NOT PER ACT HERE. initializeSpecialOneTimeEventList runs
# once, from Exordium.java:54, and CardCrawlGame.java:1102-1119 carries the same
# ArrayList into TheCity and TheBeyond -- so an entry drawn (and removed at
# :1939) in Act 1 is gone for the rest of the run, and an Act-2-gated entry that
# was never drawn is still there in Act 3 unless its own gate says otherwise.
# `acts` is a per-draw eligibility test, never a membership rebuild.
