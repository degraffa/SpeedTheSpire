# =============================================================================
# ACT 4 -- TheEnding (S3.41). ONE ROW, AND IT BELONGS TO NO DRAW LIST.
#
# TheEnding.initializeEventList (TheEnding.java:198-199) and
# initializeShrineList (:211-212) are EMPTY BODIES; dungeonTransitionSetup has
# already cleared both lists (AbstractDungeon.java:2576-2577) and the Act-4 map
# has no `?` room at all (s3-design section 4.4), so getEvent / getShrine are
# unreachable in Act 4 and specialOneTimeEventList -- carried by reference across
# the crossing -- is simply never drawn from again. Act 4 therefore adds no
# drawable event.
#
# `Spire Heart` still needs a row, and the row is METADATA, NOT A POOL ENTRY.
# The event is CONSTRUCTED BY ITS ROOM -- VictoryRoom.onPlayerEntry does
# `this.event = new SpireHeart()` (VictoryRoom.java:26-34) -- and appears in no
# eventList, no shrineList and no specialOneTimeEventList. It is the Neow shape.
#
# THE NEW PROPERTY, and why it is spelled this way. `conditions.pool: NONE` with
# `conditions.acts: NONE` is the explicit declaration "this key is in no act's
# draw list". The emitter (tools/registry_gen/stsgen/emit/events.py) pairs the
# two: pool NONE demands the literal `acts: NONE` and every other pool demands
# the ascending act LIST, so neither spelling can drift into the other and a
# typo is a generation error rather than a silently empty mask. The emitted
# act_mask is 0, so `event_in_act` is false for every act and the row is absent
# from every membership bitset -- which is what keeps RunState::event_membership
# / shrine_membership and the PublicView's event_flags / event_flags_hi
# byte-comparable across the Act-3 -> Act-4 crossing (s3-design section 7). A
# pool EventId would have been actively wrong: those bitsets index by POSITION IN
# AN ACT'S CANONICAL INIT LIST and this event has no position to occupy.
#
# WHAT DISPATCHES THE BODY. Not this row. The dialog is reached through
# event_dialog_impl's explicit `kSpireHeartEventId` (0xFFFE) check
# (event_framework.hpp / event_framework.cpp) -- a reserved non-pool id on the
# kSyntheticEventId model, landed by S3.31 -- because generate_event can no more
# return this key than it can return Neow. A pool-NONE row is therefore excluded
# from the generated STS_REGISTRY_NATIVE_EVENTS dispatch macro; the link-error
# guard that macro exists for is not weakened, because event_dialog_impl
# odr-uses event_spire_heart() unconditionally at that check.
#
# WHAT THE ROW IS FOR, all three already-observed facts: the translator ABORTS on
# the id today (translate.cpp's unknown-content-id path; one S2 CI-corpus entry
# carries no trace for exactly that reason), the replay differ SKIPS its records
# as a named post-victory exception (tools/oracle_bridge/replay/src/main.cpp),
# and the game_id join is what lets both stop special-casing the string.
#
# UNVERIFIED-until-captured, witness S3.62: the Heart-fight capture crosses this
# dialog on its way to Act 4, so the same capture that witnesses encounters.yaml
# 63 witnesses this row.
# =============================================================================
