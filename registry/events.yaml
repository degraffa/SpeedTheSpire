  provenance: "SpireHeart (events/beyond/SpireHeart.java:43-208, read in full). ID \"Spire Heart\" (:46) -- the oracle join key, WITH the space, and NOT the class name. MEMBER OF NO DRAW LIST: grep across the tree finds no eventList / shrineList / specialOneTimeEventList add of this key, and its ONE construction site is VictoryRoom.onPlayerEntry (VictoryRoom.java:26-34), reached from ProceedButton.goToVictoryRoomOrTheDoor (:199-208). THE CONSTRUCTOR CHANGES NO RUN STATE (:64-92 is publisher stats, the win-streak counter, a leaderboard upload and GameOverScreen.calcScore -- score bookkeeping s3-design section 8 deliberately leaves out), draws no RNG and touches no HP/gold/deck/pool. FIVE SCREENS, FOUR PRESSES: the ctor adds exactly ONE dialog option (:70-72) and every buttonEffect arm calls updateDialogOption(0, ...), rewriting the LABEL and never the count or the enabled-ness (:118-188). CUR_SCREEN ordinals INTRO 0 / MIDDLE 1 / MIDDLE_2 2 / DEATH 3 / GO_TO_ENDING 4 were recovered mechanically from the shipped jar's SpireHeart$1 switch-map class rather than inferred -- the derivation is recorded at src/engine/events/spire_heart.cpp. The MIDDLE_2 arm carries the run's whole branch: `Settings.isFinalActAvailable && Settings.hasRubyKey && Settings.hasEmeraldKey && Settings.hasSapphireKey` (:151) -- all four conjuncts, in that order -- goes to GO_TO_ENDING, whose press calls goToFinalAct (:94-98, the DoorUnlockScreen); otherwise DEATH (:170-177), whose press sets isDying/isDead and opens a DeathScreen, ending the run as a VICTORY that is not a trueVictor (Metrics.java:82 vs :107). NO ASCENSION BRANCH ANYWHERE IN THE CLASS, hence a15.changes: []. The BODY is native and landed at S3.31 (src/engine/events/spire_heart.cpp), dispatched by the reserved id kSpireHeartEventId 0xFFFE and not by this row -- see the block comment above. TheEnding adds no other event: initializeEventList (TheEnding.java:198-199) and initializeShrineList (:211-212) are empty bodies. UNVERIFIED-until-captured -- S3.62 owes the capture, which is the same Heart-fight capture that witnesses encounters.yaml 63."
