  name: MATCH_AND_KEEP
  game_id: "Match and Keep!"
  provenance: "Exordium.initializeShrineList (Exordium.java:238-246) position 0; GremlinMatchGame.ID (GremlinMatchGame.java:36) is \"Match and Keep!\"; body GremlinMatchGame.java:55-92, 179-285. Act-2/3 position 0 (TheCity.java:212, TheBeyond.java:200)."
  native: true
  implemented: true
  conditions: {pool: SHRINE, acts: [1, 2, 3], draw: ALWAYS}
  options:
    - [ACKNOWLEDGE]
    - [BEGIN_PLAY]
    - [FLIP_ONE_OF_TWELVE_BOARD_CARDS]
    - [PROCEED]
  a15:
    changes:
      - {field: FOURTH_DEALT_IDENTITY, base: COLORLESS_UNCOMMON, a15: RANDOM_CURSE}
