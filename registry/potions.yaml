- id: 27
  name: LIQUID_MEMORIES
  game_id: "LiquidMemories"
  rarity: UNCOMMON
  potency: 1
  # Return `potency` chosen cards from the DISCARD pile to hand, at cost 0 FOR
  # THE TURN. IMPLEMENTED (native, potions.cpp) on the new
  # ChoiceKind::DISCARD_TO_HAND_FREE (11) -- the one genuinely new choice kind
  # this potion needed, because the packed CHOOSE_CARD encoding has no
  # destination field: the KIND is the destination, and nothing else in the enum
  # moves a discard card into the hand.
  # potency IS the MANDATORY pick count (BetterDiscardPileToHandAction's
  # numberOfCards), so Sacred Bark (1 -> 2) makes the screen require exactly two
  # picks. NO RoomPhase guard on this potion at all, unlike Elixir/Snecko Oil.
  # Spends NO rng on any path.
  # Two of the action's branches fall out of the existing machinery rather than
  # being written: an empty discard is a silent no-op (zero eligible), and
  # `discardPile.size() <= numberOfCards` is the FORCED, screen-less move of the
  # whole discard pile in discard order, which is op_choose_card's eligible <=
  # amount arm. The per-card body's `hand.size() < 10` guard wraps the REMOVAL
  # too, so a card that does not fit stays in the discard pile -- there is no
