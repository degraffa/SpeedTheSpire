- id: 30
  name: SNECKO_OIL
  game_id: "SneckoOil"
  rarity: RARE
  potency: 5
  # UN-DEFERRED (wave-C potions stage): a two-step DATA program on the new
  # RANDOMIZE_HAND_COST opcode (60). SneckoOil.use (SneckoOil.java:41-46) is
  # exactly two addToBots -- DrawCardAction(player, potency) then
  # RandomizeHandCostAction() -- so the draw resolves FIRST and the randomize
  # sees the POST-draw hand: it re-costs the WHOLE hand, including the five cards
  # just drawn, not only the drawn ones. (This row used to say "randomize THEIR
  # costs"; that was the wrong reading of the second addToBot.)
  # RandomizeHandCostAction.update (:26-38) rolls one cardRandomRng.random(3)
  # (0..3 INCLUSIVE) per hand card whose BASE cost is non-negative, in hand
  # order, writing `costForTurn = cost = newCost` -- PERMANENT for the instance,
  # not this-turn. A card that rolls its own current cost still spends the draw;
  # an X-cost or unplayable card spends none.
  # The RoomPhase.COMBAT guard at :42 is the run layer's, exactly as for Blessing
  # of the Forge: a potion USE is offered only in RunPhase::COMBAT
  # (combat_potion_legal) or through the two-potion out-of-combat whitelist,
  # which this is not on.
  effects:
    - {op: DRAW, target: SELF, amount: 5}
    - {op: RANDOMIZE_HAND_COST, target: SELF}
  provenance: "SneckoOil.use (SneckoOil.java:41-46), getPotency (:49-51) -- addToBot DrawCardAction(player, potency) then addToBot RandomizeHandCostAction; RandomizeHandCostAction.update (RandomizeHandCostAction.java:26-38) rolls one cardRandomRng.random(3) per hand card with cost >= 0"

