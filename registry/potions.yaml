- id: 13
  name: ATTACK_POTION
  game_id: "AttackPotion"
  rarity: COMMON
  potency: 1
  # IMPLEMENTED (native, potions.cpp). The four "discover" potions are ONE body
  # with one argument changed -- each use() is a single addToBot of a
  # DiscoveryAction differing only in which pool it draws from:
  #   Attack/Skill/Power -> DiscoveryAction(CardType.X, potency)  (the
  #     type-filtered RED combat pool, returnTrulyRandomCardInCombat(type),
  #     AbstractDungeon.java:964-979)
  #   Colorless          -> DiscoveryAction(true, potency)        (the colorless
  #     pool, returnTrulyRandomColorlessCardInCombat, :981-995)
  # They ride the already-live DISCOVERY opcode (50), which the potions stage
  # extended with a POOL SELECTOR and a COPY COUNT in the queue item's otherwise
  # unused src/tgt bytes -- no struct change, no SCHEMA_VERSION bump.
  # POTENCY IS THE COPY COUNT, not the offer size: DiscoveryAction's `amount`
  # (:65-81) decides how many stat-equivalent copies of the CHOSEN card are
  # created, so Sacred Bark (potency 1 -> 2) gives TWO copies of one card, and
  # never changes the three-card offer or the pool. Each copy costs 0 for the
  # turn (setCostForTurn(0), :61-62) and spills to the discard pile at a full
  # hand. The offer is three DISTINCT cardIDs, rejection-sampled with ONE
  # cardRandomRng draw per attempt (:105-120).
  # They stay `native` rather than becoming data programs even though DISCOVERY
  # is a GENERAL op: a data step's `extra` becomes item.flags, and for a
  # DISCOVERY item flags IS the persisted offer, so a naive authoring would
  # mispack the item -- and the generator's domain check cannot catch that.
  # KNOWN OPEN QUESTION, carried in the ledger's Deferred obligations: whether
  # DiscoveryAction's per-update-tick regeneration of the offer (:47, outside the
  # duration branch) spends a SECOND round of cardRandomRng draws in the real
  # game. It is frame-driven and cannot be settled from source. Modeled here as
  # generate-once-and-latch, which is what the already-landed Discovery CARD does.
  native: true
  provenance: "AttackPotion.use (AttackPotion.java:40-42), getPotency (:44-46) -- addToBot DiscoveryAction(CardType.ATTACK, potency); DiscoveryAction.generateCardChoices (DiscoveryAction.java:105-120) rejection-samples 3 distinct ids at one cardRandomRng draw each, selection (:53-85) makes `amount` cost-0-this-turn copies of the chosen card"

