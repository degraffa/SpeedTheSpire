- id: 30
  name: SNECKO_OIL
  game_id: "SneckoOil"
  rarity: RARE
  potency: 5
  # UN-DEFERRED (wave-C potions stage): a two-step DATA program on the new
  # RANDOMIZE_HAND_COST opcode (60). SneckoOil.use (SneckoOil.java:41-46) is
  # exactly two addToBots -- DrawCardAction(player, potency) then
  # RandomizeHandCostAction() -- so the draw resolves FIRST and the randomize
  # sees the POST-draw hand: it re-costs the WHOLE hand, including the five cards
  # just drawn, not only the drawn ones. (This row used to say "randomize THEIR
  # costs"; that was the wrong reading of the second addToBot.)
  # RandomizeHandCostAction.update (:26-38) rolls one cardRandomRng.random(3)
  # (0..3 INCLUSIVE) per hand card whose BASE cost is non-negative, in hand
  # order, writing `costForTurn = cost = newCost` -- PERMANENT for the instance,
  # not this-turn. A card that rolls its own current cost still spends the draw;
  # an X-cost or unplayable card spends none.
  # The RoomPhase.COMBAT guard at :42 is the run layer's, exactly as for Blessing
  # of the Forge: a potion USE is offered only in RunPhase::COMBAT
  # (combat_potion_legal) or through the two-potion out-of-combat whitelist,
  # which this is not on.
  effects:
    - {op: DRAW, target: SELF, amount: 5}
    - {op: RANDOMIZE_HAND_COST, target: SELF}
  provenance: "SneckoOil.use (SneckoOil.java:41-46), getPotency (:49-51) -- addToBot DrawCardAction(player, potency) then addToBot RandomizeHandCostAction; RandomizeHandCostAction.update (RandomizeHandCostAction.java:26-38) rolls one cardRandomRng.random(3) per hand card with cost >= 0"

- id: 31
  name: FAIRY_POTION
  game_id: "FairyPotion"
  rarity: RARE
  potency: 30
  # NOT out-of-combat -- IN COMBAT AND OUT, on ANY lethal HP write. The row said
  # "out-of-combat auto-trigger" and that was wrong: the trigger site is
  # AbstractPlayer.damage (AbstractPlayer.java:1482-1497), the ORDINARY damage
  # path, which serves combat damage, self-inflicted HP loss and event damage
  # alike. IMPLEMENTED (wave-C potions stage).
  # It is still never USED -- canUse() is `return false` (FairyPotion.java:47-50)
  # -- so it stays `native`, potion_use_implemented correctly still answers false
  # for it, and combat_potion_legal keeps rejecting it by name. Discarding one is
  # legal, in combat and out.
  # Revive to potency% of MAX HP with the current HP first PINNED TO 0, so the
  # result is exactly the heal, never hp + heal; the min-1 clamp is on the HEAL.
  # In combat Magic Flower's x1.5 applies (its onPlayerHeal is phase==COMBAT
  # gated); out of combat it does not.
  # ORDER: Mark of the Bloom (no S1 row) blocks the whole branch; a held Fairy
  # BEATS a Lizard Tail, and because the tail arm is an `else if` on hasPotion
  # the tail is not even consulted. Exactly ONE fairy per lethal event, LEFTMOST
  # slot first -- the Java loop returns on the first match.
  # Sacred Bark doubles potency 30 -> 60, i.e. a revive at 60% of max HP.
  native: true
  provenance: "FairyPotion (FairyPotion.java:36-45 use, :47-50 canUse=false, :52-55 getPotency 30) -- on-lethal revive to (int)(maxHealth * potency/100f), floored up to 1, onto a currentHealth pinned at 0; trigger site AbstractPlayer.damage (AbstractPlayer.java:1482-1497), which is BOTH the in-combat and out-of-combat HP-loss path"

