# relics.yaml -- relic registry (rules-as-data, design doc B §4.2 / §5.3).
#
# Entry shape (frozen; B3.24 defines it following the powers.yaml hooks:/native:
# precedent from B3.2):
#   - id: <int>            numeric enum value -- append-only, NEVER renumbered
#     name: <SYMBOL>       generated enum symbol (RelicId::<SYMBOL>)
#     game_id: "<string>"  the game's relicId string (AbstractRelic ID) --
#                          translator/oracle join key
#     tier: STARTER|COMMON|UNCOMMON|RARE|BOSS|SHOP|SPECIAL|EVENT   (RelicTier)
#     pool_order: <int>    REQUIRED for the five dungeon-pool tiers. Canonical
#                          pre-shuffle RelicLibrary.populateRelicPool order;
#                          unique/contiguous within a tier. Omit for non-pool rows.
#     initial_counter: <int16> OPTIONAL; defaults to AbstractRelic's -1. Encodes
#                          constructor/onEquip state in RunState RelicSlot.
#     native: <bool>       OPTIONAL; true -> the relic's hook BODIES are hand-written
#                          C++ rather than a data-bound effect program -- for
#                          counter/conditional/heal relics. This flag is not prose:
#                          the dispatch table is GENERATED from this file. Each
#                          `native: true` row emits one X(<NAME>, relic_native_
#                          <name>) entry of the STS_REGISTRY_NATIVE_RELICS X-macro
#                          in the generated relic_table.hpp
#                          (tools/registry_gen/stsgen/emit/relics.py, sharing
#                          powers.py's native_dispatch_macro). relic_hooks.cpp
#                          expands that one list TWICE -- once for the extern
#                          declarations, once for the RelicId -> handler switch
#                          behind dispatch_native_relic_hook -- so the table is a
#                          projection of the registry, never a hand-maintained
#                          switch. That is what makes relic batches parallel-safe:
#                          a new batch adds rows here plus a translation unit under
#                          src/engine/relics/ and never edits relic_hooks.cpp.
#                          Handler names follow the frozen convention: the row name
#                          lowercased, e.g. BLUE_CANDLE -> relic_native_blue_candle.
#                          LINK ERROR, NEVER A SILENT NO-OP: the handler is odr-used
#                          at the expansion site, so a row marked native whose body
#                          nobody wrote is an UNDEFINED REFERENCE at link time (the
#                          old hand-written switch answered `default: return nullptr`
#                          and quietly did nothing -- that failure mode is gone). The
#                          declarations use RelicNativeSig, so a body whose signature
#                          drifts also fails to link.
#                          DELIBERATE-NO-OP CONVENTION: "native, but the combat body
#                          is DEFERRED" can no longer be expressed by omission. Such
#                          a relic must define an EXPLICIT EMPTY handler in its batch
#                          translation unit (src/engine/relics/relics_b3_*.cpp),
#                          carrying the reason and the Java citation in the comment
#                          above it. That empty definition IS the record of the
#                          decision -- see the "DEFERRED combat bodies" sections of
#                          relics_b3_24.cpp / relics_b3_25.cpp.
#                          A native relic still LISTS the hooks it responds to, each
#                          with an EMPTY program, so the framework routes them. The
#                          generator enforces both directions and fails loud: a hook
#                          with steps AND `native: true` is an error, and a hook with
#                          an empty program on a row that is NOT native is an error.
#     hooks:               OPTIONAL; RelicHook -> effect program (reusing the
#                          CardEffectStep shape). Each key is a RelicHook name
#                          (relic_hooks.hpp); the value is a list of
#                          {op, target, amount[, power]} steps queued (addToBot) in
#                          list order when the hook fires, resolved relative to the
#                          player (SELF == the player; ALL_ENEMY/RANDOM_ENEMY fan
#                          out over the player's enemies at execute time). Unlike
#                          powers, a relic step's amount is ALWAYS a literal (relics
#                          carry no stack amount).
#     pickup:              OPTIONAL; the OUT-OF-COMBAT (run-layer) surfaces this
#                          relic OVERRIDES, one key per surface, value always
#                          `true` (omit the key to mean "no override" -- there is
#                          no `false` spelling). Each listed key means a native
#                          handler for that surface exists in the relic's tier
#                          translation unit under src/engine/relics/; the handler
#                          is odr-used by the generated dispatch table, so a key
#                          with no handler is a LINK ERROR, never a silent no-op
#                          (the same guarantee `native:`+`hooks:` gives combat).
#                            can_spawn:      AbstractRelic.canSpawn override
#                                            -> relic_can_spawn_<name>, consulted
#                                            during pool draws (relic_pools.cpp).
#                                            RNG-VISIBLE: a wrong gate changes the
#                                            relicRng draw order.
#                            on_equip:       instantObtain/onEquip RunState effect
#                                            -> relic_on_equip_<name>, run by
#                                            acquire_relic after the slot append.
#                            on_obtain_card: onObtainCard effect -> handler
#                                            relic_on_obtain_card_<name>. The macro
#                                            is emitted but NOT YET CONSUMED (the
#                                            run_deck.hpp switch still hand-rolls
#                                            it), so these keys are declarative
#                                            only until that wiring lands.
#                          Derive participation from the relic's Java, NOT from
#                          what the engine currently implements. An onEquip that
#                          only initializes the relic's own counter is ALREADY
#                          modelled by `initial_counter` and does NOT take the key
#                          (HappyFlower/TinyChest/Sundial `this.counter = 0`);
#                          neither does a purely cosmetic one (Circlet.onEquip is
#                          `this.flash()`). An override the engine has DEFERRED
#                          still takes the key -- its handler is an explicit empty
#                          body carrying the deferral reason and citation, so the
#                          deferral is on the record in code rather than a hole.
#     provenance: "<Class.method (File.java:line) -- read in full>"
#
# SCOPE (B3.24): Burning Blood (Ironclad starter) + the Ironclad-obtainable COMMON
# pool. Enumerated from RelicLibrary.initialize() (RelicLibrary.java:231-368 shared
# `add()` + :382 `addRed()`), filtered to RelicTier.COMMON per-file. EXCLUDED as
# NOT Ironclad-obtainable: Damaru (addPurple/Watcher), DataDisk (addBlue/Defect),
# SneckoSkull (addGreen/Silent), Test5 (unused). RedSkull is the only RED common.
# Uncommon/rare/boss/shop/special tiers land with B3.25-B3.27.
#
# SCOPE (B3.25): + the Ironclad-obtainable UNCOMMON pool (ids 36-65). Enumerated
# from RelicLibrary.initialize() constructor tiers (each relic file's
# super(..., RelicTier.UNCOMMON, ...)): 28 shared `add()` uncommons + the 2 red
# `addRed()` uncommons (PaperFrog, SelfFormingClay). EXCLUDED as NOT
# Ironclad-obtainable: NinjaScroll + PaperCrane (addGreen/Silent), GoldPlatedCables
# + SymbioticVirus (addBlue/Defect), TeardropLocket + Duality (addPurple/Watcher);
# Test1/Test6/DiscerningMonocle (UNCOMMON ctors but never registered in
# initialize()); DEPRECATEDYin/DEPRECATEDDodecahedron (deprecated pkg, never
# registered). UNCOMMON pool_order 0..29 is the canonical pre-shuffle
# RelicLibrary.populateRelicPool order, derived by inverting the JDK shuffle
# (relicRng draw #2) against the live b14_accept oracle captures for seeds
# 1790050543751..1790050543753 -- all three seeds agree (relic_pools_test.cpp
# pins the three shuffled orders).
#
# Trigger dispatch fires relics in ACQUISITION ORDER (design doc §4.3 / stage-a
# trap 8): the framework iterates the relic list index 0..count-1 at each hook site
# (relic_hooks.cpp). Combat storage of the relic list on CombatState is a B4.3
# additive-field concern (schema owner); until it lands the dispatch sites in
# power_hooks.cpp/action_queue.cpp are wired but read an empty relic view (no-op),
# and the acquisition-order + per-relic behaviour is proven by relic_hooks_test.cpp
# constructing relic lists directly.

