  provenance: "PenNib (PenNib.java:36-62; this row and ledger row 97 previously cited :40-56 / :44-47, both wrong -- onUseCard is :36-52, its counter == 10 branch :40-43, atBattleStart :54-62). onUseCard: if card.type == ATTACK then ++counter; `if (counter == 10) counter = 0;` else `if (counter == 9)` addToBot ApplyPowerAction(player, player, PenNibPower(player, 1), 1, true) behind a cosmetic RelicAboveCreatureAction. The 9-vs-10 asymmetry IS the mechanic: the power is granted after the NINTH attack so the TENTH is the empowered one, and reaching ten resets without granting. atBattleStart re-grants when counter == 9 and does NOT touch the counter -- reachable because counter is RUN-persistent (fold_back_combat), so a fresh combat can open with the doubling already up. The 5-arg ApplyPowerAction's trailing boolean is a speed flag, not a semantic one; pulse and refreshHandLayout are presentation. counter starts at 0 from the ctor (:28), which is what initial_counter mirrors."

- id: 13
  name: RED_SKULL
  game_id: "Red Skull"
  tier: COMMON
  pool_order: 32
  native: true
  hooks:
    at_battle_start: []       # native: reset isActive, then the owner-specified entered-bloodied +3
    was_hp_lost: []           # onBloodied: cross to <=50% HP -> +3 Strength (once, while armed)
  provenance: "RedSkull, read in full, plus recovered RedSkull$1. `private boolean isActive` (:24) is NOT AbstractRelic.counter: the inherited oracle-visible counter remains -1 for the whole run (completed G7 capture g7_greedy_b153_20260729_200000_200011 STS200002 pins -1 from acquisition onward). The private latch lives in kCombatFlagRedSkullActive, never RelicSlot.counter. onBloodied (RedSkull.java:41-52) -- if !isActive && COMBAT phase (:45), addToTop ApplyPowerAction(StrengthPower 3) (:47), isActive = true (:49); routed through wasHPLost because AbstractPlayer.damage's bloodied cross (AbstractPlayer.java:1476-1481) fires it only when isBloodied flips false->true. onNotBloodied (:54-63) -- if isActive && COMBAT phase (:56), addToTop ApplyPowerAction(StrengthPower -3) (:58); then isActive = false (:61) OUTSIDE that block. The -3 goes through the ORDINARY APPLY_POWER door and Artifact eats it: a non-positive StrengthPower types itself DEBUFF (StrengthPower.java:37,81-89), so crossings are cumulative deltas, not an invariant. Red Skull is the only mechanical onNotBloodied implementor, so the combat cross rides a hand-written fan-out from heal_player_with_relics. The out-of-combat private write is behaviorally inert in this engine and intentionally stores nothing: no power survives the room boundary, onVictory clears isActive, and atBattleStart clears and re-derives it before the next possible read. ENTRY: preBattlePrep seeds isBloodied from currentHealth <= maxHealth/2 (AbstractPlayer.java:1575); atBattleStart (:35-39) clears isActive and addToBots recovered RedSkull$1, whose resolve-time `!isActive && player.isBloodied` grants direct +3 and sets the private bit after top-queued battle-start heals settle. Red Skull is unique in the S1 pools, making one combat-global bit the exact reachable shape; no schema/layout change."

