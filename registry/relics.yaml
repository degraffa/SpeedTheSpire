# --- Boss (Ironclad-obtainable) ---------------------------------------------------
#
# SCOPE: the Ironclad-obtainable BOSS pool -- 22 rows, ids 112-133. Enumerated from
# RelicLibrary.initialize() (RelicLibrary.java:229-403) filtered to
# RelicTier.BOSS per-file: 19 shared `add()` boss relics plus the three
# `addRed()` ones (BlackBlood, MarkOfPain, RunicCube). EXCLUDED as NOT
# Ironclad-obtainable: HoveringKite / RingOfTheSerpent / WristBlade (addGreen,
# Silent), FrozenCore / Inserter / NuclearBattery (addBlue, Defect), HolyWater /
# VioletLotus (addPurple, Watcher). The count and membership match the live
# oracle's `relicPools.boss` exactly for all ten b14_accept captures
# (STS00001..STS00010).
#
# S1 REACHABILITY: this pool is drawn only through Neow's category-3 boss-relic
# swap (NeowReward.getRewardOptions case 3 -> NeowRewardType.BOSS_RELIC ->
# returnRandomRelic(BOSS), NeowReward.java:123-127, :242-246) -- the frozen scope
# decision in design 5.6. The FIVE relicRng shuffles run unconditionally at
# dungeon init whether or not the pool is ever drawn from, so the row set and its
# pool_order are RNG-visible on every seed.
#
# BOSS pool_order 0..21 is the canonical PRE-shuffle
# RelicLibrary.populateRelicPool order, recovered by inverting the JDK shuffle
# (relicRng randomLong draw #5 -- COMMON, UNCOMMON, RARE, SHOP, BOSS in
# AbstractDungeon.initializeRelicList order, AbstractDungeon.java:1237-1241)
# against those ten captures; all ten agree, and the SAME inversion reproduces
# the already-committed COMMON, UNCOMMON, RARE and SHOP pool_order exactly, which
# is what validates the method rather than merely fitting it.
#
# ENERGY MASTER -- one mechanism shared by ten of these rows, now LIVE. Ten boss
# relics do `++AbstractDungeon.player.energy.energyMaster` in onEquip (Fusion
# Hammer, Velvet Choker, Runic Dome, Cursed Key, Busted Crown, Ectoplasm, Sozu,
# Philosopher's Stone, Coffee Dripper, Mark of Pain), and Slaver's Collar does it
# conditionally in beforeEnergyPrep. The engine still has no energyMaster FIELD:
# `energy_master(const CombatState&)` (action_queue.hpp / .cpp) DERIVES it by
# scanning the combat relic mirror, and the recharge line inside start_of_turn is
# its one consumer (EnergyManager.recharge, EnergyManager.java:25-41; the turn-1
