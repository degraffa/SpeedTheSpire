#                      (TheCity.java:190).
#   Nilry's Codex      CursedTome.java:150-151; same event, same gate.
#   Necronomicon       CursedTome.java:144-145; same event, same gate.
#   Mutagenic Strength DrugDealer.java:73; 'Drug Dealer' is TheCity's (TheCity.java:191).
#   N'loth's Gift      Nloth.java:61-84; the N'loth specialOneTimeEvent is act-gated
