# --- Special: the Act-1-event-reachable SPECIAL tier ------------------------------
#
# SCOPE: ids 134-142, the nine SPECIAL-tier relics an Ironclad can obtain in Act 1,
# alongside the two already registered (Circlet id 35, Odd Mushroom id 111). No
# SPECIAL relic is a member of any shuffled dungeon pool, so none carries a
# pool_order and none is relicRng-visible; they are acquired by an event or by Neow.
#
# The full registered SPECIAL set is 18 rows (RelicLibrary.initialize; RedCirclet
# is never registered, so getRelic falls back to Circlet -- the note on id 35).
# Reachability was resolved per relic against the S1 event set: Exordium's 11
# eventList entries + 6 shrineList entries (Exordium.java:223-246) and the shared
# specialOneTimeEventList (AbstractDungeon.java:1340-1358) filtered by
# AbstractDungeon.getShrine's per-event act gates (:1882-1942).
